                  {a.note ? ` · ${a.note}` : ''}
                </p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                {statusBadge(a)}
                {a.status !== 'done' && (
                  <button onClick={() => goRunner(a.assetId, a.id)} className="text-xs bg-brand-600 hover:bg-brand-700 text-white rounded-lg px-2.5 py-1.5">اجرای چک‌لیست</button>
                )}
              </div>
            </div>
          ))}
          {myTasks.length === 0 && <p className="p-6 text-center text-slate-400 text-sm">در حال حاضر وظیفه‌ای برای شما ثبت نشده است.</p>}
        </div>
      </div>

      {canViewAll && (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
          <div className="p-4 border-b border-slate-100 font-bold text-slate-800 text-sm">همه‌ی وظایف (مدیریت)</div>
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr><th className="p-3 text-right">تجهیز</th><th className="p-3 text-right">قالب</th><th className="p-3 text-right">محول به</th><th className="p-3 text-right">مهلت</th><th className="p-3 text-right">وضعیت</th><th className="p-3 text-right">عملیات</th></tr>
            </thead>
            <tbody>
              {allTasks.map(a => (
                <tr key={a.id} className="border-t border-slate-100">
                  <td className="p-3">{assetLabel(a.assetId)}</td>
                  <td className="p-3">{templateName(a.templateId)}</td>
                  <td className="p-3">{userName(a.assignedToUserId)}</td>
                  <td className="p-3">{a.dueDate ? toPersianDigits(a.dueDate) : '—'}</td>
                  <td className="p-3">{statusBadge(a)}</td>
                  <td className="p-3 flex gap-1.5">
                    <button onClick={() => toggleDone(a)} className="text-xs bg-slate-100 hover:bg-slate-200 rounded-lg px-2.5 py-1.5">
                      {a.status === 'done' ? 'بازگشایی' : 'انجام‌شده'}
                    </button>
                    <button onClick={() => setConfirmDel(a)} className="text-xs bg-danger-50 text-danger-700 hover:bg-danger-100 rounded-lg px-2.5 py-1.5">حذف</button>
                  </td>
                </tr>
              ))}
              {allTasks.length === 0 && <tr><td colSpan={6} className="p-6 text-center text-slate-400 text-sm">هنوز وظیفه‌ای ثبت نشده است.</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {canManage && (
        <Modal open={showForm} onClose={() => setShowForm(false)} title="واگذاری وظیفه جدید" wide>
          <AssignmentForm users={activeUsers} assets={data.assets} templates={data.templates} onSave={assignTask} onCancel={() => setShowForm(false)} />
        </Modal>
      )}

      <ConfirmDialog open={!!confirmDel} title="حذف وظیفه" danger
        message="این وظیفه برای همیشه حذف می‌شود. ادامه می‌دهید؟"
        onConfirm={() => deleteTask(confirmDel)} onCancel={() => setConfirmDel(null)} />
    </div>
  );
}

/* ============================================================
   ۲۲. پوسته اصلی برنامه (منو، ناوبری، پنهان‌سازی بر اساس نقش)
   ============================================================ */
const NAV_ITEMS = [
  { key: 'dashboard', label: 'داشبورد', icon: '🏠' },
  { key: 'runner', label: 'اجرای بازرسی', icon: '📝' },
  { key: 'coverage', label: 'بازرسی دوره‌ای', icon: '🗓️' },
  { key: 'correctives', label: 'اقدام اصلاحی', icon: '🔧' },
  { key: 'assets', label: 'تجهیزات', icon: '🗄️' },
  { key: 'records', label: 'سوابق', icon: '📊' },
  { key: 'templates', label: 'قالب‌های چک‌لیست', icon: '📋' },
  { key: 'tasks', label: 'وظایف', icon: '🗒️' },
  { key: 'signQueue', label: 'در انتظار امضا', icon: '✍️' },
  { key: 'users', label: 'کاربران', icon: '👥' },
  { key: 'settings', label: 'تنظیمات', icon: '⚙️' },
  { key: 'help', label: 'راهنما', icon: '❓' },
];

function AppShell() {
  const { currentUser, logout, data, perms } = useAppData();
  const [page, setPage] = useState('dashboard');
  const [runnerAssetId, setRunnerAssetId] = useState(null);
  const [runnerAssignmentId, setRunnerAssignmentId] = useState(null);
  const [focusRecordId, setFocusRecordId] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [showPwModal, setShowPwModal] = useState(false);
  const [showUserMenu, setShowUserMenu] = useState(false);
  // «امضای حضوری در محل»: رکورد چندامضایی که تازه ثبت شده و می‌خواهیم بپرسیم
  // گیرنده‌ی مرحله‌ی بعد الان در محل حاضر است یا نه.
  const [onsiteRec, setOnsiteRec] = useState(null);

  const myPages = useMemo(() => (perms && perms.pages) || effectivePages(currentUser), [perms, currentUser]);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const scan = params.get('scan');
    if (scan) {
      // «مصرف یک‌باره»: پارامتر scan فوراً از نوار آدرس پاک می‌شود — چه تجهیز
      // پیدا شود چه نه، چه صفحه‌ی اجرا با موفقیت باز شود چه بعداً خطایی بدهد.
      // قبلاً این پارامتر در URL باقی می‌ماند؛ اگر صفحه‌ی اجرا برای همان تجهیز
      // (مثلاً چون هنوز زیرسیستمی ثبت نشده) کرش می‌کرد، هر بار که کاربر برنامه
      // را دوباره باز می‌کرد (رفرش/برگشت به تب/باز شدن دوباره‌ی اپ اندروید با
      // همان URL آخر)، همین مسیر خرابی از نو اجرا می‌شد و برنامه هیچ‌وقت بالا
      // نمی‌آمد. حالا حتی اگر رندر یک‌بار خطا بدهد، تلاش بعدی از یک URL تمیز
      // (بدون scan) شروع می‌شود.
      try {
        const url = new URL(window.location.href);
        url.searchParams.delete('scan');
        window.history.replaceState(null, '', url.pathname + url.search + url.hash);
      } catch (e) { /* اگر URL API در دسترس نبود، بی‌خطر رد می‌شویم */ }
      if (myPages.includes('runner')) {
        const asset = data.assets.find(a => a.id === scan || a.code === scan);
        if (asset) { setRunnerAssetId(asset.id); setPage('runner'); }
      }
    }
    // eslint-disable-next-line
  }, []);

  // شمارنده‌ی «در انتظار امضا» روی آیتم منو، تا درخواست معوق دیده نشود
  // شمارنده‌ی منو = «چیزهایی که خطاب به خودت در انتظار امضاست». صف جانشینی
  // ادمین عمداً شمرده نمی‌شود، وگرنه برای ادمین همیشه یک عدد بزرگ و بی‌معنی
  // نمایش داده می‌شد (رفع ایراد P2-۷).
  const pendingSignCount = useMemo(
    () => buildSignQueue((data && data.records) || [], currentUser, perms).toSign.length,
    [data, currentUser, perms]
  );
  const visibleNav = NAV_ITEMS.filter(n => myPages.includes(n.key));
  const goPage = (p) => { if (!myPages.includes(p)) return; setPage(p); setSidebarOpen(false); };
  const goRunner = (assetId, assignmentId) => {
    if (!myPages.includes('runner')) return;
    setRunnerAssetId(assetId); setRunnerAssignmentId(assignmentId || null); setPage('runner'); setSidebarOpen(false);
  };
  // پرش به صفحه سوابق و باز کردن جزئیات یک رکورد مشخص
  const goRecord = (recordId) => {
    if (!myPages.includes('records')) return;
    setFocusRecordId(recordId || null); setPage('records'); setSidebarOpen(false);
  };

  let content;
  if (page === 'dashboard') content = <DashboardPage goPage={goPage} goRunner={goRunner} />;
  else if (page === 'runner') content = <RunnerPage assetId={runnerAssetId} assignmentId={runnerAssignmentId} onFinish={(rec) => {
    // مودال «امضای حضوری» فقط وقتی لازم است که مرحله‌ی فعالی باقی مانده باشد و
    // آن مرحله از ابتدا «ارجاعی» تعیین نشده باشد. امضاهای حضوریِ گرفته‌شده در
    // خودِ فرم (با زدن دکمه‌ی «حضوری») زنجیره را جلو برده‌اند، پس دوباره پرسیده
    // نمی‌شود؛ این مودال فقط تورِ امنِ مرحله‌هایی است که پدشان بسته شده.
    const sr = rec ? normalizeSignRequest(rec.signRequest) : null;
    const step = sr ? activeSignStep(sr) : null;
    if (step && !step.skipOnsitePrompt) setOnsiteRec(rec);
    goPage('records');
  }} />;
  else if (page === 'coverage') content = <CoveragePage goRunner={goRunner} />;
  else if (page === 'correctives') content = <CorrectivesPage goRecord={goRecord} />;
  else if (page === 'assets') content = <AssetsPage goRunner={goRunner} />;
  else if (page === 'records') content = <RecordsPage focusRecordId={focusRecordId} onFocusHandled={() => setFocusRecordId(null)} />;
  else if (page === 'templates') content = <TemplatesPage />;
  else if (page === 'tasks') content = <TasksPage goRunner={goRunner} />;
  else if (page === 'signQueue') content = <SignQueuePage goRecord={goRecord} />;
  else if (page === 'users') content = (perms && perms.isAdmin) ? <UsersPage /> : <NoAccess what="فقط ادمین به این صفحه دسترسی دارد." />;
  else if (page === 'settings') content = (perms && perms.isAdmin) ? <SettingsPage /> : <NoAccess what="فقط ادمین به این صفحه دسترسی دارد." />;
  else if (page === 'help') content = <HelpPage />;
  else content = <DashboardPage goPage={goPage} goRunner={goRunner} />;

  return (
    <div className="min-h-screen flex">
      {sidebarOpen && <div className="fixed inset-0 bg-slate-900/40 z-30 sm:hidden no-print" onClick={() => setSidebarOpen(false)}></div>}

      <aside className={
        "no-print fixed sm:sticky top-0 h-screen w-64 bg-slate-900 text-slate-300 z-40 transition-transform duration-200 " +
        (sidebarOpen ? "translate-x-0" : "translate-x-full sm:translate-x-0")
      } style={{ right: 0 }}>
        <div className="p-5 border-b border-white/10">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">د</div>
            <div>
              <p className="text-white font-bold text-sm leading-tight">چک‌لیست درکاو</p>
              <p className="text-xs text-slate-500">{data.settings.orgName}</p>
            </div>
          </div>
        </div>
        <nav className="p-3 space-y-1">
          {visibleNav.map(n => (
            <button key={n.key} onClick={() => goPage(n.key)}
              className={"w-full text-right flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm transition " +
                (page === n.key ? "bg-brand-600 text-white" : "hover:bg-white/5 text-slate-300")}>
              <span>{n.icon}</span><span className="flex-1">{n.label}</span>
              {n.key === 'signQueue' && pendingSignCount > 0 && (
                <span className="shrink-0 min-w-[1.4rem] px-1.5 py-0.5 rounded-full bg-warn-500 text-slate-900 text-[11px] font-bold text-center">
                  {toPersianDigits(pendingSignCount)}
                </span>
              )}
            </button>
          ))}
        </nav>
        <div className="absolute bottom-0 inset-x-0 p-3 border-t border-white/10">
          <button onClick={logout} className="w-full text-right px-3.5 py-2.5 rounded-xl text-sm text-slate-300 hover:bg-white/5 flex items-center gap-2.5">
            <span>🚪</span>خروج از حساب
          </button>
        </div>
      </aside>

      <div className="flex-1 min-w-0">
        <header className="no-print sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 py-3">
          <button onClick={() => setSidebarOpen(true)} className="sm:hidden w-9 h-9 rounded-lg hover:bg-slate-100">☰</button>
          <h1 className="font-bold text-slate-800 hidden sm:block">{visibleNav.find(n => n.key === page)?.label}</h1>
          <div className="flex items-center gap-2">
            <SyncIndicator />
            <div className="relative">
            <button onClick={() => setShowUserMenu(s => !s)} className="flex items-center gap-2 px-3 py-1.5 rounded-xl hover:bg-slate-100">
              <span className="w-7 h-7 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-xs font-bold">{(currentUser && currentUser.name && currentUser.name[0]) || '?'}</span>
              <span className="text-sm text-slate-700 hidden sm:inline">{currentUser && currentUser.name}</span>
              <Badge tone="brand">{ROLE_LABELS[currentUser && currentUser.role]}</Badge>
            </button>
            {showUserMenu && (
              <div className="absolute left-0 mt-2 bg-white border border-slate-200 rounded-xl shadow-lg w-48 py-1.5 z-30">
                <button onClick={() => { setShowPwModal(true); setShowUserMenu(false); }} className="w-full text-right px-4 py-2 text-sm hover:bg-slate-50">تغییر رمز عبور</button>
                <button onClick={logout} className="w-full text-right px-4 py-2 text-sm hover:bg-slate-50 text-danger-600">خروج</button>
              </div>
            )}
            </div>
          </div>
        </header>
        <main className="p-4 sm:p-6">{content}</main>
      </div>

      <ChangePasswordModal open={showPwModal} onClose={() => setShowPwModal(false)} />
      <OnSiteSignModal rec={onsiteRec} onClose={() => setOnsiteRec(null)} />
    </div>
  );
}

/* ============================================================
   ۲۳. ریشه برنامه و راه‌اندازی
   ============================================================ */
/**
 * تور امنیتی آخر: پیش از این، هیچ ErrorBoundary در برنامه نبود، پس یک خطای
 * رندر ناگهانی در هر صفحه‌ای (مثلاً RunnerPage با تجهیز/زیرسیستم نامعتبر)
 * کل درخت React را بدون هیچ پیامی سفید می‌کرد و کاربر فکر می‌کرد «برنامه
 * دیگر بالا نمی‌آید» — چون با هر بار باز کردن دوباره (رفرش/برگشت به اپ)،
 * همان مسیر خراب دوباره اجرا و دوباره سفید می‌شد. حالا چنین خطایی این‌جا
 * گرفته می‌شود، پیام و راه‌حل نشان داده می‌شود و کاربر می‌تواند بدون از دست
 * دادن هیچ داده‌ای (داده‌ها در IndexedDB/localStorage دست‌نخورده می‌مانند)
 * دوباره تلاش کند.
 */
class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    console.error('خطای رندر گرفته‌نشده در برنامه', error, info && info.componentStack);
  }
  render() {
    if (this.state.error) {
      const msg = (this.state.error && (this.state.error.message || this.state.error.name)) || String(this.state.error);
      return (
        <div dir="rtl" className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
          <div className="max-w-md w-full bg-white rounded-2xl border border-danger-200 p-6 space-y-3 text-center">
            <p className="text-3xl">⚠️</p>
            <p className="font-bold text-slate-800">مشکلی در نمایش این صفحه پیش آمد</p>
            <p className="text-sm text-slate-500">داده‌های شما از دست نرفته؛ فقط همین صفحه دچار خطا شد. با «تلاش دوباره» برنامه از اول بارگذاری می‌شود.</p>
            <pre dir="ltr" className="text-left text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 overflow-x-auto text-danger-700 whitespace-pre-wrap break-all">{msg}</pre>
            <button onClick={() => location.reload()}
              className="w-full bg-brand-600 hover:bg-brand-700 text-white rounded-xl py-2.5 font-medium">
              🔄 تلاش دوباره
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function Root() {
  const { session, currentUser } = useAppData();
  // رفع باگ واقعی: اگر نشستِ ذخیره‌شده (مثلاً از «مرا به خاطر بسپار») به
  // کاربری اشاره کند که دیگر در فهرست کاربران نیست (حساب حذف/غیرفعال شده،
  // یا بعد از «پاک‌کردن داده‌ی محلی و شروع تازه» که کاربران را بازنشانی
  // می‌کند ولی نشستِ ماندگار جدا پاک نمی‌شد)، currentUser تا لحظه‌ی اجرای
  // afterward خروج در DataProvider، «null» است. صفحه‌های زیرِ AppShell
  // (Dashboard و ...) بدون گارد currentUser.name/.id را می‌خواندند →
  // ReferenceError-مانند «Cannot read properties of null (reading 'name')»
  // و کل صفحه سفید/کرش می‌شد. با این شرط، تا وقتی currentUser واقعی پیدا
  // نشود، مستقیم صفحه‌ی ورود نشان داده می‌شود؛ افکت خروج در DataProvider هم
  // هم‌زمان نشستِ خراب را پاک می‌کند.
  return (session && currentUser) ? <AppShell /> : <LoginScreen />;
}

function App() {
  return (
    <DataProvider>
      <AppErrorBoundary>
        <Root />
      </AppErrorBoundary>
    </DataProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<!--
  توضیح فنی: بلوک بالا با type="text/plain" علامت‌گذاری شده تا مرورگر آن را مستقیم اجرا نکند.
  اسکریپت زیر آن را با Babel و «runtime کلاسیک» (React.createElement) کامپایل می‌کند؛
  این کار به‌عمد به‌جای ترنسفورم خودکار Babel Standalone انجام می‌شود، چون حالت
  پیش‌فرض جدید Babel («automatic» JSX runtime) به ماژول react/jsx-runtime نیاز دارد
  که در بارگذاری ساده React از طریق تگ <script> (UMD/global) در دسترس نیست.
-->
<script>
  (function () {
    // اگر هر دو CDN برای کتابخانه‌های حیاتی شکست بخورند (قطعی شبکه، فیلترینگ،
    // یا مسدود بودن هر دو دامنه)، کاربر پیش‌تر فقط یک صفحه‌ی کاملاً سفید
    // می‌دید و هیچ سرنخی نداشت. حالا پیام صریح و قابل‌عمل نشان داده می‌شود.
    const missing = [];
    if (!window.React) missing.push('React');
    if (!window.ReactDOM) missing.push('ReactDOM');
    if (!window.Babel) missing.push('Babel');
    if (missing.length) {
      const box = document.createElement('div');
      box.setAttribute('dir', 'rtl');
      box.style.cssText = 'margin:8vh auto;max-width:34rem;padding:1.5rem;border:1px solid #fca5a5;' +
        'background:#fef2f2;border-radius:1rem;font-family:Tahoma,sans-serif;color:#7f1d1d;line-height:2;text-align:right';
      box.innerHTML =
        '<b style="font-size:1.05rem">⚠️ بارگذاری کتابخانه‌های اصلی ناموفق بود</b>' +
        '<p style="margin:.6rem 0 0">اجزای از دست رفته: <b>' + missing.join('، ') + '</b></p>' +
        '<p style="margin:.6rem 0 0">برای اجرای برنامه، این کتابخانه‌ها باید از اینترنت بارگذاری شوند. ' +
        'مسیرهای امتحان‌شده: <code>unpkg.com</code> و <code>cdn.jsdelivr.net</code>.</p>' +
        '<p style="margin:.6rem 0 0">راه‌حل‌ها: اتصال اینترنت/VPN را بررسی کنید، یا اگر در شبکه‌ی داخلی هستید ' +
        'این دو دامنه را در فهرست مجاز فایروال قرار دهید. سپس صفحه را تازه کنید.</p>' +
        '<p style="margin:.6rem 0 0"><button onclick="location.reload()" style="padding:.5rem 1rem;border-radius:.6rem;' +
        'border:1px solid #b91c1c;background:#fff;color:#b91c1c;cursor:pointer;font-family:inherit">↻ تلاش دوباره</button></p>';
      document.body.appendChild(box);
      return;
    }

    const source = document.getElementById('app-source').textContent;
    const output = Babel.transform(source, {
      presets: [
        ['react', { runtime: 'classic' }],
        ['env', { modules: false }],
      ],
      filename: 'app.jsx',
    }).code;
    const scriptEl = document.createElement('script');
    scriptEl.textContent = output;
    document.body.appendChild(scriptEl);
