/** کلاینت قدیمی کل DB را می‌فرستد؛ ما آن را به عملیات per-entity تبدیل می‌کنیم. */
function handleLegacyCloudPush(ss, body) {
  var data = body.data;
  if (!data || typeof data !== "object") return err("فیلد data ارسال نشد.");
  var at = toMs(body.meta && body.meta.at) || nowMs();
  var applied = 0, conflicts = [];

  ENTITY_NAMES.forEach(function (entity) {
    var list = data[entity];
    if (!Array.isArray(list)) return;
    list.forEach(function (item) {
      if (!item || !item.id) return;
      item.updatedAt = toMs(item.updatedAt) || at;
      if (entity === "users") normalizeUser_(item);
      if (entity === "records") externalizeSignatures_(ss, item, body);
      if (entity === "records") externalizePhotos_(ss, item, body);
      var res = upsertEntity(ss, entity, item, {});
      if (res.applied) applied++;
      else if (res.reason === "SERVER_NEWER") conflicts.push({ entity: entity, id: String(item.id) });
    });
  });

  if (data.settings) {
    var patch = {};
    if (data.settings.orgName !== undefined) patch.orgName = data.settings.orgName;
    if (data.settings.passThreshold !== undefined) patch.passThreshold = data.settings.passThreshold;
    if (data.settings.managerPinHash) {
      patch.managerPinHash = data.settings.managerPinHash;
      patch.managerPinSalt = data.settings.managerPinSalt || "";
      patch.managerPinAlgo = data.settings.managerPinHashAlgo || "sha256";
      patch.managerPinIterations = toNum(data.settings.managerPinIterations || 0);
    }
    if (Object.keys(patch).length) setSettings(ss, patch);
  }
  if (Array.isArray(data.categories) && data.categories.length) {
    applyCategoriesSet_(ss, data.categories); // مهاجرت کل پایگاه: سطح اعتماد bootstrap، نه RBAC عادی
  }

  var revision = bumpRevision(ss);
  return {
    ok: true, status: "success", message: "اطلاعات در پایگاه ابری ذخیره شد.",
    revision: revision, applied: applied, conflicts: conflicts, updatedAt: new Date().toISOString()
  };
}

/** برای کلاینت قدیمی: کل DB را در همان قالب قبلی برمی‌گردانیم. */
function handleLegacyCloudPull(ss) {
  var data = buildLegacySnapshot(ss);
  return { ok: true, status: "success", message: "دریافت از ابر انجام شد.", data: data, revision: getRevision(ss), meta: null, deleted: null };
}

function handleLegacyCloudMeta(ss) {
  return { ok: true, status: "success", exists: true, revision: getRevision(ss), updatedAt: new Date(nowMs()).toISOString(), counts: countAll(ss), meta: null };

function buildLegacySnapshot(ss) {
  var settings = getSettings(ss);
  var cats = readTable(ss, "categories").filter(function (c) { return !c.deleted; })
    .sort(function (a, b) { return toNum(a.order) - toNum(b.order); })
    .map(function (c) { return c.name; });

  var users = readTable(ss, "users").filter(function (u) { return !u.deleted; }).map(function (u) {
    var o = {
      id: u.id, username: u.username, name: u.name, role: u.role, active: toBool(u.active),
      passwordHash: u.passwordHash, salt: u.salt, hashAlgo: u.hashAlgo || "sha256",
      iterations: toNum(u.iterations), sessionVersion: toNum(u.sessionVersion) || 1,
      phone: u.phone || "", nationalId: u.nationalId || "",
      pages: typeof u.pages === "string" ? String(u.pages).split(",").filter(Boolean) : (u.pages || [])
    };
    return o;
  });

  var templates = readTable(ss, "templates").filter(function (t) { return !t.deleted; }).map(function (t) {
    return {
      id: t.id, name: t.name, category: t.category, passThreshold: toNum(t.passThreshold),
      archived: toBool(t.archived), items: Array.isArray(t.items) ? t.items : []
    };
  });

  var assets = readTable(ss, "assets").filter(function (a) { return !a.deleted; }).map(function (a) {
    return { id: a.id, code: a.code, name: a.name, location: a.location, serial: a.serial, templateId: a.templateId, category: a.category || "" };
  });

  var assignments = readTable(ss, "assignments").filter(function (a) { return !a.deleted; });
  var records = readTable(ss, "records").filter(function (r) { return !r.deleted; });

  return {
    version: 4,
    users: users, categories: cats, templates: templates, assets: assets,
    assignments: assignments, records: records,
    settings: {
      orgName: settings.orgName, passThreshold: settings.passThreshold,
      managerPinHash: settings.managerPinHash, managerPinSalt: settings.managerPinSalt,
      managerPinHashAlgo: settings.managerPinAlgo, managerPinIterations: settings.managerPinIterations,
      logoFileId: settings.logoFileId
    },
    revision: getRevision(ss),
    exportedAt: new Date().toISOString()
  };
}

function handleBackup(rootName, body) {

  var payload = body.payload || body.data || {};
  var backupFile = backupFolder.createFile(backupName, JSON.stringify(payload, null, 2), MimeType.PLAIN_TEXT);
  purgeOldBackups(backupFolder, 20);
  return { ok: true, status: "success", message: "نسخه پشتیبان در Google Drive ذخیره شد.", fileUrl: backupFile.getUrl() };
}

/** فقط فایل‌هایی که واقعاً پشتیبان این سامانه هستند پاک می‌شوند (ایراد ۴-۱۱). */
function purgeOldBackups(folder, keep) {
  var files = folder.getFiles();
  var list = [];
  while (files.hasNext()) {
    var f = files.next();
    var n = f.getName();
    if (!/^پشتیبان_\\d{4}-\\d{2}-\\d{2}_\\d+\\.json$/.test(n)) continue; // فایل دستی کاربر حفظ می‌شود
    list.push(f);
  }
  list.sort(function (a, b) { return b.getDateCreated().getTime() - a.getDateCreated().getTime(); });
  for (var i = keep; i < list.length; i++) { try { list[i].setTrashed(true); } catch (e) {} }
  return list.length;
}

function handleExportZip(rootName, body) {
  var year = body.year, month = body.month;
  if (!year || !month) return err("سال و ماه شمسی باید ارسال شود.");
  var rootFolder = getOrCreateFolder(DriveApp.getRootFolder(), rootName);
  var yearFolders = rootFolder.getFoldersByName(String(year));
  if (!yearFolders.hasNext()) return err("پوشه‌ی این سال یافت نشد.");
  var monthFolders = yearFolders.next().getFoldersByName(String(month));
  if (!monthFolders.hasNext()) return err("پوشه‌ی این ماه یافت نشد.");

  var blobs = [];
  collectPdfBlobs(monthFolders.next(), blobs);
  if (blobs.length === 0) return err("هیچ فایل PDF ای برای این بازه یافت نشد.");
  var zipBlob = Utilities.zip(blobs, year + "_" + month + ".zip");
  var exportFolder = getOrCreateFolder(rootFolder, "خروجی‌های فشرده");
  var zipFile = exportFolder.createFile(zipBlob);
  return { ok: true, status: "success", message: "فایل ZIP ساخته شد.", fileUrl: zipFile.getUrl(), count: blobs.length };
}

function collectPdfBlobs(folder, blobs) {
  var files = folder.getFiles();
  while (files.hasNext()) {
    var f = files.next();
    if (f.getMimeType() === MimeType.PDF) blobs.push(f.getBlob());
  }
  var sub = folder.getFolders();
  while (sub.hasNext()) collectPdfBlobs(sub.next(), blobs);
}

function migrateFromLegacyJson() {

  var json = JSON.parse(files.next().getBlob().getDataAsString());

function handleMigrateImport(ss, rootName, body) {

  var res = importLegacyData(ss, legacy, rootName);
  return { ok: true, status: "success", message: "مهاجرت انجام شد.", migration: res, revision: getRevision(ss) };
}

function importLegacyData(ss, legacy, rootName) {
  var at = nowMs();
  var counts = {};

  ENTITY_NAMES.forEach(function (entity) {
    if (entity === "categories") { counts[entity] = 0; return; } // از راه handleCategoriesSet وارد می‌شود
    var list = legacy[entity];
    if (!Array.isArray(list)) { counts[entity] = 0; return; }
    var n = 0;
    list.forEach(function (item) {
      if (!item) return;
      if (!item.id) item.id = entity.slice(0, 3) + "-" + sha256Hex(JSON.stringify(item)).slice(0, 12);
      item.updatedAt = toMs(item.updatedAt) || at;
      item.createdAt = toMs(item.createdAt) || item.updatedAt;
      if (entity === "users") {
        normalizeUser_(item);
        if (!item.hashAlgo) item.hashAlgo = "sha256";
      }
      if (entity === "records") externalizeSignatures_(ss, item, { rootName: rootName });
      if (entity === "records") externalizePhotos_(ss, item, { rootName: rootName });
      var res = upsertEntity(ss, entity, item, {});
      if (res.applied) n++;
    });
    counts[entity] = n;
  });

  var s = legacy.settings || {};
  setSettings(ss, {
    orgName: s.orgName || "",
    passThreshold: toNum(s.passThreshold === undefined ? 80 : s.passThreshold),
    managerPinHash: s.managerPinHash || "",
    managerPinSalt: s.managerPinSalt || "",
    managerPinAlgo: s.managerPinHashAlgo || (s.managerPinHash ? "sha256" : ""),
    managerPinIterations: toNum(s.managerPinIterations || 0)
  });
  if (Array.isArray(legacy.categories)) applyCategoriesSet_(ss, legacy.categories); // مهاجرت کل پایگاه

  var revision = bumpRevision(ss);
  return { counts: counts, revision: revision, importedAt: new Date().toISOString() };
}

/** tombstoneهای قدیمی‌تر از N روز را برای همیشه پاک می‌کند. */
function maintenancePurgeTombstones(days) {
  var ss = getDb();
  var cutoff = nowMs() - (toNum(days) || 30) * 86400000;
  var removed = {};
  ENTITY_NAMES.forEach(function (entity) {
    var def = SCHEMA[entity];
    var sh = getSheet(ss, def.sheet);
    var header = headerFor(def.sheet);
    var last = sh.getLastRow();
    if (last < 2) { removed[entity] = 0; return; }
    var vals = sh.getRange(2, 1, last - 1, header.length).getValues();
    var iDeleted = header.indexOf("deleted"), iUpdated = header.indexOf("updatedAt");
    var toDelete = [];
    for (var i = 0; i < vals.length; i++) {
      if (toBool(vals[i][iDeleted]) && toMs(vals[i][iUpdated]) < cutoff) toDelete.push(i + 2);
    }
    for (var k = toDelete.length - 1; k >= 0; k--) sh.deleteRow(toDelete[k]);
    removed[entity] = toDelete.length;
  });
  Logger.log(JSON.stringify(removed));
  return removed;
}

/* @core-start: transport */
function cloudFolderName(org) {
  const o = org || {};
  return (o.orgName ? o.orgName + ' - ' : '') + 'سامانه چک‌لیست درکاو';
}

/**
 * فراخوانی عمومی وب‌سرویس Google Apps Script.
 * content-type به‌عمد text/plain است تا مرورگر درخواست preflight (OPTIONS) نفرستد،
 * چون Apps Script از آن پشتیبانی نمی‌کند.
 */
async function callAppsScript(url, envelope) {
  if (!url) throw new Error('آدرس اسکریپت گوگل در تنظیمات وارد نشده است.');
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(envelope),
      redirect: 'follow',
    });
  } catch (e) {
    const netErr = new Error('اتصال شبکه برقرار نشد (اینترنت یا آدرس اسکریپت را بررسی کنید).');
    netErr.network = true;
    throw netErr;
  }
  let json;
  try { json = await res.json(); }
  catch (e) { throw new Error('پاسخ سرور قابل خواندن نبود (ممکن است آدرس اسکریپت نادرست باشد یا دیپلویمنت منقضی شده باشد).'); }
  if (!json || json.ok === false) {
    const e2 = new Error((json && (json.error || json.message)) || 'خطای نامشخص از سرور.');
    e2.code = json && json.code;
    e2.server = true;
    throw e2;
  }
  return json;
}

/**
 * ساخت پاکت درخواست با امضای HMAC (action|timestamp|nonce).
 * اگر سرور REQUIRE_SIGNATURE را فعال کرده باشد، این امضا الزامی است؛ در غیر
 * این صورت هم ارسال می‌شود و صرفاً هزینه‌ی ناچیزی دارد.
 */
async function buildEnvelope(action, payload, apiKey, folderName) {
  const ts = Date.now();
  const nonce = uid('n');
  const env = { action: action, apiKey: apiKey || '', ts: ts, nonce: nonce, payload: payload || {} };
  if (folderName) env.folderName = folderName;
  try { env.sig = await hmacSha256Hex(apiKey || '', [action, ts, nonce].join('|')); } catch (e) { /* امضا اختیاری است */ }
  return env;
}

async function signedCall(url, apiKey, action, payload, folderName) {
  const env = await buildEnvelope(action, payload, apiKey, folderName);
  return callAppsScript(url, env);
}
/* @core-end: transport */

/**
 * نسخه‌ی Code.gs که **این فایل** انتظار دارد.
 *
 * عمداً از دلِ خودِ `APPS_SCRIPT_CODE` خوانده می‌شود نه یک ثابت دستی: کد سرور
 * توسط `tools/build.mjs` از فایل Code.gs تولید و این‌جا جاسازی می‌شود، پس یک
 * ثابت جداگانه به‌محض به‌روزرسانی سرور کهنه می‌شد و پیامِ «نسخه‌ی لازم» غلط
 * از آب درمی‌آمد. تابع است (نه مقدار ثابت) تا در TDZ `const APPS_SCRIPT_CODE`
 * گیر نکند.
 */
function expectedServerVersion() {
  try {
    const src = (typeof APPS_SCRIPT_CODE === 'string') ? APPS_SCRIPT_CODE : '';
    const m = /var\s+SERVER_VERSION\s*=\s*["']([^"']+)["']/.exec(src);
    return m ? m[1] : '';
  } catch (e) { return ''; }
}

/**
 * برچسب کوتاهِ اختلاف نسخه برای پیام‌های خطا.
 * `got` نسخه‌ای است که سرور در پاسخ برگردانده (`doPost` روی هر پاسخ
 * `result.version` می‌گذارد)؛ خالی یعنی سرور آن‌قدر قدیمی است که نسخه را
 * برنمی‌گرداند.
 */
function serverVersionHint(got) {
  const want = expectedServerVersion();
  const g = String(got || '').trim();
  if (!g) return want ? 'سرور نسخه‌اش را اعلام نکرد (نشانه‌ی Code.gs قدیمی)؛ نسخه‌ی لازم ' + want : 'سرور نسخه‌اش را اعلام نکرد';
  if (want && g !== want) return 'نسخه‌ی سرور ' + g + ' است ولی این برنامه به ' + want + ' نیاز دارد';
  return 'نسخه‌ی سرور ' + g;
}

const SERVER_UPDATE_HOWTO = 'راه‌حل: «تنظیمات ← کپی کد سرور (Code.gs)»، سپس در Apps Script با Deploy ← Manage deployments ← Edit ← Version: New version دوباره دیپلوی کنید (بدون ساخت نسخه‌ی جدید، آدرس /exec همان کد قبلی را اجرا می‌کند).';

/** ساخت PDF سمت کلاینت (دقیق‌تر از تبدیل HTML در سرور) — رفع ایراد ۲-۵ */
async function htmlToPdfBase64(innerHtml, styleCss) {
  if (typeof window === 'undefined') return null;
  // کتابخانه فقط هنگام ساخت PDF لود می‌شود؛ اگر در دسترس نبود، بی‌صدا null
  // برمی‌گردانیم تا مسیر PDF سمت سرور جایگزین شود.
  const html2pdfLib = await ensureLib('html2pdf').catch(e => { console.error('html2pdf در دسترس نیست؛ به مسیر سرور می‌افتیم', e); return null; });
  if (!html2pdfLib) return null;

  // نشانه‌ی holder برای onclone: در کپیِ رندر، برگه روی صفحه برمی‌گردد
  // (رفع «PDF کاملاً سفید»: وقتی holder با left منفی بیرون از صفحه بود،
  // html2canvas به‌خصوص روی موبایل/صفحه‌ی اسکرول‌شده ناحیه‌ی خالی را عکس می‌گرفت.)
  const buildHolder = () => {
    const holder = document.createElement('div');
    holder.setAttribute('data-pdf-holder', '1');
    holder.setAttribute('dir', 'rtl');
    holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1;';
    holder.innerHTML = '<style>' + (styleCss || '') + '</style>' + innerHtml;
    document.body.appendChild(holder);
    return holder;
  };

  // رفع باگ «برگه سفید»: در کلونِ html2canvas، holder به جریان عادی سند
  // برگردانده می‌شود تا ناحیه‌ی درست عکس گرفته شود؛ صفحه‌ی واقعی دست‌نخورده
  // می‌ماند (کاربر هیچ‌چیز نمی‌بیند).
  const onclone = (doc) => {
    try {
      const el = doc.querySelector('[data-pdf-holder]');
      if (el) {
        el.style.position = 'static';
        el.style.left = '0';
        el.style.top = '0';
        el.style.zIndex = 'auto';
        el.style.margin = '0';
      }
      if (doc.body) doc.body.style.margin = '0';
    } catch (e) { /* بی‌خطر: حتی اگر نشد، تنظیمات scroll کمک می‌کند */ }
  };

  const tryBuild = async (opt) => {
    const holder = buildHolder();
    try {
      // آماده‌سازی کامل رندر پیش از عکس‌گرفتن: فونت‌های وب باید لود شده باشند
      // و تصاویر (امضاها/عکس‌ها) decode شده باشند — وگرنه html2canvas ناحیه‌ی
      // خالی می‌گیرد (دلیل دیگری برای «PDF سفید/ناقص»).
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      try {
        const imgs = holder.querySelectorAll('img');
        await Promise.all([...imgs].map(im => (im.decode ? im.decode().catch(() => {}) : Promise.resolve())));
      } catch (e) {}
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      const blob = await html2pdfLib().set(opt).from(holder).outputPdf('blob');
      const b64 = await new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
        fr.onerror = () => reject(fr.error);
        fr.readAsDataURL(blob);
      });
      // اعتبارسنجی: خروجی باید واقعاً PDF (%PDF-) و به‌اندازه‌ی کافی بزرگ باشد؛
      // وگرنه به‌عنوان شکست اعلام می‌شود (نه اینکه فایل سفید دانلود شود).
      let head = '';
      try { head = atob(b64.slice(0, 24)).slice(0, 5); } catch (e) { head = ''; }
      // هر PDF واقعیِ ساخته‌شده از رندر صفحه، یک JPEG تمام‌صفحه درونش دارد
      // (حداقل ~۱۵KB باینری). خروجی‌های «صفحه‌ی خالی» ~۳KB هستند → رد.
      return (b64.length > 12000 && head === '%PDF-') ? b64 : null;
    } catch (e) {
      console.error('ساخت PDF ناموفق بود', e);
      return null;
    } finally {
      holder.remove();
    }
  };

  // تلاش اول: کیفیت کامل. تلاش دوم (fallback): تنظیمات سبک‌تر برای دستگاه‌های
  // ضعیف/موبایل که با scale بزرگ خروجی خالی می‌دهند.
  // مقیاس تطبیقی: روی آیفون/iOS سقف اندازه‌ی canvas حدود ۱۶ مگاپیکسل است؛
  // برگه‌ی بلند (چند برگه پشت‌سرهم/عکس‌دار) با scale=2 از این سقف رد می‌شود و
  // html2canvas به‌جای خطا، بخشی خالی تحویل می‌دهد. مقیاس را طوری انتخاب
  // می‌کنیم که کل بوم زیر بودجه‌ی امن بماند (کامل بودن مقدم بر وضوح است).
  const measureH = () => {
    const h0 = buildHolder();
    const hh = Math.max(1, h0.scrollHeight || 0);
    h0.remove();
    return hh;
  };
  const CONTENT_H = measureH();
  const PIXEL_BUDGET = 13000000; // زیر سقف iOS با حاشیه‌ی امن
  const fitScale = Math.max(0.7, Math.min(2, Math.sqrt(PIXEL_BUDGET / (794 * Math.max(CONTENT_H, 600)))));
  const s1 = Math.min(2, Math.round(fitScale * 100) / 100);
  const s2 = Math.max(0.6, Math.round(fitScale * 0.7 * 100) / 100);

  /** تعداد صفحه‌های PDF (برای کشف «برگه‌ی بلند ولی فقط ۱ صفحه» = خروجی ناقص) */
  const pdfPageCount = (b64) => {
    try {
      const bin = atob(b64);
      const m = bin.match(/\/Type\s*\/Page[^s]/g);
      return m ? m.length : 0;
    } catch (e) { return 0; }
  };

  const optFor = (sc) => ({
    // حاشیه‌ها دقیقاً مثل @page { margin: 14mm } در REPORT_STYLE — یعنی همان
    // برگه‌ای که کاربر در پنجره‌ی چاپ می‌بیند، با همان حاشیه در فایل ذخیره شود.
    margin: [14, 14, 14, 14],
    image: { type: 'jpeg', quality: sc >= 1.5 ? 0.96 : 0.9 },
    html2canvas: { scale: sc, useCORS: true, windowWidth: 794, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, onclone: onclone },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
    pagebreak: { mode: ['css', 'legacy'] },
  });

  const b64 = await tryBuild(optFor(s1));
  if (b64) {
    // اگر محتوا به‌قدر کافی بلند است که باید چندصفحه‌ای شود ولی خروجی تک‌صفحه
    // آمد، یعنی html2canvas بخشی را از دست داده → با مقیاس پایین‌تر دوباره.
    const expectedPages = Math.max(1, Math.ceil(CONTENT_H / 1016));
    if (expectedPages > 1) {
      const got = pdfPageCount(b64);
      if (got > 0 && got < expectedPages) {
        const b64b = await tryBuild(optFor(s2));
        if (b64b) return b64b;
      }
    }
    return b64;
  }
  return await tryBuild(optFor(s2));
}

/**
 * دانلود مطمئن PDF از base64: به‌جای data URL (که روی موبایل/فایل‌های بزرگ
 * خراب می‌شود یا فایل خالی ذخیره می‌کند)، Blob واقعی ساخته و با object URL
 * دانلود می‌شود. اگر مرورگر Blob را نداشت، به data URL برمی‌گردیم.
 */
function downloadBase64Pdf(b64, filename) {
  try {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    downloadDataUrl(url, filename);
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 30000);
  } catch (e) {
    downloadDataUrl('data:application/pdf;base64,' + b64, filename);
  }
}

/* حذف دوباره‌کاری بازسازی PDF: اگر چند امضا پشت‌هم برای یک برگه ثبت شود
   (مثلاً راننده و مدیر هر دو در محل)، به‌جای چند ارسال همزمان، فقط آخرین
   وضعیت بعد از ۲.۵ ثانیه سکوت ارسال می‌شود → سرعت همگام‌سازی و صرفه‌جویی
   در اینترنت موبایل. */
const recordPdfTimers = {};
function scheduleRecordPdfSync(key, fn, delay) {
  try { clearTimeout(recordPdfTimers[key]); } catch (e) {}
  recordPdfTimers[key] = setTimeout(() => { try { fn(); } catch (e) { console.error('PDF sync ناموفق', e); } }, delay || 2500);
}

async function sendRecordToAppsScript(url, apiKey, record, org, notify, opts) {
  // «یک رندر، سه خروجی»: همین رشته‌ی HTML هم در پنجره‌ی چاپ نمایش داده می‌شود،
  // هم مبنای ساخت PDF دانلود محلی است و هم در گوگل‌درایو ذخیره می‌شود.
  //
  // ⚠️ رفع باگ TDZ: «serverStyle» قبلاً قبل از اعلان «pdfBase64» به آن ارجاع
  // می‌داد → ReferenceError → کل ارسال PDF (محلی و درایو) کرش می‌کرد.
  //
  // حالت serverOnly (برای لحظه‌ی امضا): PDF اصلاً روی گوشی ساخته نمی‌شود؛
  // HTML مستقیم به Apps Script می‌رود و موتور گوگل PDF را می‌سازد. نتیجه:
  //   ✓ بعد از امضا، گوشی دیگر درگیر لود کتابخانه‌ی ۲MB و رندر بوم نیست
  //     → همگام‌سازی سریع‌تر تمام می‌شود
  //   ✓ PDF درایو با متن واقعی (نه عکس) و چیدمان بلوکیِ کامل ساخته می‌شود
  const serverOnly = !!(opts && opts.serverOnly);
  const bodyHtml = recordReportHtml(record, org);
  const pdfBase64 = serverOnly ? null : await htmlToPdfBase64(bodyHtml, REPORT_STYLE);
  const serverStyle = pdfBase64 ? '' : SERVER_FALLBACK_STYLE;
  const html = `<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>${REPORT_STYLE}${serverStyle}</style></head><body>${bodyHtml}</body></html>`;
  if (pdfBase64) {
    try {
      downloadBase64Pdf(pdfBase64, recordPdfFileName(record));
    } catch (eDownload) { /* دانلود محلی هرگز نباید ثبت رکورد یا آپلود را بشکند */ }
  }
  const json = await signedCall(url, apiKey, 'save_record', {
    folderName: cloudFolderName(org),
    pdfBase64: pdfBase64 || '',
    record: {
      id: record.id, assetCode: record.assetCode, assetName: record.assetTitle || record.assetName || '',
      templateName: record.templateName, category: record.category || 'عمومی',
      inspectorName: record.inspectorName, location: record.location || '',
      completedAt: record.completedAt || new Date().toISOString(),
      percent: record.percent, status: record.status, criticalFail: !!record.criticalFail,
      score: record.score || 0, maxScore: record.maxScore || 0,
    },
    html: pdfBase64 ? '' : html,
  }, cloudFolderName(org));
  if (notify) {
    notify(serverOnly
      ? 'PDF برگه در Google Drive بازسازی شد (موتور سرور — بدون بار روی گوشی).'
      : (pdfBase64
        ? 'فایل PDF دقیقاً مثل برگه‌ی نمایش‌داده‌شده، دانلود و در Google Drive ذخیره شد.'
        : 'سابقه در Google Drive ذخیره شد (نسخه‌ی ذخیره‌شده با موتور سمت سرور رندر شده است).'),
      'success');
  }
  return json;
}

/**
 * نام فایل PDF یک رکورد بازرسی — عمداً **دقیقاً همان الگوریتم سرور** در
 * `handleSaveRecord` (تمیزکاری نام + تاریخ شمسی + کد تجهیز + نام قالب + ۶ رقم
 * آخر شناسه). این‌طور فایل دانلودِ محلی و فایل ذخیره‌شده در گوگل‌درایو هم‌نام
 * هستند و کاربر می‌فهمد هر دو یکی‌اند.
 */
function recordPdfFileName(record) {
  const clean = (s, max) => {
    let out = String(s === null || s === undefined ? '' : s)
      .replace(/[\\/:*?"<>|\r\n\t]/g, '_').replace(/\s+/g, ' ').trim();
    if (out.length > max) out = out.slice(0, max);
    return out || 'بدون‌نام';
  };
  const d = new Date((record && record.completedAt) || Date.now());
  const jDateStr = (gregorianToJalaliStr(isNaN(d.getTime()) ? new Date() : d) || '').replace(/\//g, '-') || '0000-00-00';
  const assetPart = (record && record.assetCode) ? clean(record.assetCode, 30) + '_' : '';
  const titlePart = clean((record && record.templateName) || 'checklist', 50);
  const idPart = String((record && record.id) || '').slice(-6);
  return (jDateStr + '_' + assetPart + titlePart + '_' + idPart).slice(0, 160) + '.pdf';
}

async function pushCloudBackup(url, apiKey, fullData, org, notify) {
  await signedCall(url, apiKey, 'backup', { folderName: cloudFolderName(org), payload: fullData }, cloudFolderName(org));
  if (notify) notify('نسخه پشتیبان در Google Drive ذخیره شد.', 'success');
}

async function testAppsScriptConnection(url, apiKey, org, notify) {
  try {
    const json = await callAppsScript(url, await buildEnvelope('ping', {}, apiKey, cloudFolderName(org)));
    // «اتصال برقرار است» به‌تنهایی گمراه‌کننده است: رایج‌ترین علتِ کارنکردنِ
    // همگام‌سازی، وصل بودن به یک دیپلویمنتِ قدیمی است (کد ویرایش شده ولی
    // «New version» ساخته نشده). پس نسخه صریح سنجیده و اعلام می‌شود.
    const want = expectedServerVersion();
    const got = String((json && json.version) || '').trim();
    const mismatch = !!want && got !== want;
    notify('اتصال برقرار است — نسخه سرور: ' + (got || '؟') +
      (want ? ' (نسخه‌ی لازم: ' + want + ')' : '') +
      (json && json.revision !== undefined ? ' | بازنگری پایگاه: ' + toPersianDigits(json.revision) : '') +
      (mismatch ? ' — ⚠️ ' + SERVER_UPDATE_HOWTO : ''), mismatch ? 'error' : 'success');
    return json;
  } catch (e) { notify('اتصال ناموفق بود: ' + e.message, 'error'); return null; }
}

function SettingsPage() {
  const {
    data, update, notify, verifyManagerPin, perms,
    sync, syncNow, replaceFromCloud, migrateLocalToCloud, clearConflicts, retryConflict,
  } = useAppData();

  const [org, setOrg] = useState(data.settings.orgName || '');
  const [threshold, setThreshold] = useState(String(data.settings.passThreshold || 80));
  const [flowMode, setFlowMode] = useState(resolveSignFlowMode(data.settings));
  const [newCategory, setNewCategory] = useState('');
  const [gasUrl, setGasUrl] = useState(data.settings.googleAppsScriptUrl || DEFAULT_APPS_SCRIPT_URL || '');
  const [clientId, setClientId] = useState(data.settings.googleClientId || '');
  const [apiKey, setApiKey] = useState(data.settings.cloudApiKey || '');
  const [rememberKey, setRememberKey] = useState(true);
  const [syncConn, setSyncConn] = useState(!!data.settings.syncConnectionSettings);
  const [testing, setTesting] = useState(false);
  const [busy, setBusy] = useState('');
  const [pin, setPin] = useState('');
  const [pinConfirm, setPinConfirm] = useState('');
  const [copyDone, setCopyDone] = useState(false);
  const [showScript, setShowScript] = useState(false);
  const [confirmRestore, setConfirmRestore] = useState(null);
  const [confirmReplace, setConfirmReplace] = useState(false);
  const [confirmMigrate, setConfirmMigrate] = useState(false);
  const fileInputRef = useRef(null);
  const restoreInputRef = useRef(null);

  // اگر داده‌ها از دستگاه دیگری همگام شد، فرم هم تازه می‌شود
  useEffect(() => {
    setOrg(data.settings.orgName || '');
    setThreshold(String(data.settings.passThreshold || 80));
    setFlowMode(resolveSignFlowMode(data.settings));
    setGasUrl(data.settings.googleAppsScriptUrl || DEFAULT_APPS_SCRIPT_URL || '');
    setClientId(data.settings.googleClientId || '');
    setApiKey(data.settings.cloudApiKey || '');
    setSyncConn(!!data.settings.syncConnectionSettings);
    // eslint-disable-next-line
  }, [data.settings.orgName, data.settings.passThreshold, data.settings.signFlowMode,
      data.settings.googleAppsScriptUrl, data.settings.cloudApiKey, data.settings.syncConnectionSettings]);

  if (!perms || !perms.isAdmin) return <NoAccess what="فقط نقش «ادمین» به تنظیمات دسترسی دارد." />;

  const cfg = resolveCloudConfig(data.settings);
  const isConfigured = !!cfg.url;

  const saveOrg = () => {
    update(d => {
      d.settings.orgName = org;
      d.settings.passThreshold = Number(sanitizeNumericInput(threshold, { max: 100, maxLen: 3 })) || 80;
      d.settings.signFlowMode = flowMode === SIGN_FLOW_MODES.SINGLE ? SIGN_FLOW_MODES.SINGLE : SIGN_FLOW_MODES.CHAIN;
    });
    notify('اطلاعات سازمان ذخیره شد.', 'success');
  };

  const onLogoChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) { notify('حجم لوگو باید کمتر از ۱٫۵ مگابایت باشد.', 'error'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      update(d => { d.settings.logoDataUrl = reader.result; });
      notify('لوگو بارگذاری شد.', 'success');
    };
    reader.readAsDataURL(file);
  };

  const addCategory = () => {
    const c = newCategory.trim();
    if (!c) return;
    update(d => { if (!d.categories.includes(c)) d.categories.push(c); });
    setNewCategory('');
  };
  const removeCategory = (c) => update(d => { d.categories = d.categories.filter(x => x !== c); });

  const saveGoogle = () => {
    const k = apiKey.trim();
    update(d => {
      d.settings.googleAppsScriptUrl = gasUrl.trim();
      d.settings.googleClientId = clientId.trim();
      d.settings.cloudApiKey = rememberKey ? k : '';
      d.settings.syncConnectionSettings = syncConn;
    });
    try {
      if (rememberKey) sessionStorage.removeItem(SESSION_API_KEY);
      else if (k) sessionStorage.setItem(SESSION_API_KEY, k);
    } catch (e) {}
    notify('تنظیمات اتصال ذخیره شد.', 'success');
    setTimeout(() => syncNow(), 200);
  };

  const testConnection = async () => {
    if (!gasUrl.trim()) { notify('ابتدا آدرس وب‌اپ اسکریپت را وارد و ذخیره کنید.', 'error'); return; }
    setTesting(true);
    await testAppsScriptConnection(gasUrl.trim(), apiKey.trim(), { ...data.settings, orgName: org }, notify);
    setTesting(false);
  };

  const doSyncNow = async () => {
    setBusy('sync');
    const res = await syncNow();
    setBusy('');
    if (res && res.error) notify('همگام‌سازی ناموفق بود: ' + (res.error.message || ''), 'error');
    else notify('همگام‌سازی انجام شد.' + (res && res.pushed ? ` ${toPersianDigits(res.pushed)} تغییر ارسال شد.` : ''), 'success');
  };

  const doReplaceFromCloud = async () => {
    setBusy('replace');
    try {
      await replaceFromCloud();
      notify('اطلاعات این دستگاه با نسخه‌ی ابری جایگزین شد.', 'success');
    } catch (e) { notify('جایگزینی ناموفق بود: ' + e.message, 'error'); }
    setBusy('');
    setConfirmReplace(false);
  };

  const doMigrate = async () => {
    setBusy('migrate');
    try {
      const res = await migrateLocalToCloud();
      notify('مهاجرت انجام شد: ' + JSON.stringify((res.migration || {}).counts || {}), 'success');
    } catch (e) { notify('مهاجرت ناموفق بود: ' + e.message, 'error'); }
    setBusy('');
    setConfirmMigrate(false);
  };

  const doBackupToCloud = async () => {
    if (!cfg.url || !cfg.apiKey) { notify('ابتدا آدرس و کلید را وارد و ذخیره کنید.', 'error'); return; }
    setBusy('backup');
    try { await pushCloudBackup(cfg.url, cfg.apiKey, data, data.settings, notify); }
    catch (e) { notify('پشتیبان‌گیری ابری ناموفق بود: ' + e.message, 'error'); }
    setBusy('');
  };

  const copyScript = async () => {
    if (!APPS_SCRIPT_CODE) { notify('کد سرور در این نسخه از فایل جاسازی نشده؛ فایل Code.gs را از مخزن پروژه کپی کنید.', 'error'); return; }
    try { await navigator.clipboard.writeText(APPS_SCRIPT_CODE); setCopyDone(true); setTimeout(() => setCopyDone(false), 2000); }
    catch (e) { setShowScript(true); notify('کپی خودکار پشتیبانی نمی‌شود؛ کد را از کادر زیر انتخاب و کپی کنید.', 'error'); }
  };

  const oauthLogin = () => {
    if (!clientId.trim()) { notify('ابتدا Client ID گوگل را وارد و ذخیره کنید.', 'error'); return; }
    if (!window.google || !window.google.accounts) { notify('کتابخانه Google Identity Services بارگذاری نشده است.', 'error'); return; }
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId.trim(),
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp) => {
        if (resp && resp.access_token) notify('اتصال مستقیم به Google Drive برقرار شد.', 'success');
        else notify('ورود گوگل ناموفق بود.', 'error');
      },
    });
    client.requestAccessToken();
  };

  const savePin = async () => {
    const p = toEnglishDigits(pin).trim();
    if (!p || p.length < 4) { notify('پین باید حداقل ۴ رقم باشد.', 'error'); return; }
    if (p !== toEnglishDigits(pinConfirm).trim()) { notify('تکرار پین مطابقت ندارد.', 'error'); return; }
    setBusy('pin');
    const cred = await makeCredential(p);
    update(d => {
      d.settings.managerPinHash = cred.passwordHash;
      d.settings.managerPinSalt = cred.salt;
      d.settings.managerPinHashAlgo = cred.hashAlgo;
      d.settings.managerPinIterations = cred.iterations;
    });
    setBusy('');
    setPin(''); setPinConfirm('');
    notify('پین‌کد مدیریت با PBKDF2 و salt به‌روزرسانی شد.', 'success');
  };

  const doBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    downloadDataUrl(URL.createObjectURL(blob), `پشتیبان-درکاو-${Date.now()}.json`);
  };

  const onRestoreFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const shapeErr = validateBackupShape(parsed);
        if (shapeErr) { notify(shapeErr, 'error'); return; }
        setConfirmRestore(parsed);
      } catch (err2) { notify('فایل JSON نامعتبر است.', 'error'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const doRestore = () => {
    // بازیابی = یک تغییر محلی کامل؛ تمام رکوردهای فایل پشتیبان به‌صورت op صف می‌شوند
    const migrated = migrateData(JSON.parse(JSON.stringify(confirmRestore)));
    if (!migrated) { notify('فایل پشتیبان قابل مهاجرت نیست.', 'error'); return; }
    migrated.settings.googleAppsScriptUrl = data.settings.googleAppsScriptUrl;
    migrated.settings.cloudApiKey = data.settings.cloudApiKey;
    migrated.settings.googleClientId = data.settings.googleClientId;
    update(d => { Object.assign(d, migrated); });
    setConfirmRestore(null);
    notify('بازیابی اطلاعات انجام شد و تغییرات در صف همگام‌سازی قرار گرفت.', 'success');
  };

  const statusLabel = {
    idle: 'همگام', pending: 'در انتظار ارسال', syncing: 'در حال همگام‌سازی',
    offline: 'آفلاین', error: 'خطا',
  }[sync.status] || sync.status;

  const storageKb = (() => {
    try { return Math.round((JSON.stringify(data).length / 1024) * 10) / 10; } catch (e) { return 0; }
  })();

  return (
    <div className="space-y-6 max-w-3xl">
      <p className="text-[10px] text-slate-400 select-none">نسخه: {APP_BUILD}</p>
      {/* ---------------- وضعیت همگام‌سازی ---------------- */}
      <section className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
        <div className="flex items-center justify-between gap-3">
          <h3 className="font-bold text-slate-800">وضعیت همگام‌سازی</h3>
          <SyncIndicator />
        </div>
        {!isConfigured ? (
          <p className="text-sm text-slate-500">
            اتصال ابری پیکربندی نشده است؛ برنامه فقط روی همین مرورگر کار می‌کند. برای
            همگام‌سازی چندکاربره/چنددستگاهی، بخش «اتصال به Google Apps Script» را کامل کنید.
          </p>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
            <div className="bg-slate-50 rounded-xl p-3">
              <p className="text-[11px] text-slate-400">وضعیت</p>
              <p className="text-sm font-bold text-slate-700">{statusLabel}</p>
            </div>
            <div className="bg-slate-50 rounded-xl p-3">
              <p className="text-[11px] text-slate-400">در صف ارسال</p>
              <p className="text-sm font-bold text-slate-700">{toPersianDigits(sync.pending)}</p>
            </div>
            <div className="bg-slate-50 rounded-xl p-3">
              <p className="text-[11px] text-slate-400">بازنگری پایگاه</p>
              <p className="text-sm font-bold text-slate-700">{toPersianDigits(sync.revision)}</p>
            </div>
            <div className="bg-slate-50 rounded-xl p-3">
              <p className="text-[11px] text-slate-400">آخرین همگام‌سازی</p>
              <p className="text-sm font-bold text-slate-700">{sync.lastSyncAt ? toPersianDigits(new Date(sync.lastSyncAt).toLocaleTimeString('fa-IR')) : '—'}</p>
            </div>
          </div>
        )}
        {sync.lastError && (
          <div className="text-xs text-danger-700 bg-danger-50 border border-danger-500/20 rounded-lg px-3 py-2">{sync.lastError}</div>
        )}
        {!!(sync.conflicts && sync.conflicts.length) && (
          <div className="text-xs bg-warn-50 border border-warn-500/20 rounded-lg px-3 py-2 space-y-2">
            <div className="flex items-center justify-between">
              <b className="text-warn-700">تغییراتی که اعمال نشد ({toPersianDigits(sync.conflicts.length)})</b>
              <button onClick={clearConflicts} className="text-warn-700 hover:underline">پاک کردن همه</button>
            </div>
            <p className="text-warn-700/80 leading-5">
              این تغییرات روی سرور رد شدند چون نسخه‌ی جدیدتری وجود داشت. نسخه‌ی سرور دریافت شده است.
              اگر مطمئنید تغییر خودتان درست است، با «اعمال تغییر من» آن را با مهر زمانی تازه
              دوباره بفرستید — این کار نسخه‌ی سرور را برای همان رکورد بازنویسی می‌کند.
            </p>
            {sync.conflicts.slice(0, 8).map((c, i) => (
              <div key={i} className="flex flex-wrap items-center gap-2 border-t border-warn-500/15 pt-2">
                <p className="text-warn-700 flex-1 min-w-[16rem]">
                  {c.kind === 'stale_write'
                    ? <>تغییر محلی <code className="font-mono">{c.entity}/{String(c.id).slice(-6)}</code> اعمال نشد
                        {c.serverUpdatedAt ? <>؛ نسخه‌ی سرور جدیدتر بود ({toPersianDigits(new Date(Number(c.serverUpdatedAt)).toLocaleTimeString('fa-IR'))})</> : null}.</>
                    : <>عملیات <code className="font-mono">{c.entity}/{String(c.id).slice(-6)}</code> پس از چند تلاش ناموفق از صف خارج شد: {c.error || ''}</>}
                </p>
                {c.kind === 'stale_write' && (
                  c.retryOp
                    ? <button onClick={() => retryConflict(c)}
                        className="px-2.5 py-1 rounded-lg border border-warn-500/40 text-warn-700 hover:bg-warn-100 whitespace-nowrap">
                        ↻ اعمال تغییر من
                      </button>
                    : <span className="text-warn-700/60 whitespace-nowrap" title="حجم این تغییر از سقف بازیابی بیشتر بود">
                        بازیابی خودکار ممکن نیست
                      </span>
                )}
              </div>
            ))}
            {sync.conflicts.length > 8 && (
              <p className="text-warn-700/70">و {toPersianDigits(sync.conflicts.length - 8)} مورد دیگر…</p>
            )}
          </div>
        )}
        <div className="flex flex-wrap gap-2">
          <button onClick={doSyncNow} disabled={!isConfigured || busy === 'sync'}
            className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700 disabled:opacity-50">
            {busy === 'sync' ? 'در حال همگام‌سازی…' : '🔄 همگام‌سازی فوری'}
          </button>
          <button onClick={doBackupToCloud} disabled={!isConfigured || busy === 'backup'}
            className="px-4 py-2 rounded-xl text-sm border border-slate-300 hover:bg-slate-50 disabled:opacity-50">
            ☁️ پشتیبان کامل در Drive
          </button>
          <button onClick={() => setConfirmReplace(true)} disabled={!isConfigured}
            className="px-4 py-2 rounded-xl text-sm border border-danger-200 text-danger-700 hover:bg-danger-50 disabled:opacity-50">
            ⬇️ بازنشانی از ابر (جایگزینی)
          </button>
        </div>
        <p className="text-[11px] text-slate-400 leading-5">
          همگام‌سازی به‌صورت «عملیات‌محور» انجام می‌شود: فقط رکوردهای تغییرکرده ارسال می‌شوند و در
          سرور هم هر رکورد جداگانه مقایسه می‌شود. بنابراین تغییر هم‌زمان دو کاربر روی دو دستگاه،
          باعث از بین رفتن کار یکدیگر نمی‌شود. تغییرات ارسال‌نشده در IndexedDB همین مرورگر نگه
          داشته می‌شوند و با بازگشت اتصال، خودکار ارسال می‌شوند.
        </p>
      </section>

      {/* ---------------- اطلاعات سازمان ---------------- */}
      <section className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
        <h3 className="font-bold text-slate-800">اطلاعات سازمان</h3>
        <Field label="نام سازمان"><input className={inputCls} value={org} onChange={e => setOrg(e.target.value)} /></Field>
        <Field label="حد نصاب پیش‌فرض قبولی (%)">
          <input type="text" inputMode="numeric" dir="ltr" className={inputCls} value={toPersianDigits(threshold)}
            onChange={e => setThreshold(sanitizeNumericInput(e.target.value, { max: 100, maxLen: 3 }))} />
        </Field>
        <Field label="جریان امضای برگه‌ها (پیش‌فرض سازمان)"
          hint="تعداد امضاکنندگان در خودِ هر چک‌لیست تعیین می‌شود؛ این تنظیم فقط پیش‌فرضِ چک‌لیست‌های قدیمی است که تعداد امضایشان مشخص نشده. بین همه‌ی دستگاه‌ها همگام می‌شود و روی برگه‌های ثبت‌شده‌ی قبلی اثری ندارد.">
          <select className={inputCls} value={flowMode} onChange={e => setFlowMode(e.target.value)}>
            <option value={SIGN_FLOW_MODES.CHAIN}>زنجیره‌ای — سه امضای اجباری و ترتیبی (بازرس ← ناظر ← تأییدکننده نهایی)</option>
            <option value={SIGN_FLOW_MODES.SINGLE}>ساده — فقط امضای بازرس در محل</option>
          </select>
        </Field>
        <p className="text-[11px] text-slate-400 leading-5">
          در حالت زنجیره‌ای، بازرس هنگام ثبت برگه موظف است امضاکننده‌ی مرحله‌های بعدی را تعیین کند و
          هر مرحله فقط پس از امضای مرحله‌ی قبل باز می‌شود؛ گیرنده‌ی هر مرحله می‌تواند «امضا در محل» بزند
          یا برگه را به فرد واجد شرایط دیگری «ارجاع» دهد. یک نفر نمی‌تواند دو مرحله را امضا کند.
        </p>
        <Field label="لوگوی سازمان" hint="حداکثر ۱٫۵ مگابایت؛ فقط روی همین دستگاه نگه داشته می‌شود.">
          <input ref={fileInputRef} type="file" accept="image/*" onChange={onLogoChange} className="text-sm" />
          {data.settings.logoDataUrl && <img src={data.settings.logoDataUrl} className="h-12 mt-2" />}
        </Field>
        <button onClick={saveOrg} className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700">ذخیره</button>
      </section>

      {/* ---------------- دسته‌بندی‌ها ---------------- */}
      <section className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
        <h3 className="font-bold text-slate-800">دسته‌بندی‌های تجهیزات و چک‌لیست‌ها</h3>
        <div className="flex flex-wrap gap-2">
          {data.categories.map(c => (
            <span key={c} className="flex items-center gap-1.5 bg-slate-100 rounded-full px-3 py-1.5 text-sm">
              {c}
              <button onClick={() => removeCategory(c)} className="text-slate-400 hover:text-danger-500">✕</button>
            </span>
          ))}
          {data.categories.length === 0 && <span className="text-xs text-slate-400">دسته‌بندی‌ای تعریف نشده است.</span>}
        </div>
        <div className="flex gap-2">
          <input className={inputCls} value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder="دسته‌بندی جدید" />
          <button onClick={addCategory} className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm shrink-0">افزودن</button>
        </div>
      </section>

      {/* ---------------- اتصال ابری ---------------- */}
      <section className="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
        <h3 className="font-bold text-slate-800">اتصال به Google Apps Script</h3>
        <div className="bg-brand-50 border border-brand-100 rounded-xl p-3.5 text-sm space-y-3">
          <Field label="آدرس وب‌اپ منتشرشده (Web App URL)">
            <input className={inputCls} dir="ltr" value={gasUrl} onChange={e => setGasUrl(e.target.value)} placeholder="https://script.google.com/macros/s/…/exec" />
          </Field>
          <Field label="کلید API (Script Properties → API_KEY)"
            hint="⚠️ این کلید هیچ‌وقت داخل فایل برنامه جاسازی نمی‌شود؛ هرکس به فایل HTML دسترسی داشته باشد می‌تواند آن را بخواند. سرور هم اگر API_KEY تنظیم نشده باشد، همه‌ی درخواست‌ها را رد می‌کند.">
            <input className={inputCls} dir="ltr" type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="یک رشته تصادفی و طولانی" />
          </Field>
          <label className="flex items-center gap-2 text-xs text-slate-500 cursor-pointer">
            <input type="checkbox" checked={rememberKey} onChange={e => setRememberKey(e.target.checked)} />
            ذخیره دائمی کلید روی این دستگاه (برداشتن = فقط تا بستن زبانه)
          </label>
          <label className="flex items-center gap-2 text-xs text-slate-500 cursor-pointer">
            <input type="checkbox" checked={syncConn} onChange={e => setSyncConn(e.target.checked)} />
            آدرس و کلید اتصال بین دستگاه‌ها همگام شود (راحت‌تر، اما کلید روی سرور هم ذخیره می‌شود)
          </label>
          <div className="flex flex-wrap gap-2">
            <button onClick={saveGoogle} className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700">ذخیره تنظیمات اتصال</button>
            <button onClick={testConnection} disabled={testing} className="px-3.5 py-2 rounded-xl bg-white border border-brand-200 text-sm text-brand-700 hover:bg-brand-100 disabled:opacity-50">
              {testing ? 'در حال بررسی…' : '🔌 تست اتصال'}
            </button>
            <button onClick={copyScript} className="px-3.5 py-2 rounded-xl bg-white border border-brand-200 text-sm text-brand-700 hover:bg-brand-100">
              {copyDone ? '✔ کد کپی شد' : '📋 کپی کد سرور (Code.gs)'}
            </button>
            <button onClick={() => setShowScript(v => !v)} className="px-3.5 py-2 rounded-xl bg-white border border-brand-200 text-sm text-brand-700 hover:bg-brand-100">
              {showScript ? 'بستن کد' : 'نمایش کد'}
            </button>
          </div>
          {showScript && APPS_SCRIPT_CODE && (
            <textarea readOnly dir="ltr" value={APPS_SCRIPT_CODE} onFocus={e => e.target.select()}
              className="w-full h-64 text-[11px] font-mono bg-slate-900 text-slate-100 rounded-xl p-3" />
          )}
        </div>

        <div className="bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm space-y-2">
          <p className="font-medium text-slate-700">مهاجرت از نسخه قدیمی (یک فایل JSON روی Drive)</p>
          <p className="text-xs text-slate-500 leading-6">
            اگر پیش‌تر از نسخه ۷ استفاده می‌کردید، داده‌ی فعلی این دستگاه را یک‌بار به پایگاه
            Google Sheets منتقل کنید. این کار رکوردها را به ردیف‌های جداگانه تبدیل می‌کند و
            از این پس همگام‌سازی به‌صورت رکوردی انجام می‌شود.
          </p>
          <button onClick={() => setConfirmMigrate(true)} disabled={!isConfigured || busy === 'migrate'}
            className="px-4 py-2 rounded-xl text-sm bg-white border border-slate-300 hover:bg-slate-100 disabled:opacity-50">
            {busy === 'migrate' ? 'در حال مهاجرت…' : '🚚 مهاجرت داده این دستگاه به Sheets'}
          </button>
        </div>

        <div className="bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm space-y-2">
          <p className="font-medium text-slate-700">ورود مستقیم با Google OAuth (اختیاری)</p>
          <Field label="Google OAuth Client ID">
            <input className={inputCls} dir="ltr" value={clientId} onChange={e => setClientId(e.target.value)} placeholder="xxxxxxxx.apps.googleusercontent.com" />
          </Field>
          <button onClick={oauthLogin} className="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-sm hover:bg-slate-100">ورود با Google</button>
        </div>
      </section>

      {/* ---------------- پین مدیریت ---------------- */}
      <section className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
        <h3 className="font-bold text-slate-800">پین‌کد مدیریت (Manager PIN)</h3>
        <p className="text-xs text-slate-400">
          برای تأیید عملیات حساس استفاده می‌شود و با PBKDF2-SHA256 (۱۲۰٬۰۰۰ تکرار) به‌همراه salt
          تصادفی هش می‌شود. پین‌های قدیمیِ SHA-256 در اولین استفاده به‌طور خودکار ارتقا می‌یابند.
        </p>
        <div className="grid grid-cols-2 gap-3">
          <Field label="پین جدید"><input type="password" inputMode="numeric" className={inputCls} value={pin} onChange={e => setPin(e.target.value)} /></Field>
          <Field label="تکرار پین"><input type="password" inputMode="numeric" className={inputCls} value={pinConfirm} onChange={e => setPinConfirm(e.target.value)} /></Field>
        </div>
        <button onClick={savePin} disabled={busy === 'pin'} className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700 disabled:opacity-50">
          {busy === 'pin' ? 'در حال ساخت هش…' : 'ذخیره پین'}
        </button>
      </section>

      {/* ---------------- پشتیبان‌گیری ---------------- */}
      <section className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
        <h3 className="font-bold text-slate-800">پشتیبان‌گیری و بازیابی</h3>
        <div className="flex flex-wrap gap-2">
          <button onClick={doBackup} className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm">⬇️ دانلود پشتیبان کامل (JSON)</button>
          <button onClick={() => restoreInputRef.current.click()} className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm">⬆️ بازیابی از فایل</button>
          <input ref={restoreInputRef} type="file" accept="application/json" onChange={onRestoreFile} className="hidden" />
        </div>
        <p className="text-[11px] text-slate-400 leading-5">
          بازیابی از فایل، داده را جایگزین می‌کند و تمام تفاوت‌ها به‌صورت عملیات در صف
          همگام‌سازی قرار می‌گیرند؛ بنابراین روی سرور هم اعمال می‌شود.
        </p>
      </section>

      {/* ---------------- اطلاعات فنی ---------------- */}
      <section className="bg-white rounded-2xl border border-slate-200 p-5 space-y-2 text-xs text-slate-500">
        <h3 className="font-bold text-slate-800 text-sm">اطلاعات فنی</h3>
        <div className="grid grid-cols-2 gap-x-4 gap-y-1">
          <span>شناسه این دستگاه:</span><span dir="ltr" className="text-left font-mono">{CLIENT_ID}</span>
          <span>حجم داده محلی:</span><span>{toPersianDigits(storageKb)} کیلوبایت</span>
          <span>کاربران / تجهیزات / سوابق:</span>
          <span>{toPersianDigits(data.users.length)} / {toPersianDigits(data.assets.length)} / {toPersianDigits(data.records.length)}</span>
          <span>نسخه ساختار داده:</span><span>{toPersianDigits(data.version)}</span>
        </div>
      </section>

      <ConfirmDialog open={!!confirmRestore} danger title="بازیابی اطلاعات"
        message="تمام داده‌های فعلی سامانه با محتوای فایل پشتیبان جایگزین می‌شود و تغییرات به پایگاه ابری هم ارسال خواهد شد."
        onConfirm={doRestore} onCancel={() => setConfirmRestore(null)} />

      <ConfirmDialog open={confirmReplace} danger title="بازنشانی از ابر"
        message="اطلاعات محلی این دستگاه دور ریخته و آخرین نسخه‌ی پایگاه ابری جایگزین آن می‌شود. تغییرات ارسال‌نشده در صف، از بین می‌روند. ابتدا یک پشتیبان دانلود کنید."
        onConfirm={doReplaceFromCloud} onCancel={() => setConfirmReplace(false)} />

      <ConfirmDialog open={confirmMigrate} title="مهاجرت به Google Sheets"
        message="داده‌ی فعلی این دستگاه به پایگاه Sheets روی سرور منتقل می‌شود. رکوردهای موجود بازنویسی نمی‌شوند مگر آنکه نسخه ارسالی جدیدتر باشد."
        onConfirm={doMigrate} onCancel={() => setConfirmMigrate(false)} />
    </div>
  );
}

/* ============================================================
   ۱۹. صفحه راهنما و سند مرجع
   ============================================================ */
function HelpPage() {
  const { currentUser } = useAppData();
  return (
    <div className="space-y-5 max-w-3xl">
      <div className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3 text-sm text-slate-600 leading-7">
        <h3 className="font-bold text-slate-800 text-base">راهنمای استفاده از سامانه چک‌لیست درکاو</h3>
        <p>۱. هر چک‌لیست، زیرسیستم‌های خودش را دارد: در «قالب‌های چک‌لیست» قالب را بسازید، تعداد امضاکنندگانش را همان اول مشخص کنید و زیرسیستم‌هایش را در همان‌جا اضافه کنید. در «تجهیزات» هم هر تجهیز فقط به چک‌لیست مربوط به خودش گره می‌خورد.</p>
        <p>۲. از منوی «اجرای بازرسی» اول چک‌لیست را انتخاب کنید؛ فهرست تجهیزات فقط زیرسیستم‌های همان چک‌لیست را نشان می‌دهد. نام بازرس به‌طور خودکار از حساب کاربری شما خوانده می‌شود و قابل تغییر نیست؛ در پایان، امضای بازرس (در محل) الزامی است و بقیه‌ی امضاها طبق تعداد تعیین‌شده در چک‌لیست از راه زنجیره‌ی امضا گرفته می‌شوند.</p>
        <p>۲٫۱. در کادر «زنجیره‌ی امضا»، هر مرحله دو حالت دارد: <b>«حضوری»</b> — همان لحظه که دکمه را می‌زنید پد امضا باز می‌شود و امضای آن فرد را داخل همان فرم می‌گیرید (نامش از حساب کاربری خودش خوانده و قفل می‌شود) و همراه برگه ثبت می‌شود؛ <b>«ارجاعی»</b> — برگه مستقیم به صف «در انتظار امضا»ی خودش می‌رود. اگر پد را ببندید یا امضا را بگیرید و بعد حالت را به «ارجاعی» برگردانید، امضای گرفته‌شده حذف می‌شود.</p>
        <p>۳. مرحله‌هایی که «ارجاعی» تعیین شده‌اند (یا «حضوری» بوده‌اند ولی امضایشان گرفته نشده) به‌ترتیب به امضاکننده‌های بعدی می‌رسند و در منوی «در انتظار امضا»یشان ظاهر می‌شوند. هر گیرنده دو انتخاب دارد: «امضا در محل» یا «ارجاع به دیگری». فقط خودِ گیرنده یا ادمین اجازه‌ی امضا/ارجاع دارد و تا مرحله‌ی قبلی امضا نشود، نوبت نفر بعدی باز نمی‌شود.</p>
        <p>۳٫۱. ورود ماندگار: اگر هنگام ورود تیک «مرا به خاطر بسپار» روشن باشد، دفعه‌ی بعد بدون پرسیدن رمز، مستقیم وارد می‌شوید و تنظیمات اتصال هم روی همین دستگاه ذخیره می‌ماند. دکمه‌ی «خروج» این حالت را پاک می‌کند.</p>
        <p>۴. در «سوابق»، با فیلتر بازه‌ی تاریخ (شمسی) و دسته‌بندی (برق/ماشین‌آلات/…)، می‌توانید چاپ تکی، چاپ پشت‌سرهم، <b>دانلود PDF پشت‌سرهم</b>، گزارش تجمیعی، <b>گزارش عدم انطباق‌ها</b> و خروجی اکسل/CSV بگیرید. اگر برگه‌ای تیک نزنید، خروجی روی همه‌ی نتایج فیلترشده اعمال می‌شود.</p>
        <p>۵. آیتم‌های «حیاتی» در صورت رد شدن، نتیجه را به‌طور خودکار «ناموفق (حیاتی)» می‌کنند، حتی اگر درصد امتیاز بالا باشد.</p>
        <p>۶. اتصال ابری در «تنظیمات» با روش Apps Script (بدون نیاز به کلود گوگل) یا OAuth مستقیم قابل پیکربندی است. وضعیت همگام‌سازی، صف تغییرات و تعارض‌ها نیز در همان صفحه دیده می‌شود.</p>
        <p>۷. اپ آفلاین هم کار می‌کند: تغییرات در صف محلی نگه داشته می‌شوند و با برقراری اتصال به‌طور خودکار ارسال می‌گردند.</p>
      </div>
      {currentUser && currentUser.role === 'admin' && (
        <div className="bg-slate-900 text-slate-200 rounded-2xl p-5 text-xs leading-6">
          <p className="text-slate-400 mb-2">این بخش، سند مشخصات فنی مرجع پروژه برای استفاده‌های آتی ادمین است (فقط برای نقش ادمین نمایش داده می‌شود).</p>
          <p>سامانه بر پایه React + Tailwind با کش محلی IndexedDB و صف عملیات (op queue) برای کار آفلاین، همگام‌سازی افزایشی با Google Sheets به‌عنوان منبع حقیقت (LWW در سطح هر ردیف)، هش گذرواژه با PBKDF2-HMAC-SHA256 و salt اختصاصی هر کاربر، امضای درخواست‌ها با HMAC-SHA256، بارکد QR وکتور SVG، اسکنر دوربین زنده، تقویم شمسی، امضای دیجیتال تمام‌صفحه (ذخیره به‌صورت فایل در Drive و ارجاع در شیت)، موتور خروجی چندگانه (تکی/پشت‌سرهم/تجمیعی/اکسل/CSV/PDF)، واگذاری وظیفه، ارجاع برگه «جهت امضا»، دسترسی سطح‌بندی‌شده به‌ازای هر کاربر و اتصال دوگانه به Google Drive ساخته شده است.</p>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   ۲۰٫۵ بازرسی دوره‌ای — پوشش زیرسیستم‌ها در دوره‌ی جاری
   ============================================================ */
function CoveragePage({ goRunner }) {
  const { data, perms } = useAppData();
  const canExecute = !!(perms && perms.canExecute);
  const now = new Date();
  const templates = data.templates.filter(t => !t.archived);
  const coverages = templates.map(t => ({ tpl: t, cov: templateCoverage(t, data.assets, data.records, now), alert: coverageAlerts(t, data.assets, data.records, now) }));
  const withAssets = coverages.filter(c => c.cov.total > 0);
  const totalAll = withAssets.reduce((s, c) => s + c.cov.total, 0);
  const doneAll = withAssets.reduce((s, c) => s + c.cov.done.length, 0);
  const percentAll = totalAll ? Math.round(doneAll / totalAll * 100) : 0;
  const overdueAll = withAssets.reduce((s, c) => s + c.alert.overdue.length, 0);
  const atRiskAll = withAssets.reduce((s, c) => s + c.alert.atRisk.length, 0);

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-lg font-bold text-slate-800">بازرسی دوره‌ای — پوشش دوره‌ی جاری</h2>
        <p className="text-sm text-slate-500 mt-0.5">
          هر زیرسیستم بعد از ثبت بازرسی، تا پایان دوره از فهرست «باقی‌مانده» خارج می‌شود؛
          با شروع دوره‌ی تازه، فهرست دوباره پر می‌شود.
        </p>
      </div>

      {totalAll > 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 p-4">
          <div className="flex items-center justify-between text-sm mb-2">
            <span className="font-bold text-slate-800">پیشرفت کل سازمان</span>
            <span className="text-slate-500">{toPersianDigits(doneAll)} از {toPersianDigits(totalAll)} زیرسیستم ({toPersianDigits(percentAll)}٪)</span>
          </div>
          <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div className={"h-full rounded-full " + (percentAll >= 100 ? "bg-ok-500" : "bg-brand-600")} style={{ width: percentAll + '%' }}></div>
          </div>
          {(overdueAll > 0 || atRiskAll > 0) && (
            <div className="mt-3 flex flex-wrap gap-2">
              {overdueAll > 0 && (
                <span className="text-xs bg-danger-50 border border-danger-200 text-danger-700 rounded-lg px-2.5 py-1.5">
                  ⏰ {toPersianDigits(overdueAll)} زیرسیستم یک دوره کامل عقب است (دوره‌ی قبل هم بازرسی نشده)
                </span>
              )}
              {atRiskAll > 0 && (
                <span className="text-xs bg-warn-50 border border-warn-200 text-warn-700 rounded-lg px-2.5 py-1.5">
                  ⚠️ {toPersianDigits(atRiskAll)} زیرسیستم در خطر تأخیر (بیش از ۷۰٪ دوره گذشته)
                </span>
              )}
            </div>
          )}
        </div>
      )}

      {coverages.length === 0 && (
        <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center text-slate-400 text-sm">
          هنوز چک‌لیست فعالی وجود ندارد.
        </div>
      )}

      {coverages.map(({ tpl, cov, alert }) => (
        <div key={tpl.id} className="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <h3 className="font-bold text-slate-800">{tpl.name}</h3>
              <Badge tone="ok">🗓️ {PERIOD_LABELS[cov.period]}</Badge>
              <Badge tone="slate">{cov.label}</Badge>
              {alert.overdue.length > 0 && <Badge tone="danger">⏰ {toPersianDigits(alert.overdue.length)} عقب‌افتاده</Badge>}
              {alert.overdue.length === 0 && alert.atRisk.length > 0 && <Badge tone="warn">⚠️ {toPersianDigits(alert.atRisk.length)} در خطر تأخیر</Badge>}
            </div>
            <span className="text-xs text-slate-500">
              {toPersianDigits(cov.done.length)} از {toPersianDigits(cov.total)} انجام شده ({toPersianDigits(cov.percent)}٪)
            </span>
          </div>

          {cov.total === 0 ? (
            <p className="text-xs text-slate-400 bg-slate-50 rounded-xl px-3 py-2.5">
              این چک‌لیست هنوز زیرسیستمی ندارد؛ از صفحه «قالب‌های چک‌لیست» یا «تجهیزات» اضافه کنید.
            </p>
          ) : (
            <>
              <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                <div className={"h-full rounded-full " + (cov.percent >= 100 ? "bg-ok-500" : "bg-brand-600")} style={{ width: cov.percent + '%' }}></div>
              </div>

              {cov.percent >= 100 && (
                <p className="text-xs text-ok-700 bg-ok-50 border border-ok-200 rounded-xl px-3 py-2">
                  ✅ پوشش این چک‌لیست برای {cov.label} کامل شد. تا دوره‌ی بعد موردی باقی نیست.
                </p>
              )}

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                <div className="rounded-xl border border-warn-200 bg-warn-50/60 p-3">
                  <p className="text-xs font-bold text-warn-800 mb-2">باقی‌مانده ({toPersianDigits(cov.pending.length)})</p>
                  {cov.pending.length === 0 ? (
                    <p className="text-xs text-slate-400">موردی باقی نمانده است.</p>
                  ) : (
                    <ul className="space-y-1.5">
                      {cov.pending.map(a => (
                        <li key={a.id} className="flex items-center justify-between gap-2 bg-white border border-slate-200 rounded-lg px-2.5 py-1.5">
                          <span className="text-xs text-slate-700 min-w-0 truncate"><b>{a.code}</b> — {a.name}</span>
                          {canExecute && (
                            <button onClick={() => goRunner(a.id)}
                              className="shrink-0 text-[11px] bg-brand-600 hover:bg-brand-700 text-white rounded-lg px-2 py-1">
                              اجرای بازرسی
                            </button>
                          )}
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                <div className="rounded-xl border border-ok-200 bg-ok-50/50 p-3">
                  <p className="text-xs font-bold text-ok-800 mb-2">انجام‌شده در این دوره ({toPersianDigits(cov.done.length)})</p>
                  {cov.done.length === 0 ? (
                    <p className="text-xs text-slate-400">هنوز بازرسی‌ای در این دوره ثبت نشده است.</p>
                  ) : (
                    <ul className="space-y-1.5">
                      {cov.done.map(({ asset, record }) => (
                        <li key={asset.id} className="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5">
                          <div className="flex items-center justify-between gap-2 text-xs text-slate-700">
                            <span className="min-w-0 truncate"><b>{asset.code}</b> — {asset.name}</span>
                            <StatusBadge status={record.status} />
                          </div>
                          <p className="text-[10px] text-slate-400 mt-0.5">
                            {record.inspectorName || '—'} · {toPersianDigits(record.dateJalali || record.date || '')} · {toPersianDigits(record.percent)}٪
                          </p>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            </>
          )}
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   ۲۰٫۷ اقدام اصلاحی — دستورکارهای بازرسی‌های ناموفق
   ============================================================ */
const CORRECTIVE_STATUS_LABELS = { open: 'باز', inprogress: 'در حال انجام', closed: 'بسته شد' };

function CorrectivesPage({ goRecord }) {
  const { data, update, notify, perms } = useAppData();
  const canManage = !!(perms && perms.canManage);
  const [filter, setFilter] = useState('open');
  const items = (data.correctives || []).slice().sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0));
  const filtered = filter === 'all' ? items : items.filter(c => c.status === filter);
  const openCount = items.filter(c => c.status === 'open').length;
  const inProgressCount = items.filter(c => c.status === 'inprogress').length;

  const assign = (c, userId) => {
    const u = data.users.find(x => x.id === userId) || null;
    update(d => {
      const idx = d.correctives.findIndex(x => x.id === c.id);
      if (idx < 0) return;
      d.correctives[idx].assignedToUserId = userId || '';
      d.correctives[idx].assignedToName = u ? (u.name || u.username) : '';
      d.correctives[idx].updatedAt = Date.now();
    });
    notify(u ? `دستورکار به «${u.name || u.username}» محول شد.` : 'محول‌شده حذف شد.', 'success');
  };

  const setStatus = (c, status) => {
    update(d => {
      const idx = d.correctives.findIndex(x => x.id === c.id);
      if (idx < 0) return;
      d.correctives[idx].status = status;
      d.correctives[idx].closedAt = status === 'closed' ? Date.now() : null;
      d.correctives[idx].updatedAt = Date.now();
    });
    notify(status === 'closed' ? 'دستورکار بسته شد.' : 'وضعیت دستورکار به‌روزرسانی شد.', 'success');
  };

  const setNote = (c, note) => {
    update(d => {
      const idx = d.correctives.findIndex(x => x.id === c.id);
      if (idx < 0) return;
      d.correctives[idx].note = note;
      d.correctives[idx].updatedAt = Date.now();
    });
  };

  const tabs = [
    { key: 'open', label: 'باز' + (openCount ? ` (${toPersianDigits(openCount)})` : '') },
    { key: 'inprogress', label: 'در حال انجام' + (inProgressCount ? ` (${toPersianDigits(inProgressCount)})` : '') },
    { key: 'closed', label: 'بسته شد' },
    { key: 'all', label: 'همه' },
  ];

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-lg font-bold text-slate-800">اقدام اصلاحی</h2>
        <p className="text-sm text-slate-500 mt-0.5">
          هر بازرسی «ناموفق (حیاتی)» به‌صورت خودکار یک دستورکار می‌سازد و اینجا تا رفع مشکل و بسته‌شدن پیگیری می‌شود.
        </p>
      </div>

      <div className="flex flex-wrap gap-2">
        {tabs.map(t => (
          <button key={t.key} onClick={() => setFilter(t.key)}
            className={"px-3.5 py-1.5 rounded-xl text-sm border " + (filter === t.key ? "bg-brand-600 text-white border-brand-600" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
            {t.label}
          </button>
        ))}
      </div>

      {filtered.length === 0 && (
        <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center text-slate-400 text-sm">
          {filter === 'open' ? 'دستورکار بازی وجود ندارد. 🎉' : 'موردی با این وضعیت ثبت نشده است.'}
        </div>
      )}

      {filtered.map(c => (
        <div key={c.id} className={"bg-white rounded-2xl border p-4 space-y-3 " + (c.status === 'closed' ? "border-slate-200 opacity-70" : "border-danger-200")}>
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <Badge tone={c.status === 'closed' ? 'slate' : (c.status === 'inprogress' ? 'warn' : 'danger')}>{CORRECTIVE_STATUS_LABELS[c.status]}</Badge>
              <b className="text-sm text-slate-800">{c.assetCode}</b>
              <span className="text-xs text-slate-500">{c.templateName}</span>
            </div>
            <span className="text-[11px] text-slate-400">گشایش: {toPersianDigits(gregorianToJalaliStr(c.openedAt))}</span>
          </div>
          <p className="text-sm text-danger-700 bg-danger-50 rounded-lg px-3 py-2">{c.reason}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
            <div>
              <p className="text-slate-400 mb-1">محول به</p>
              <select className={inputCls} value={c.assignedToUserId || ''} disabled={!canManage}
                onChange={e => assign(c, e.target.value)}>
                <option value="">— تعیین نشده —</option>
                {data.users.filter(u => u.active !== false).map(u => <option key={u.id} value={u.id}>{u.name || u.username} ({ROLE_LABELS[u.role]})</option>)}
              </select>
            </div>
            <div>
              <p className="text-slate-400 mb-1">اقدام انجام‌شده / یادداشت</p>
              <input className={inputCls} value={c.note || ''} disabled={!canManage} placeholder="مثلاً: بلبرینگ تعویض شد"
                onChange={e => setNote(c, e.target.value)} />
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            {goRecord && c.recordId && (
              <button onClick={() => goRecord(c.recordId)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-600 hover:bg-slate-50">مشاهده سابقه ←</button>
            )}
            {canManage && c.status === 'open' && (
              <button onClick={() => setStatus(c, 'inprogress')} className="text-xs bg-warn-500 hover:bg-warn-600 text-white rounded-lg px-2.5 py-1.5">▶ شروع اقدام</button>
            )}
            {canManage && c.status !== 'closed' && (
              <button onClick={() => setStatus(c, 'closed')} className="text-xs bg-ok-600 hover:bg-ok-700 text-white rounded-lg px-2.5 py-1.5">✔ بستن دستورکار</button>
            )}
            {canManage && c.status === 'closed' && (
              <button onClick={() => setStatus(c, 'open')} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-600 hover:bg-slate-50">↻ بازگشایی</button>
            )}
            {c.status === 'closed' && c.closedAt && <span className="text-[11px] text-slate-400">بسته شد: {toPersianDigits(gregorianToJalaliStr(c.closedAt))}</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   ۲۰٫۸ نمودار روند امتیاز (SVG خالص، بدون کتابخانه خارجی)
   ============================================================ */
function TrendChart({ records, height }) {
  const pts = (records || []).slice().sort((a, b) =>
    (Date.parse(a.completedAt || '') || a.createdAt || 0) - (Date.parse(b.completedAt || '') || b.createdAt || 0));
  if (!pts.length) {
    return <p className="text-xs text-slate-400 text-center py-6">داده‌ای برای رسم روند وجود ندارد.</p>;
  }
  const H = height || 140, W = 560, PADX = 34, PADY = 16;
  const n = pts.length;
  const x = (i) => n === 1 ? (W - PADX * 2) / 2 + PADX : PADX + (i * (W - PADX * 2)) / (n - 1);
  const y = (v) => PADY + ((100 - v) * (H - PADY * 2)) / 100;
  const line = pts.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r.percent).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  const avg = Math.round(pts.reduce((s, r) => s + r.percent, 0) / n);
  return (
    <div dir="ltr">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: H }} role="img" aria-label="نمودار روند امتیاز">
        {[0, 25, 50, 75, 100].map(v => (
          <g key={v}>
            <line x1={PADX} x2={W - PADX} y1={y(v)} y2={y(v)} stroke="#e2e8f0" strokeWidth="1" strokeDasharray={v === 0 ? '' : '3 4'} />
            <text x={PADX - 6} y={y(v) + 3} fontSize="9" fill="#94a3b8" textAnchor="end">{v}</text>
          </g>
        ))}
        <path d={line} fill="none" stroke="#2f7dfa" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {pts.map((r, i) => (
          <circle key={i} cx={x(i)} cy={y(r.percent)} r="3" fill={r.criticalFail ? '#f04438' : '#2f7dfa'}>
            <title>{`${r.assetCode || ''} — ${r.percent}٪${r.criticalFail ? ' (ناموفق حیاتی)' : ''}`}</title>
          </circle>
        ))}
        <circle cx={x(n - 1)} cy={y(last.percent)} r="5" fill="none" stroke="#2f7dfa" strokeWidth="1.5" />
      </svg>
      <p dir="rtl" className="text-[11px] text-slate-400 text-center mt-1">
        {toPersianDigits(n)} بازرسی اخیر — میانگین: {toPersianDigits(avg)}٪ — آخرین: {toPersianDigits(last.percent)}٪ ({last.assetCode || '—'})
      </p>
    </div>
  );
}

/* ============================================================
   ۲۱. تغییر رمز عبور شخصی
   ============================================================ */
function ChangePasswordModal({ open, onClose }) {
  const { data, update, session, notify } = useAppData();
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    const user = data.users.find(u => u.id === session.userId);
    if (!user) { setError('کاربر جاری یافت نشد.'); return; }
    setBusy(true);
    setError('');
    const verdict = await verifyCredential(user, current);
    if (!verdict.ok) { setError('رمز فعلی نادرست است.'); setBusy(false); return; }
    const errMsg = validatePasswordStrength(next);
    if (errMsg) { setError(errMsg); setBusy(false); return; }
    if (next !== confirm) { setError('تکرار رمز جدید مطابقت ندارد.'); setBusy(false); return; }
    const cred = await makeCredential(next);
    const uid_ = user.id;
    update(d => {
      const idx = d.users.findIndex(u => u.id === uid_);
      if (idx < 0) return;
      Object.assign(d.users[idx], cred);
      d.users[idx].sessionVersion = (Number(d.users[idx].sessionVersion) || 1) + 1;
      delete d.users[idx].usingDefaultPassword;
      d.users[idx].updatedAt = Date.now();
    });
    setBusy(false);
    notify('رمز عبور با موفقیت تغییر کرد (هش PBKDF2 + salt).', 'success');
    setCurrent(''); setNext(''); setConfirm(''); setError('');
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="تغییر رمز عبور">
      <div className="space-y-3">
        <Field label="رمز فعلی"><input type="password" className={inputCls} value={current} onChange={e => setCurrent(e.target.value)} /></Field>
        <Field label="رمز جدید" hint="حداقل ۶ کاراکتر و شامل حداقل یک رقم"><input type="password" className={inputCls} value={next} onChange={e => setNext(e.target.value)} /></Field>
        <Field label="تکرار رمز جدید"><input type="password" className={inputCls} value={confirm} onChange={e => setConfirm(e.target.value)} /></Field>
        {error && <div className="text-danger-700 bg-danger-50 rounded-lg px-3 py-2 text-sm">{error}</div>}
        <button onClick={submit} disabled={busy} className="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white rounded-xl py-2.5 text-sm">{busy ? 'در حال ساخت هش…' : 'ذخیره رمز جدید'}</button>
      </div>
    </Modal>
  );
}

/* ============================================================
   ۲۱.۵ محول کردن وظیفه/چک‌لیست به کاربران دیگر (وظایف)
   ============================================================ */
function isAssignmentOverdue(a) {
  if (!a || a.status !== 'pending' || !a.dueDate) return false;
  // رفع ایراد ۲-۱۰: تبدیل تاریخ با نسخه‌ی امن انجام می‌شود و هرگز throw نمی‌کند
  const due = jalaliStrToDate(a.dueDate, true);
  if (!due) return false;
  return due.getTime() < Date.now();
}
