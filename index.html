        revision: Number(raw.revision) || 0,
      });
      if (queueRef.current.length || resolveCloudConfig(raw.settings || {}).url) {
        setTimeout(() => { if (flushRef.current) flushRef.current('boot'); }, 400);
      }
     } catch (err) {
      // پیش‌تر هر استثنا در این مسیر بی‌صدا گم می‌شد و `setReady(true)` هرگز
      // اجرا نمی‌شد؛ کاربر تا ابد «در حال آماده‌سازی سامانه…» می‌دید و هیچ
      // سرنخی نداشت. حالا خطا صریح و قابل‌عمل نشان داده می‌شود.
      console.error('خطای راه‌اندازی سامانه', err);
      setBootError((err && (err.message || err.name)) ? (err.name + ': ' + err.message) : String(err));
     }
    })();
    // eslint-disable-next-line
  }, []);

  useEffect(() => { if (ready && data) persistData(data); }, [data, ready]);

  /* ---------------- بازارسال PDF برگه‌های بدون فایل درایو ---------------- */
  // اگر برگه‌ای در حالت آفلاین امضا شده باشد، op داده‌اش با صف می‌رسد ولی فایل
  // PDF درایوِ آن (که فقط در لحظه‌ی امضا ساخته می‌شد) هرگز نساخته شده است.
  // این reconcile بعد از برگشت اینترنت یا راه‌اندازی برنامه، برای حداکثر ۸ برگه‌ی
  // بدون pdfUrl یک ارسال سبک (serverOnly) می‌زند و pdfUrl را روی رکورد می‌نشاند.
  const pdfReconcileRef = useRef(null);
  const schedulePdfReconcile = useCallback((delay) => {
    clearTimeout(pdfReconcileRef.current);
    pdfReconcileRef.current = setTimeout(async () => {
      try {
        const d = dataRef.current; if (!d) return;
        const cfg = resolveCloudConfig((d.settings || {}));
        if (!cfg.url || !cfg.apiKey) return;
        if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
        const need = (d.records || []).filter(r => r && !r.pdfUrl && r.signatures && r.signatures.inspector && r.signatures.inspector.image).slice(0, 8);
        if (!need.length) return;
        let doneN = 0;
        for (const r of need) {
          try {
            const visual = await Promise.resolve(ensureRecordVisuals(r));
            const json = await sendRecordToAppsScript(cfg.url, cfg.apiKey, visual, d.settings, null, { serverOnly: true });
            if (json && json.pdfUrl) {
              doneN++;
              update(x => { const j = (x.records || []).findIndex(q => q.id === r.id); if (j > -1 && !x.records[j].pdfUrl) x.records[j].pdfUrl = json.pdfUrl; });
            }
          } catch (e) { /* بی‌صدا؛ در تلاش بعدی */ }
        }
        if (doneN) notify('فایل PDF ' + toPersianDigits(doneN) + ' برگه‌ی بدون فایل، در Google Drive بازسازی شد.', 'success');
      } catch (e) { /* بی‌خطر */ }
    }, delay || 5000);
  }, [notify, update]);

  /* ---------------- رویدادهای شبکه و تمرکز پنجره ---------------- */
  useEffect(() => {
    const onOnline = () => {
      setSyncPatch({ online: true });
      if (flushRef.current) flushRef.current('online');
      schedulePdfReconcile(4000);
    };
    const onOffline = () => setSyncPatch({ online: false, status: 'offline' });
    const onFocus = () => {
      setSyncPatch({ online: typeof navigator === 'undefined' ? true : navigator.onLine !== false });
      // نقش/دسترسی کاربران از سرور تازه می‌شود (رفع ایراد ۲-۱)
      if (flushRef.current) flushRef.current('focus');
    };
    const onPageHide = () => {
      // آخرین تلاش برای رساندن تغییرات ثبت‌شده و ارسال‌نشده به سرور
      if (beaconRef.current && navigator.sendBeacon) {
        try {
          navigator.sendBeacon(beaconRef.current.url, new Blob([beaconRef.current.body], { type: 'text/plain;charset=utf-8' }));
        } catch (e) { /* بی‌صدا */ }
      }
    };
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    window.addEventListener('focus', onFocus);
    window.addEventListener('pagehide', onPageHide);
    const interval = setInterval(() => { if (flushRef.current) flushRef.current('interval'); }, 90000);
    schedulePdfReconcile(12000); // راه‌اندازی: برگه‌های آفلاینِ جلسه‌ی قبل جبران شوند
    return () => {
      window.removeEventListener('online', onOnline);
      window.removeEventListener('offline', onOffline);
      window.removeEventListener('focus', onFocus);
      window.removeEventListener('pagehide', onPageHide);
      clearInterval(interval);
      clearTimeout(pdfReconcileRef.current);
    };
  }, [setSyncPatch, schedulePdfReconcile]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4200);
    return () => clearTimeout(t);
  }, [toast]);

  /* ---------------- ورود / خروج ---------------- */
  const login = useCallback(async (username, password, remember = true) => {
    const uname = String(username || '').trim();
    const findUser = () => (dataRef.current.users || []).find(u => u.username === uname && u.active !== false);
    let user = findUser();
    let verdict = user ? await verifyCredential(user, password) : { ok: false, upgrade: null };

    if (!verdict.ok) {
      // ممکن است این حساب روی دستگاه دیگری ساخته شده و هنوز به اینجا نرسیده باشد
      try { if (pullRef.current) await pullRef.current(); } catch (e) { /* آفلاین */ }
      user = findUser();
      verdict = user ? await verifyCredential(user, password) : { ok: false, upgrade: null };
    }
    if (!verdict.ok) return 'نام کاربری یا رمز عبور اشتباه است.';

    // اعتبارنامه‌ی ارتقایافته (اگر این ورود یک ارتقای بی‌صدا بوده)؛ برای
    // فرستادن به سرور به‌عنوان `altPasswordHash` نگه داشته می‌شود — توضیح در
    // همان‌جا و در `handleAuthLogin` سمت Code.gs.
    const upgradedCred = verdict.upgrade || null;
    if (verdict.upgrade) {
      // ارتقای بی‌صدا از SHA-256 بدون salt به PBKDF2 + salt (رفع ایراد ۱-۴)
      const up = verdict.upgrade;
      const userId = user.id;
      update(d => {
        const i = d.users.findIndex(u => u.id === userId);
        if (i > -1) {
          Object.assign(d.users[i], up);
          d.users[i].sessionVersion = (Number(d.users[i].sessionVersion) || 1) + 1;
          delete d.users[i].usingDefaultPassword;
        }
      });
    }
    // تلاش برای ورود واقعی روی سرور و دریافت sessionToken امضاشده. این توکن —
    // نه بررسی محلی نقش (perms.isAdmin) که در مرورگر کاربر قابل مشاهده/دستکاری
    // است — همان چیزی است که سرور برای اجازه‌دادن به تنظیمات/کاربران/... بررسی
    // می‌کند. اگر آفلاین باشیم یا سرور در دسترس نباشد، ورود محلی همچنان برای
    // استفاده‌ی آفلاین انجام می‌شود، اما نوشتن‌های حساس تا ورود موفق بعدی روی
    // سرور، در صف باقی می‌مانند و همگام نمی‌شوند (رفتار امن‌تر از پذیرش بی‌قیدوشرط).
    const sess = {
      userId: user.id, username: user.username, name: user.name,
      sessionVersion: Number(user.sessionVersion) || 1, at: Date.now(),
      sessionToken: '', sessionExpiresAt: 0,
      persistent: !!remember,
    };
    setSession(sess);
    // «مرا به خاطر بسپار» → کپی ماندگار در localStorage؛ دفعه‌ی بعد بدون رمز.
    if (remember) {
      try {
        localStorage.setItem(SESSION_LOCAL_KEY, JSON.stringify(sess));
        localStorage.setItem(REMEMBER_CANARY_KEY, '1');
      } catch (e) {}
    } else {
      try { localStorage.removeItem(SESSION_LOCAL_KEY); localStorage.removeItem(REMEMBER_CANARY_KEY); } catch (e) {}
    }
    writeStoredSession(sess);

    // گرفتن sessionToken **عمداً منتظر نمی‌ماند**. Apps Script در اولین
    // فراخوانی پس از بیکاری، cold start دارد و گاهی ۲ تا ۵ ثانیه طول می‌کشد؛
    // پیش‌تر کاربر تمام آن مدت پشت دکمه‌ی «ورود» قفل بود، در حالی که ورود محلی
    // همان لحظه انجام شده بود. حالا اپ بلافاصله باز می‌شود و توکن در پس‌زمینه
    // می‌نشیند. نوشتن‌های حساس (کاربران/تنظیمات/دسته‌ها) تا رسیدن توکن در صف
    // می‌مانند — همان رفتار حالت آفلاین که از قبل پشتیبانی می‌شد.
    const cfg = resolveCloudConfig((dataRef.current && dataRef.current.settings) || {});
    if (cfg.url) {
      // `verdict.hash` همان هشی است که همین الان برای بررسی رمز حساب شد؛
      // محاسبه‌ی دوباره‌اش یعنی دو برابر کردن هزینه‌ی PBKDF2 هر ورود.
      const hashForServer = verdict.hash || '';
      // اگر همین الان هش را ارتقا داده‌ایم، pushِ رکوردِ کاربر و این auth.login
      // موازی در شبکه‌اند و ترتیب رسیدنشان تضمین‌شده نیست. با فرستادن هر دو هش،
      // سرور هرکدام را که دارد می‌پذیرد و ورود هیچ‌وقت بر اثر این رقابت شکست
      // نمی‌خورد. در حالت عادی (بدون ارتقا) رشته‌ی خالی می‌رود.
      const altHashForServer = (upgradedCred && upgradedCred.passwordHash) || '';
      const userId = user.id;
      (async () => {
        try {
          const res = await signedCall(cfg.url, cfg.apiKey, 'auth.login', { username: uname, passwordHash: hashForServer, altPasswordHash: altHashForServer, remember: !!remember });
          if (res && res.ok && res.sessionToken) {
            setSession(cur => {
              // ممکن است کاربر در این فاصله خارج شده یا حساب دیگری وارد شده باشد
              if (!cur || cur.userId !== userId) return cur;
              const next = Object.assign({}, cur, {
                sessionToken: res.sessionToken,
                sessionExpiresAt: Number(res.sessionExpiresAt) || 0,
              });
              writeStoredSession(next);
              return next;
            });
            // حالا که نشست معتبر است، صفِ نوشتن‌های حساس می‌تواند برود
            if (flushRef.current) flushRef.current('session');
          }
        } catch (e) { /* آفلاین یا سرور در دسترس نیست؛ ورود محلی کافی است */ }
      })();
    }

    if (flushRef.current) flushRef.current('login');
    return null;
  }, [update]);

  const logout = useCallback(() => {
    setSession(null);
    clearStoredSession();
    try { localStorage.removeItem(REMEMBER_CANARY_KEY); } catch (e) {}
  }, []);

  /**
   * وقتی سرور نوشتنی را به‌دلیل نبود/انقضای نشست رد می‌کند (کد SESSION_EXPIRED/
   * SESSION_INVALID/NO_SESSION یا پیام معادل)، توکن محلی را پاک می‌کنیم تا
   * کاربر بداند باید دوباره وارد شود؛ خودِ عملیات در صف باقی می‌ماند و بعد از
   * ورود دوباره به‌طور خودکار ارسال می‌شود.
   */
  const invalidateSessionToken = useCallback(() => {
    setSession(s => {
      if (!s || !s.sessionToken) return s;
      const next = Object.assign({}, s, { sessionToken: '', sessionExpiresAt: 0 });
      writeStoredSession(next);
      return next;
    });
  }, []);

  const verifyManagerPin = useCallback(async (pin) => {
    const v = await verifyManagerPinHash((dataRef.current || {}).settings, pin);
    if (v.ok && v.upgrade) {
      const up = v.upgrade;
      update(d => { Object.assign(d.settings, up); });
    }
    return v.ok;
  }, [update]);

  /* ---------------- دسترسی‌ها ---------------- */
  const currentUser = useMemo(() => {
    if (!data || !session) return null;
    return (data.users || []).find(u => u.id === session.userId) || null;
  }, [data, session]);

  const perms = useMemo(() => buildPermissions(currentUser), [currentUser]);

  // اگر حساب کاربر حذف یا غیرفعال شده باشد، نشست باید بسته شود
  useEffect(() => {
    if (!ready || !data || !session) return;
    if (!currentUser || currentUser.active === false) logout();
  }, [ready, data, session, currentUser, logout]);

  /* ---------------- تصاویر امضای بیرونی ---------------- */
  const resolveSignature = useCallback(async (rec, role) => {
    const s = (rec && rec.signatures && rec.signatures[role]) || null;
    if (!s) return null;
    if (s.image) return s.image;
    const key = (rec.id || '') + ':' + role;
    if (sigCacheRef.current[key]) return sigCacheRef.current[key];
    if (s.external && s.fileId) {
      const cfg = resolveCloudConfig((dataRef.current || {}).settings || {});
      if (!cfg.url || !cfg.apiKey) return null;
      try {
        const res = await signedCall(cfg.url, cfg.apiKey, 'records.signature', { fileId: s.fileId });
        if (res && res.image) { sigCacheRef.current[key] = res.image; return res.image; }
      } catch (e) { /* بدون دسترسی به سرور، بدون تصویر چاپ می‌شود */ }
    }
    return null;
  }, []);

  /** رکورد را با تصاویر امضای کامل برمی‌گرداند (بدون تغییر در داده‌ی اصلی) */
  const ensureRecordVisuals = useCallback(async (rec) => {
    if (!rec || !rec.signatures) return rec;
    const copy = Object.assign({}, rec, { signatures: Object.assign({}, rec.signatures) });
    // رفع کندی چاپ: امضاها **موازی** و با سقف زمانی ۴ ثانیه برای هر تصویر از
    // ابر گرفته می‌شوند. قبلاً هر امضا پشت‌سرهم و بدون سقف منتظر Apps Script
    // (سرمای ۲ تا ۵ ثانیه‌ای) می‌ماند → دکمه‌ی چاپ چند ثانیه بی‌واکنش بود.
    const withTimeout = (p, ms) => Promise.race([p, new Promise(res => setTimeout(() => res(null), ms))]);
    const roles = Object.keys(copy.signatures);
    const imgs = await Promise.all(roles.map(role => withTimeout(resolveSignature(rec, role), 4000)));
    roles.forEach((role, i) => { const img = imgs[i]; if (img) copy.signatures[role] = Object.assign({}, copy.signatures[role], { image: img }); });
    return copy;
  }, [resolveSignature]);

  /* ---------------- عملیات ابری دستی ---------------- */
  const syncNow = useCallback(async () => flushRef.current && flushRef.current('manual'), []);

  const replaceFromCloud = useCallback(async () => {
    const cfg = resolveCloudConfig((dataRef.current || {}).settings || {});
    if (!cfg.url || !cfg.apiKey) throw new Error('آدرس یا کلید API تنظیم نشده است.');
    const res = await signedCall(cfg.url, cfg.apiKey, 'db.pull', { since: 0, light: false });
    if (!res || !res.entities) throw new Error('پاسخ سرور نامعتبر بود.');
    const local = snapshotToLocal(res, null);
    const prevSettings = (dataRef.current || {}).settings || {};
    local.settings.googleAppsScriptUrl = prevSettings.googleAppsScriptUrl || cfg.url;
    local.settings.cloudApiKey = prevSettings.cloudApiKey;
    local.settings.googleClientId = prevSettings.googleClientId || '';
    local.settings.logoDataUrl = prevSettings.logoDataUrl || '';
    local.settings.syncConnectionSettings = !!prevSettings.syncConnectionSettings;
    lastSyncAtRef.current = Number(res.serverTime) || Date.now();
    revisionRef.current = Number(res.revision) || 0;
    local.lastSyncAt = lastSyncAtRef.current;
    local.revision = revisionRef.current;
    queueRef.current = [];
    await opsClear();
    beaconRef.current = null;
    applyData(local);
    setSyncPatch({ pending: 0, lastSyncAt: lastSyncAtRef.current, revision: revisionRef.current, conflicts: [], lastError: '', status: 'idle' });
    return local;
  }, [applyData, setSyncPatch]);

  const migrateLocalToCloud = useCallback(async () => {
    const cfg = resolveCloudConfig((dataRef.current || {}).settings || {});
    if (!cfg.url || !cfg.apiKey) throw new Error('آدرس یا کلید API تنظیم نشده است.');
    const res = await signedCall(cfg.url, cfg.apiKey, 'migrate.import_json', { data: dataRef.current }, cloudFolderName(cfg));
    lastSyncAtRef.current = 0; // دریافت کامل پس از مهاجرت
    await pullNow();
    return res;
  }, [pullNow]);

  const clearConflicts = useCallback(() => setSyncPatch({ conflicts: [] }), [setSyncPatch]);

  /**
   * ارسال دوباره‌ی یک تغییر ردشده، این بار با مهر زمانی تازه تا در LWW برنده شود.
   * این یک عمل **آگاهانه** از سوی کاربر است: یعنی می‌داند نسخه‌ی سرور را
   * بازنویسی می‌کند. opId تازه ساخته می‌شود، وگرنه سرور آن را به‌عنوان
   * «تکراری» از لاگ عملیات رد می‌کرد.
   */
  const retryConflict = useCallback(async (c) => {
    if (!c || !c.retryOp) {
      notify('این تغییر برای بازیابی نگه داشته نشده (حجمش از سقف بیشتر بود).', 'error');
      return false;
    }
    const now = Date.now();
    const op = Object.assign({}, c.retryOp, { opId: uid('op'), at: now });
    if (op.data && typeof op.data === 'object') op.data = Object.assign({}, op.data, { updatedAt: now });
    else if (op.patch && typeof op.patch === 'object') op.patch = Object.assign({}, op.patch, { updatedAt: now });
    await enqueueOps([op]);
    setSync(s => Object.assign({}, s, {
      conflicts: (s.conflicts || []).filter(x => x !== c),
    }));
    notify('تغییر شما با مهر زمانی تازه دوباره در صف ارسال قرار گرفت.', 'success');
    if (flushRef.current) flushRef.current('retry-conflict');
    return true;
  }, [enqueueOps, notify]);

  if (bootError) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
        <div className="max-w-lg w-full bg-white rounded-2xl border border-danger-500/30 p-6 text-center shadow-sm">
          <p className="text-3xl mb-2">⚠️</p>
          <p className="font-bold text-slate-800 mb-2">راه‌اندازی سامانه ناموفق بود</p>
          <p className="text-sm text-slate-500 mb-3">
            برنامه نتوانست داده‌های اولیه را آماده کند. جزئیات خطا:
          </p>
          <pre dir="ltr" className="text-left text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 overflow-x-auto text-danger-700 whitespace-pre-wrap break-all">{bootError}</pre>
          <p className="text-xs text-slate-400 mt-3 leading-6">
            اگر صفحه را با <code dir="ltr">file://</code> یا <code dir="ltr">http://</code> معمولی باز کرده‌اید،
            آن را روی HTTPS (یا localhost) ببرید. برای پاک‌کردن داده‌ی خرابِ ذخیره‌شده در همین مرورگر
            از دکمه‌ی زیر استفاده کنید (داده‌ی ابری دست‌نخورده می‌ماند).
          </p>
          <div className="flex gap-2 justify-center mt-4 flex-wrap">
            <button onClick={() => location.reload()} className="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-bold hover:bg-brand-700">↻ تلاش دوباره</button>
            <button
              onClick={() => {
                // پیش از پاک‌کردن همه‌چیز، اگر آدرس Apps Script/کلید API قبلاً
                // ذخیره شده، جدا نگه‌شان می‌داریم تا بعد از بازسازی داده‌ی
                // پیش‌فرض دوباره اعمال شوند — کاربر مجبور نیست از نو تایپ کند.
                try {
                  const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                  const s = raw && raw.settings;
                  if (s && (s.googleAppsScriptUrl || s.cloudApiKey)) {
                    localStorage.setItem(CLOUD_RESCUE_KEY, JSON.stringify({
                      googleAppsScriptUrl: s.googleAppsScriptUrl || '',
                      cloudApiKey: s.cloudApiKey || '',
                      cloudFolderName: s.cloudFolderName || '',
                    }));
                  }
                } catch (e) {}
                try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(LEGACY_STORAGE_KEY); } catch (e) {}
                try { if (window.indexedDB && indexedDB.deleteDatabase) indexedDB.deleteDatabase(IDB_NAME); } catch (e) {}
                // رفع باگ واقعی: این پاک‌سازی قبلاً فقط داده‌ی اصلی (کاربران/
                // سوابق/...) را پاک می‌کرد، نه نشستِ ماندگار را. نتیجه: بعد از
                // بازسازی داده‌ی پیش‌فرض (که شناسه‌ی کاربر ادمین تازه‌ای می‌سازد)،
                // نشستِ قدیمی همچنان به شناسه‌ی کاربرِ دیگر اشاره می‌کرد که دیگر
                // وجود نداشت → «Cannot read properties of null (reading 'name')».
                // حالا هر بازنشانی، نشست را هم پاک می‌کند تا کاربر با صفحه‌ی
                // ورود تازه روبه‌رو شود، نه با کرش.
                try { clearStoredSession(); localStorage.removeItem(REMEMBER_CANARY_KEY); } catch (e) {}
                location.reload();
              }}
              className="px-4 py-2 rounded-xl border border-danger-500 text-danger-600 text-sm font-bold hover:bg-danger-50">پاک‌کردن داده‌ی محلی و شروع تازه</button>
          </div>
        </div>
      </div>
    );
  }

  if (!ready || !data) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-100">
        <div className="text-center">
          <div className="w-10 h-10 mx-auto border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
          <p className="mt-4 text-slate-500">{cloudBootstrapping ? 'در حال دریافت اطلاعات از پایگاه ابری…' : 'در حال آماده‌سازی سامانه…'}</p>
        </div>
      </div>
    );
  }

  const value = {
    data, update, session, login, logout, currentUser, perms, verifyManagerPin, notify,
    sync, syncNow, pullNow, replaceFromCloud, migrateLocalToCloud, clearConflicts, retryConflict,
    ensureRecordVisuals, resolveSignature,
  };

  return (
    <DataContext.Provider value={value}>
      {children}
      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[999] no-print toast-in">
          <div className={
            "px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium border max-w-[92vw] " +
            (toast.kind === 'error' ? "bg-danger-50 text-danger-700 border-danger-500/30" :
             toast.kind === 'success' ? "bg-ok-50 text-ok-700 border-ok-500/30" :
             "bg-white text-slate-700 border-slate-200")
          }>
            {toast.message}
          </div>
        </div>
      )}
    </DataContext.Provider>
  );
}

/* ---------------------------------------------------------------------------
   بازیابی تعارض (رفع ایراد P0-۵)

   پیش‌تر وقتی سرور یک نوشتن را به دلیل «نسخه‌ی جدیدتر» رد می‌کرد، عملیات از صف
   حذف و فقط یک ردیف متنی در پنل تنظیمات ثبت می‌شد. یعنی تغییر کاربر **بی‌صدا**
   از بین می‌رفت و هیچ مسیر بازیابی نداشت.

   حالا خودِ عملیاتِ ردشده نگه داشته می‌شود تا کاربر بتواند آگاهانه آن را با
   مهر زمانی تازه دوباره بفرستد. چون رکوردها می‌توانند بزرگ باشند (آیتم‌ها +
   امضاها)، یک سقف حافظه گذاشته شده؛ بزرگ‌تر از آن، بازیابی دستی ممکن نیست و
   دکمه غیرفعال می‌شود (به‌جای اینکه بی‌صدا حافظه را باد کند).
   --------------------------------------------------------------------------- */
/* @core-start: opsanitize */
const MAX_CONFLICT_OP_BYTES = 16000;

function sanitizeOpForConflict_(op) {
  if (!op) return null;
  try {
    const s = JSON.stringify(op);
    if (!s || s.length > MAX_CONFLICT_OP_BYTES) return null;
    return JSON.parse(s);
  } catch (e) { return null; }
}
/* @core-end: opsanitize */

/** نشانگر وضعیت همگام‌سازی (رفع ایراد P3: کاربر باید بداند داده‌اش کجاست) */
function SyncIndicator({ compact }) {
  const { sync, syncNow } = useAppData();
  if (!sync.configured) return null;
  const map = {
    idle: { dot: 'bg-ok-500', text: 'همگام', tone: 'text-ok-700 bg-ok-50 border-ok-500/20' },
    pending: { dot: 'bg-warn-500', text: 'در انتظار ارسال', tone: 'text-warn-700 bg-warn-50 border-warn-500/20' },
    syncing: { dot: 'bg-brand-500 animate-pulse', text: 'در حال همگام‌سازی', tone: 'text-brand-700 bg-brand-50 border-brand-200' },
    offline: { dot: 'bg-slate-400', text: 'آفلاین', tone: 'text-slate-600 bg-slate-100 border-slate-200' },
    error: { dot: 'bg-danger-500', text: 'خطای همگام‌سازی', tone: 'text-danger-700 bg-danger-50 border-danger-500/20' },
  };
  const st = map[sync.status] || map.idle;
  const label = (sync.pending > 0 && sync.status !== 'syncing')
    ? `${st.text} (${toPersianDigits(sync.pending)})`
    : st.text;
  return (
    <button type="button" onClick={() => syncNow()} title={sync.lastError || 'برای همگام‌سازی فوری کلیک کنید'}
      className={"flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-medium " + st.tone}>
      <span className={"w-2 h-2 rounded-full " + st.dot}></span>
      {compact ? '' : label}
    </button>
  );
}

/* @core-start: loginaid */
/* ---------------------------------------------------------------------------
   تشخیص دام‌های رایج ورودی هنگام ورود

   شبیه‌سازی ورود با admin/1234 درست کار می‌کرد، ولی سه دام واقعی وجود دارد که
   کاربر فارسی‌زبان بی‌صدا در آن‌ها می‌افتد و فقط پیام «نام کاربری یا رمز اشتباه
   است» می‌بیند:
     ۱. ارقام فارسی/عربی — کیبورد فارسی به‌جای 1234 می‌دهد ۱۲۳۴ (بایت‌ها فرق دارند)
     ۲. فاصله‌ی ناخواسته — در login فقط نام کاربری trim می‌شود، رمز نه
     ۳. نویسه‌ی نامرئی — نیم‌فاصله/جهت‌نما هنگام کپی‌کردن رمز
   --------------------------------------------------------------------------- */
const PERSIAN_DIGIT_RE = /[\u06F0-\u06F9\u0660-\u0669]/;
const INVISIBLE_RE = /[\u200c\u200d\u200e\u200f\u00a0\u2066-\u2069]/;

function diagnoseLoginInput(username, password) {
  const hints = [];
  const u = String(username == null ? '' : username);
  const pw = String(password == null ? '' : password);
  if (PERSIAN_DIGIT_RE.test(pw)) {
    hints.push('رمز عبور ارقام فارسی/عربی دارد (مثلاً ۱۲۳۴). کیبورد را انگلیسی کنید و اعداد را 1234 بزنید — این دو برای رایانه یکی نیستند.');
  }
  if (PERSIAN_DIGIT_RE.test(u)) {
    hints.push('نام کاربری ارقام فارسی دارد؛ آن را با ارقام انگلیسی وارد کنید.');
  }
  if (pw !== pw.trim()) {
    hints.push('رمز عبور فاصله‌ی اضافی در ابتدا یا انتها دارد. رمز بدون فاصله بررسی می‌شود، پس آن را دقیق وارد کنید.');
  }
  if (u !== u.trim()) {
    hints.push('نام کاربری فاصله‌ی اضافی دارد.');
  }
  if (INVISIBLE_RE.test(pw) || INVISIBLE_RE.test(u)) {
    hints.push('نویسه‌ی نامرئی (نیم‌فاصله یا جهت‌نما) در ورودی هست — احتمالاً رمز را از جای دیگری کپی کرده‌اید. دستی تایپش کنید.');
  }
  return hints;
}
/* @core-end: loginaid */

/** لینک دعوت را از URL#hash می‌خواند: {url, token} یا null اگر نامعتبر/غایب باشد. */
function parseInviteHash(hash) {
  const m = /^#?invite=(.+)$/.exec(String(hash || ''));
  if (!m) return null;
  try {
    let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const json = decodeURIComponent(escape(atob(b64)));
    const obj = JSON.parse(json);
    if (!obj || !obj.url || !obj.token) return null;
    return { url: String(obj.url), token: String(obj.token) };
  } catch (e) { return null; }
}

/** لینک دعوت قابل اشتراک‌گذاری برای یک توکن معین می‌سازد (سمت ادمین). */
function buildInviteLink(appUrl, token) {
  const json = JSON.stringify({ url: appUrl, token });
  const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return window.location.origin + window.location.pathname + '#invite=' + b64;
}

/* ============================================================
   ۵. صفحه ورود (Login Gate)
   ============================================================ */
function LoginScreen() {
  const { login, data, update, sync, syncNow, notify } = useAppData();
  // نام کاربریِ آخرین ورود، برای راحتی کاربر پیش‌پر می‌شود (رمز هرگز نه).
  const [username, setUsername] = useState(() => {
    try { return String(localStorage.getItem(LAST_USERNAME_KEY) || ''); } catch (e) { return ''; }
  });
  const [password, setPassword] = useState('');
  // پیش‌فرض «روشن»: کاربر معمول این سامانه روی گوشی/تبلت شخصی خودش کار می‌کند
  // و نباید هر بار رمز بزند؛ اگر دستگاه اشتراکی باشد، تیک را برمی‌دارد.
  const [remember, setRemember] = useState(true);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [showPw, setShowPw] = useState(false);
  const [hints, setHints] = useState([]);
  // رفع ایراد گزارش‌شده «هر بار رمز می‌خواد»: اگر قبلاً روی همین دستگاه با
  // «مرا به خاطر بسپار» وارد شده بودیم (کلید canary هست) ولی الان هیچ نشست
  // معتبری پیدا نشد، یعنی خروج دستی نبوده — به‌احتمال زیاد مرورگر حافظه‌ی
  // محلی را نگه نداشته (حالت خصوصی/ناشناس، تنظیم پاک‌کردن هنگام خروج، یا
  // بازکردن فایل با file:// در مرورگری که آنجا ذخیره را حفظ نمی‌کند).
  const [storageLost] = useState(() => {
    try { return localStorage.getItem(REMEMBER_CANARY_KEY) === '1'; } catch (e) { return false; }
  });
  const [storageLostDismissed, setStorageLostDismissed] = useState(false);

  // اتصال اولیه به پایگاه ابری: آدرس از قبل داخل فایل هست، ولی کلید API هیچ‌وقت
  // داخل فایل جاسازی نمی‌شود (رفع ایراد ۱-۵). پس «برقرار» یعنی هر دو موجود؛
  // اگر کلید نبود، پنل با آدرسِ ازپیش‌پرشده باز می‌شود تا کاربر فقط کلید را یک
  // بار وارد کند.
  const bootCfg = resolveCloudConfig(data.settings);
  const configured = !!(bootCfg.url && bootCfg.apiKey);
  const [showCloud, setShowCloud] = useState(!configured);
  const [url, setUrl] = useState(data.settings.googleAppsScriptUrl || DEFAULT_APPS_SCRIPT_URL || '');
  const [key, setKey] = useState(data.settings.cloudApiKey || '');
  const [rememberKey, setRememberKey] = useState(true);
  const [connecting, setConnecting] = useState(false);

  // بازکردن لینک دعوت (اگر آدرس شامل #invite=... باشد): به‌جای این‌که کاربر
  // خودش کلید API را تایپ کند، همان لحظه‌ی بار شدن صفحه با سرور تماس گرفته
  // می‌شود و کلید واقعی — فقط برای همین یک‌بار — بازیابی می‌شود؛ کاربر هیچ‌وقت
  // آن را نمی‌بیند/تایپ نمی‌کند.
  const [inviteState, setInviteState] = useState(null); // null | 'checking' | 'error' | 'done'
  const [inviteError, setInviteError] = useState('');

  useEffect(() => {
    const invite = parseInviteHash(window.location.hash);
    if (!invite) return;
    let cancelled = false;
    setInviteState('checking');
    (async () => {
      let res = null;
      try {
        res = await signedCall(invite.url, '', 'auth.redeemInvite', { token: invite.token });
      } catch (e) {
        if (!cancelled) { setInviteState('error'); setInviteError('اتصال به سرور برای بازکردن لینک دعوت ناموفق بود: ' + e.message); }
        return;
      }
      if (cancelled) return;
      if (res && res.ok && res.apiKey) {
        update(d => {
          d.settings.googleAppsScriptUrl = invite.url;
          d.settings.cloudApiKey = res.apiKey;
        });
        try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
        setInviteState('done');
        setShowCloud(false);
        await syncNow();
      } else {
        setInviteState('error');
        setInviteError((res && res.error) || 'لینک دعوت نامعتبر است.');

    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    if (!username || !password) { setError('نام کاربری و رمز عبور را وارد کنید.'); return; }
    setBusy(true);
    setError('');
    const err = await login(username.trim(), password, remember);
    setBusy(false);
    if (err) {
      setError(err);
      // اگر ورود رد شد، ورودی را از نظر دام‌های رایج بررسی کن تا کاربر دلیل

      setHints(diagnoseLoginInput(username, password));

      if (err.includes('اشتباه') && !resolveCloudConfig(data.settings).apiKey) {

    try {

          cloudFolderName: s.cloudFolderName || '',
        }));
      }

    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(SESSION_LOCAL_KEY);
      localStorage.removeItem(REMEMBER_CANARY_KEY);
      localStorage.removeItem(LAST_USERNAME_KEY);
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) { /* مرورگر اجازه نمی‌دهد */ }
    try { if (window.indexedDB && indexedDB.deleteDatabase) indexedDB.deleteDatabase(idbName); } catch (e) {}
    location.reload();
  };

    const u = url.trim(), k = key.trim();

    if (!k) { notify('کلید API را وارد کنید (در Script Properties سرور با نام API_KEY ثبت شده است).', 'error'); return; }
    setConnecting(true);
    update(d => {
      d.settings.googleAppsScriptUrl = u;
      d.settings.cloudApiKey = rememberKey ? k : '';
    });
    try {
      if (rememberKey) sessionStorage.removeItem(SESSION_API_KEY);
      else sessionStorage.setItem(SESSION_API_KEY, k);
    } catch (e) { /* مرورگر اجازه دسترسی به storage نمی‌دهد */ }
    const res = await syncNow();
    setConnecting(false);

    setShowCloud(false);
    notify('اتصال به پایگاه ابری برقرار و اطلاعات دریافت شد.', 'success');
  };

  const usingDefaultAdmin = (data.users || []).some(u => u.usingDefaultPassword || (u.username === 'admin' && u.hashAlgo === 'sha256'));

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-950 via-brand-900 to-brand-800 p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 mx-auto flex items-center justify-center mb-3">
            <svg viewBox="0 0 24 24" className="w-8 h-8 text-white" fill="none" stroke="currentColor" strokeWidth="1.6">
              <path d="M9 11l3 3L22 4" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <h1 className="text-white text-xl font-bold">سامانه چک‌لیست درکاو</h1>
          <p className="text-brand-200 text-sm mt-1">بازرسی، ثبت و پیگیری تجهیزات</p>
        </div>

        {storageLost && !storageLostDismissed && (

                className="px-3 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 text-sm">ادامه بدون ابر</button>
            </div>
            {!configured && (

                بدون اتصال ابری، برنامه فقط روی همین مرورگر کار می‌کند و داده‌ها بین دستگاه‌ها همگام نمی‌شوند.

        <form onSubmit={submit} className="bg-white rounded-2xl shadow-2xl p-6 space-y-4">
          <div>
            <label className="block text-sm text-slate-600 mb-1.5">نام کاربری</label>
            <input value={username} onChange={e => setUsername(e.target.value)} autoFocus
              className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
              placeholder="admin" />
          </div>
          <div>
            <label className="block text-sm text-slate-600 mb-1.5">رمز عبور</label>
            <div className="relative">
              <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)}
                className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 pl-10 outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                placeholder="••••••" />

                {showPw ? 'پنهان' : 'نمایش'}
              </button>
            </div>
          </div>
          <label className="flex items-start gap-2 text-xs text-slate-500 cursor-pointer leading-5">
            <input type="checkbox" className="mt-0.5" checked={remember} onChange={e => setRemember(e.target.checked)} />
            <span>مرا به خاطر بسپار — ورود خودکار در این دستگاه (دیگر نیازی به واردکردن رمز نیست). روی دستگاه اشتراکی این تیک را بردارید.</span>
          </label>
          {error && <div className="text-danger-700 bg-danger-50 border border-danger-500/20 rounded-lg px-3 py-2 text-sm">{error}</div>}
          {hints.length > 0 && (
            <ul className="text-warn-800 bg-warn-50 border border-warn-500/30 rounded-lg px-3 py-2 text-xs leading-6 list-disc pr-7">
              {hints.map((h, i) => <li key={i}>{h}</li>)}
            </ul>
          )}
          {usingDefaultAdmin && !error && (
            <div className="text-warn-700 bg-warn-50 border border-warn-500/20 rounded-lg px-3 py-2 text-xs leading-5">
              هنوز از رمز پیش‌فرض <b>admin / 1234</b> استفاده می‌شود. بلافاصله پس از ورود آن را تغییر دهید.
            </div>
          )}
          <button disabled={busy} type="submit"
            className="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white rounded-xl py-2.5 font-medium transition">
            {busy ? 'در حال بررسی…' : 'ورود به سامانه'}
          </button>
          <div className="flex items-center justify-between pt-1">
            <button type="button" onClick={() => setShowCloud(v => !v)} className="text-xs text-brand-600 hover:underline">
              {configured ? 'ویرایش اتصال ابری' : 'اتصال به پایگاه ابری'}
            </button>
            {configured && <span className="text-[11px] text-slate-400">{sync.status === 'error' ? 'همگام‌سازی ناموفق' : sync.lastSyncAt ? 'آخرین همگام‌سازی: ' + toPersianDigits(new Date(sync.lastSyncAt).toLocaleTimeString('fa-IR')) : 'آماده همگام‌سازی'}</span>}
          </div>
          <div className="pt-1 border-t border-slate-100">
            <button type="button" onClick={resetLocal}
              className="text-[11px] text-slate-400 hover:text-danger-600 transition">
              ورود کار نمی‌کند؟ پاک‌کردن داده‌ی محلی این مرورگر و شروع تازه
            </button>
          </div>
          <p className="text-[10px] text-slate-300 text-center select-none" title="نشان نسخه‌ی منتشرشده">نسخه: {APP_BUILD}</p>
        </form>
      </div>
    </div>
  );
}

}

/* ============================================================
   ۷. انتخابگر تاریخ شمسی (Persian Date Picker)
   ============================================================ */
function PersianDatePicker({ value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState('');
  const [mobile, setMobile] = useState(false);
  const today = useMemo(() => new Date(), []);
  const todayJ = useMemo(() => {
    const j = safeToJalali(today.getFullYear(), today.getMonth() + 1, today.getDate());
    return j || [1400, 1, 1];
  }, [today]);

  const parsed = useMemo(() => {
    if (!value) return null;
    const p = toEnglishDigits(String(value)).split('/').map(Number);
    if (p.length === 3 && p.every(n => Number.isFinite(n))) return p;
    return null;
  }, [value]);

  const [viewY, setViewY] = useState(parsed ? parsed[0] : todayJ[0]);
  const [viewM, setViewM] = useState(parsed ? parsed[1] : todayJ[1]);
  const ref = useRef(null);

  // رفع ایراد ۲-۲: مقدار (state) همیشه «YYYY/MM/DD» با ارقام لاتین است و فقط
  // نمایش ورودی فارسی می‌شود؛ کاربر می‌تواند مستقیم هم تایپ کند.
  useEffect(() => {
    if (!open) setDraft(value ? toPersianDigits(value) : '');
  }, [open, value]);

  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia('(max-width: 640px)');
    const apply = () => setMobile(!!mq.matches);
    apply();
    if (mq.addEventListener) mq.addEventListener('change', apply);
    else if (mq.addListener) mq.addListener(apply);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener('change', apply);
      else if (mq.removeListener) mq.removeListener(apply);
    };
  }, []);

  useEffect(() => {
    function onDoc(e) { if (!mobile && ref.current && !ref.current.contains(e.target)) setOpen(false); }
    function onKey(e) { if (e.key === 'Escape') setOpen(false); }
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onKey); };
  }, [mobile]);

  const monthLen = jalaliMonthLength(viewY, viewM);
  const firstDow = useMemo(() => {
    const g = safeToGregorian(viewY, viewM, 1);
    if (!g) return 6; // اگر تبدیل ممکن نبود، هفته از شنبه شروع می‌شود
    return new Date(g[0], g[1] - 1, g[2]).getDay();
  }, [viewY, viewM]);
  const leading = (firstDow + 1) % 7;

  const days = [];
  for (let i = 0; i < leading; i++) days.push(null);
  for (let d = 1; d <= monthLen; d++) days.push(d);

  const emit = (jy, jm, jd) => {
    const str = `${jy}/${pad2(jm)}/${pad2(jd)}`;
    if (!isValidJalaliDateStr(str)) return;
    onChange(str);
    setOpen(false);
  };
  const pick = (d) => emit(viewY, viewM, d);

  const shiftMonth = (delta) => {
    let m = viewM + delta, y = viewY;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }
    setViewM(m); setViewY(y);
  };

  /* رفع ایراد P3-۱۴: پیش‌تر به‌محض اینکه سه جزء عددی ساخته می‌شد، emit صدا
     زده می‌شد. یعنی با تایپ «1403/01/1» (به قصد رسیدن به 1403/01/15) همان
     یکم ثبت و تقویم بسته می‌شد — یک انتخاب ناخواسته.

     حالا emit فقط وقتی رخ می‌دهد که ورودی **کامل** باشد: سال چهار رقمی و ماه
     و روز هر دو دو رقمی. تایپ ناقص فقط پیش‌نویس را به‌روز می‌کند. کاربر
     همچنان می‌تواند با یک رقم روز کار کند، ولی آن حالت هنگام blur (خروج از
     فیلد) یا انتخاب از تقویم نهایی می‌شود. */
  const onDraftChange = (e) => {
    const v = toEnglishDigits(e.target.value).replace(/[^0-9/]/g, '');
    setDraft(toPersianDigits(v));
    if (!isCompleteJalaliDraft(v)) return;
    const p = v.split('/').map(Number);
    emit(p[0], p[1], p[2]);
  };
  const onDraftBlur = () => {
    const v = toEnglishDigits(draft).replace(/[^0-9/]/g, '');
    if (!isValidJalaliDateStr(v)) { setDraft(value ? toPersianDigits(value) : ''); return; }
    // ورودیِ معتبرِ تک‌رقمی (مثلاً «1403/1/5») که emit نشده بود، اینجا
    // به قالب استاندارد نرمال و نهایی می‌شود تا بی‌صدا از دست نرود.
    const p = v.split('/').map(Number);
    const norm = p[0] + '/' + pad2(p[1]) + '/' + pad2(p[2]);
    if (norm !== value) onChange(norm);
    setDraft(toPersianDigits(norm));
  };

  const calendar = (
    <div className={mobile ? "bg-white rounded-2xl shadow-xl p-3 w-[19rem] max-w-[92vw]" : "bg-white border border-slate-200 rounded-2xl shadow-xl p-3 w-72"}>
      <div className="flex items-center justify-between mb-2">
        <button type="button" onClick={() => shiftMonth(1)} className="w-8 h-8 rounded-lg hover:bg-slate-100">›</button>
        <div className="font-medium text-sm">{jalaliMonthName(viewM)} {toPersianDigits(viewY)}</div>
        <button type="button" onClick={() => shiftMonth(-1)} className="w-8 h-8 rounded-lg hover:bg-slate-100">‹</button>
      </div>
      <div className="grid grid-cols-7 text-center text-xs text-slate-400 mb-1">
        {['ش','ی','د','س','چ','پ','ج'].map(d => <div key={d}>{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {days.map((d, i) => (
          <button type="button" key={i} disabled={!d} onClick={() => d && pick(d)}
            className={"h-8 rounded-lg text-sm " + (!d ? "" : "hover:bg-brand-50 " + (parsed && parsed[0]===viewY && parsed[1]===viewM && parsed[2]===d ? "bg-brand-600 text-white hover:bg-brand-600" : ""))}>
            {d ? toPersianDigits(d) : ''}
          </button>
        ))}
      </div>
      <div className="flex items-center justify-between mt-2 gap-2">
        <button type="button" onClick={() => { setViewY(todayJ[0]); setViewM(todayJ[1]); emit(todayJ[0], todayJ[1], todayJ[2]); }}
          className="text-xs text-brand-600 hover:underline">انتخاب امروز</button>
        {value && <button type="button" onClick={() => { onChange(''); setOpen(false); }} className="text-xs text-danger-600 hover:underline">پاک کردن</button>}
      </div>
    </div>
  );

  return (
    <div className="relative" ref={ref}>
      <div className="relative">
        <input
          value={draft} onChange={onDraftChange} onBlur={onDraftBlur}
          onFocus={() => setOpen(true)} onClick={() => setOpen(o => !o)}
          placeholder={placeholder || 'انتخاب تاریخ'} dir="ltr" inputMode="numeric"
          className={inputCls + " cursor-pointer text-right"} />
        <svg onClick={() => setOpen(o => !o)} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" strokeLinecap="round" />
        </svg>
      </div>
      {open && (mobile ? (
        <div className="fixed inset-0 z-[80] bg-slate-900/40 flex items-center justify-center p-4" onClick={() => setOpen(false)}>
          <div onClick={e => e.stopPropagation()}>{calendar}</div>
        </div>
      ) : (
        <div className="absolute z-40 mt-2">{calendar}</div>
      ))}
    </div>
  );
}

/* ============================================================
   ۸. استودیوی تمام‌صفحه امضای دیجیتال
   ============================================================ */
function SignaturePad({ open, onClose, onSave, roleLabel, initialName, initialTitle, lockName }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const last = useRef({ x: 0, y: 0 });
  const strokeVersion = useRef(0); // برای رفع رقابت بازیابی snapshot با کشیدن تازه (پایین را ببینید)
  // رفع باگ «انگشت می‌کشم ولی خط نشان داده نمی‌شود»:
  // ۱) در موبایل، شنونده‌ی touchmove از نوع passive است و preventDefault کار
  //    نمی‌کند → حرکت انگشت به‌جای ترسیم صفحه را اسکرول می‌کرد و حرکت با
  //    touchcancel نیمه‌کاره می‌ماند. راه‌حل استاندارد CSS است: touch-action:none
  //    روی خود بوم (پایین) + مدیریت onTouchCancel.
  // ۲) بعد از touchend، مرورگر رویدادهای ماوسِ شبیه‌سازی‌شده می‌فرستد که خط
  //    اضافه/نقطه‌ی سرگردان می‌ساخت — با مهر زمانی آخرین لمس رد می‌شوند.
  const lastTouchRef = useRef(0);
  const isStaleMouse = (e) => {
    if (e && e.touches && e.touches.length) return false;
    const t = lastTouchRef.current;
    return !!t && (Date.now() - t) < 800;
  };
  const [color, setColor] = useState('#0f172a');
  const [thickness, setThickness] = useState(3);
  const [hasDrawn, setHasDrawn] = useState(false);
  const [name, setName] = useState(initialName || '');
  const [title, setTitle] = useState(initialTitle || '');
  const [saving, setSaving] = useState(false);
  const hasDrawnRef = useRef(false);
  hasDrawnRef.current = hasDrawn;

  useEffect(() => {
    if (!open) return;
    setName(initialName || '');
    setTitle(initialTitle || '');
    setHasDrawn(false);
    hasDrawnRef.current = false;
    setSaving(false);

    // رفع ایراد ۲-۹: هنگام تغییر اندازه/چرخش گوشی، امضای کشیده‌شده پاک نمی‌شود
    const resize = (retries) => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      // رفع ایراد P3-۱۳: اگر resize دقیقاً وسط کشیدن رخ دهد (چرخش گوشی یا
      // باز شدن کیبورد)، last.current هنوز مختصات مقیاس قبلی را دارد و قطعه‌ی
      // بعدیِ امضا از یک نقطه‌ی پرت به مکان جدید انگشت کشیده می‌شود. پس حالت
      // کشیدن را می‌شکنیم؛ کاربر انگشتش را که بردارد و دوباره بگذارد ادامه می‌دهد.
      drawing.current = false;
      last.current = null;
      const parent = canvas.parentElement;
      if (!parent || !parent.clientWidth || !parent.clientHeight) {
        // رفع باگ «خط‌ها جای اشتباه/هیچ»: اگر مودال تازه mount شده و هنوز
        // layout نگرفته باشد (انیمیشن باز شدن، فونت در حال بارگذاری، کیبورد
        // موبایل)، بوم در اندازه‌ی پیش‌فرض ۳۰۰×۱۵۰ می‌ماند و با CSS کشیده
        // می‌شود → ترسیم با جای انگشت نمی‌خواند. چند بار کوتاه دوباره تلاش
        // می‌کنیم تا parent اندازه‌ی واقعی بگیرد.
        const left = Number(retries) || 0;
        if (left > 0 && open) setTimeout(() => resize(left - 1), 120);
        return;
      }
      const ratio = window.devicePixelRatio || 1;
      const w = parent.clientWidth, h = parent.clientHeight;
      let snapshot = null;
      try { snapshot = hasDrawnRef.current && canvas.width ? canvas.toDataURL() : null; } catch (e) { snapshot = null; }
      // رفع باگ: بازیابیِ snapshot ناهم‌زمان است (img.onload). اگر بین گرفتن
      // snapshot و بارگذاری‌اش، کاربر روی بومِ تازه‌پاک‌شده امضای جدیدی شروع
      // کند (مثلاً چون فیلد «سمت» را زده و کیبورد باز/بسته شده و resize دوباره
      // فرا خوانده)، snapshot کهنه دیرتر می‌رسد و با drawImage روی امضای تازه
      // کشیده می‌شود — یعنی از دید کاربر «امضا کشیدم ولی نشون نداد». با این
      // شماره‌ی نسخه، اگر بین این دو لحظه ضربه‌ی تازه‌ای ثبت شده باشد، بازیابی
      // کهنه نادیده گرفته می‌شود.
      const snapshotVersion = strokeVersion.current;

      canvas.width = Math.max(1, Math.round(w * ratio));
      canvas.height = Math.max(1, Math.round(h * ratio));
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(ratio, ratio);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (snapshot) {
        const img = new Image();
        img.onload = () => {
          if (strokeVersion.current !== snapshotVersion) return; // کاربر زودتر از رسیدن تصویر، امضای تازه شروع کرده
          try { ctx.drawImage(img, 0, 0, w, h); } catch (e) {}
        };
        img.src = snapshot;
      }
    };
    resize(8);
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    return () => {
      window.removeEventListener('resize', resize);
      window.removeEventListener('orientationchange', resize);
    };
    // eslint-disable-next-line
  }, [open]);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    // مختصات CSS پیکسل نسبت به گوشه‌ی بوم. چون canvas.style.width روی همان
    // اندازه تنظیم می‌شود و ctx.scale(ratio) فقط برای وضوح دستگاه است، فضای
    // ترسیم با CSS پیکسل یکی است و نیاز به ضریب تبدیل ندارد.
    return {
      x: point.clientX - rect.left,
      y: point.clientY - rect.top,
    };
  };

  const start = (e) => {
    if (isStaleMouse(e)) return;
    e.preventDefault();
    if (e && e.touches && e.touches.length) lastTouchRef.current = Date.now();
    drawing.current = true;
    strokeVersion.current += 1;
    last.current = getPos(e);
    // یک ضربه‌ی کوتاه (بدون حرکت) هم باید ردپا بگذارد — نقطه‌ی اولیه
    try {
      const canvas0 = canvasRef.current;
      const ctx0 = canvas0 && canvas0.getContext('2d');
      if (ctx0) {
        ctx0.fillStyle = color;
        ctx0.beginPath();
        ctx0.arc(last.current.x, last.current.y, Math.max(1, thickness / 2), 0, Math.PI * 2);
        ctx0.fill();
      }
    } catch (err) { /* اگر نقطه‌ی اولیه نکشیده شد، خود حرکت بعدی ترسیم می‌کند */ }
    setHasDrawn(true);
    hasDrawnRef.current = true;
  };
  const move = (e) => {
    if (!drawing.current) return;
    if (isStaleMouse(e)) return;
    e.preventDefault();
    if (e && e.touches && e.touches.length) lastTouchRef.current = Date.now();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const pos = getPos(e);
    // اگر last موجود نباشد (مثلاً resize وسط کار آن را پاک کرده)، از همین نقطه
    // شروع می‌کنیم تا خطِ پرت کشیده نشود.
    if (!last.current) { last.current = pos; return; }
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.current.x, last.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    last.current = pos;
  };
  const end = () => { drawing.current = false; };

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const ratio = window.devicePixelRatio || 1;
    strokeVersion.current += 1; // یک snapshot معلق و کهنه نباید بعد از پاک‌کردن دوباره رنگ بپاشد
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    setHasDrawn(false);
    hasDrawnRef.current = false;
  };

  const save = () => {
    if (!hasDrawn) { return; }
    if (!name.trim()) { return; }
    setSaving(true);
    const dataUrl = canvasRef.current.toDataURL('image/png');
    onSave({ image: dataUrl, name: name.trim(), title: title.trim(), signedAt: nowJalaliDateTime() });
    setSaving(false);
    onClose();
  };

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-[70] no-print bg-white flex flex-col" style={{ height: '100dvh', overscrollBehavior: 'contain' }}>
      <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100 shrink-0">
        <div>
          <h3 className="font-bold text-slate-800">امضای دیجیتال — {roleLabel}</h3>
          <p className="text-xs text-slate-400">با انگشت یا قلم روی صفحه امضا کنید</p>
        </div>
        <button onClick={onClose} className="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500">✕</button>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 px-4 py-3 border-b border-slate-100 shrink-0">
        <Field label="نام امضاکننده" hint={lockName ? 'از حساب کاربری شما خوانده می‌شود و قابل تغییر نیست.' : undefined}>
          {lockName ? (
            <input readOnly value={name} className={inputCls + " bg-slate-50 text-slate-500 cursor-not-allowed"} />
          ) : (
            <input value={name} onChange={e => setName(e.target.value)} className={inputCls} placeholder="نام و نام خانوادگی" />
          )}
        </Field>
        <Field label="سمت">
          <input value={title} onChange={e => setTitle(e.target.value)} className={inputCls} placeholder="مثال: بازرس فنی" />
        </Field>
      </div>

      <div className="flex-1 min-h-0 relative bg-slate-50">
        <canvas
          ref={canvasRef}
          className="signature-canvas absolute inset-0 w-full h-full"
          style={{ touchAction: 'none', WebkitUserSelect: 'none', userSelect: 'none' }}
          onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end} onTouchCancel={end}
        />
        {!hasDrawn && (
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-300 text-sm">
            محل امضا
          </div>
        )}
      </div>

      <div className="flex flex-wrap items-center gap-3 px-4 py-3 border-t border-slate-100 shrink-0">
        <div className="flex items-center gap-1.5">
          {['#0f172a', '#1c5fe0', '#dc2626'].map(c => (
            <button key={c} onClick={() => setColor(c)}
              className={"w-7 h-7 rounded-full border-2 " + (color === c ? "border-slate-400" : "border-transparent")}
              style={{ backgroundColor: c }} title={c === '#0f172a' ? 'مشکی رسمی' : c === '#1c5fe0' ? 'آبی اداری' : 'قرمز'} />
          ))}
        </div>
        <div className="flex items-center gap-1.5">
          {[{ v: 2, l: 'نازک' }, { v: 3.5, l: 'متوسط' }, { v: 6, l: 'ضخیم' }].map(t => (
            <button key={t.v} onClick={() => setThickness(t.v)}
              className={"px-2.5 py-1.5 rounded-lg text-xs border " + (thickness === t.v ? "bg-brand-50 border-brand-300 text-brand-700" : "border-slate-200 text-slate-500")}>
              {t.l}
            </button>
          ))}
        </div>
        <div className="flex-1"></div>
        <button onClick={clear} className="px-3.5 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">پاک کردن</button>
        <button onClick={save} disabled={!hasDrawn || !name.trim() || saving}
          className="px-5 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700 disabled:opacity-50">
          ثبت امضا
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   ۹. اسکنر دوربین زنده (بدون ری‌استارت مکرر — رفع باگ نمونه قبلی)
   ============================================================ */
function CameraScanner({ open, onClose, onDetect }) {
  const containerId = 'qr-camera-region';
  const instanceRef = useRef(null);
  const [error, setError] = useState('');
  const [scanning, setScanning] = useState(false);

  useEffect(() => {
    if (!open) return;
    let cancelled = false;
    setError('');
    ensureLib('html5qrcode').then(Ctor => {
      if (cancelled) return;
      const html5Qr = new Ctor(containerId);
      instanceRef.current = html5Qr;
      startScanner(html5Qr);
    }).catch(e => {
      console.error('بارگذاری کتابخانه‌ی اسکن بارکد ناموفق بود', e);
      if (!cancelled) setError('کتابخانه‌ی اسکنر بارگذاری نشد. اتصال اینترنت را بررسی کنید.');
    });

    function startScanner(html5Qr) {
    html5Qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (decodedText) => {
        if (cancelled) return;
        // جلوگیری از فراخوانی مکرر/ری‌استارت دوربین با متوقف کردن قطعی پس از اولین تشخیص
        cancelled = true;
        html5Qr.stop().then(() => html5Qr.clear()).catch(() => {}).finally(() => {
          onDetect(decodedText);
        });
      },
      () => { /* خطاهای فریم‌به‌فریم عادی نادیده گرفته می‌شود */ }
    ).then(() => { if (!cancelled) setScanning(true); })
      .catch(err => setError('دسترسی به دوربین ممکن نشد: ' + (err && err.message ? err.message : String(err))));
    }

    return () => {
      cancelled = true;
      const inst = instanceRef.current;
      if (inst) {
        inst.stop().then(() => inst.clear()).catch(() => {});
      }
      instanceRef.current = null;
      setScanning(false);
    };
  }, [open]);

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[70] no-print bg-black flex flex-col" style={{ height: '100dvh' }}>
      <div className="flex items-center justify-between px-4 py-3 text-white shrink-0">
        <h3 className="font-bold">اسکن بارکد تجهیز</h3>
        <button onClick={onClose} className="w-9 h-9 rounded-lg hover:bg-white/10">✕</button>
      </div>
      <div className="flex-1 relative flex items-center justify-center">
        <div id={containerId} className="w-full max-w-md"></div>
        {!scanning && !error && (
          <div className="absolute inset-0 flex items-center justify-center text-white/70 text-sm">در حال راه‌اندازی دوربین…</div>
        )}
        {error && (
          <div className="absolute inset-x-4 top-1/2 -translate-y-1/2 text-center text-danger-300 text-sm bg-black/60 rounded-xl p-4">{error}</div>
        )}
      </div>
      <p className="text-white/50 text-xs text-center pb-6 shrink-0">بارکد روی برچسب تجهیز را داخل کادر قرار دهید</p>
    </div>
  );
}
