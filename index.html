            </div>
            <div className="flex gap-2 mt-3">
              <button onClick={() => goRunner(a.id)} className="flex-1 text-xs bg-brand-50 text-brand-700 rounded-lg py-2 hover:bg-brand-100">اجرای بازرسی</button>
              {canManage && <button onClick={() => { setEditing(a); setShowForm(true); }} className="text-xs bg-slate-100 text-slate-600 rounded-lg py-2 px-3 hover:bg-slate-200">ویرایش</button>}
              {canManage && <button onClick={() => setConfirmDel(a)} className="text-xs bg-danger-50 text-danger-700 rounded-lg py-2 px-3 hover:bg-danger-100">حذف</button>}
            </div>
          </div>
        ))}
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} title={editing ? 'ویرایش تجهیز' : 'تجهیز جدید'}>
        <AssetForm initial={editing} templates={data.templates.filter(t => !t.archived)} categories={data.categories}
          onSave={saveAsset} onCancel={() => setShowForm(false)} />
      </Modal>

      <ConfirmDialog open={!!confirmDel} title="حذف تجهیز"
        message={confirmDel ? `آیا از حذف «${confirmDel.code} - ${confirmDel.name}» مطمئن هستید؟ سوابق بازرسی مرتبط حذف نمی‌شوند اما به این تجهیز ارجاع خواهند داد.` : ''}
        danger onConfirm={() => deleteAsset(confirmDel.id)} onCancel={() => setConfirmDel(null)} />

      {studioAsset && <AssetQrStudio asset={studioAsset} org={data.settings} onClose={() => setStudioAsset(null)}
        onRun={() => { setStudioAsset(null); goRunner(studioAsset.id); }} />}

      <CameraScanner open={scannerOpen} onClose={() => setScannerOpen(false)} onDetect={onScanDetected} />
    </div>
  );
}

/* ============================================================
   ۱۲. صفحه مدیریت قالب‌های چک‌لیست (Templates)
   ============================================================ */
const ITEM_TYPE_LABELS = {
  checkbox: 'چک‌باکس (تأیید)',
  yesno: 'بله / خیر',
  rating: 'امتیازی',
  numeric: 'عددی',
  text: 'متنی',
  select: 'انتخابی',
};

function TemplateEditor({ initial, categories, settings, linkedAssets, onSave, onCancel }) {
  // قالب تازه همان لحظه شناسه می‌گیرد تا زیرسیستم‌های افزوده‌شده به آن گره بخورند.
  const [t, setT] = useState(() => (initial
    ? Object.assign({}, initial)
    : {
        id: 'tpl-' + Date.now(),
        name: '', category: categories[0] || '', passThreshold: 80,
        // پیش‌فرض تعداد امضا از جریان امضای سازمان می‌آید، ولی بعداً روی خودِ
        // همین قالب قابل تغییر است و بر سازمان تحمیل نمی‌شود.
        signers: isSignChainMode(settings) ? 3 : 1,
        // دوره‌ی بازرسی صریح در پیش‌نویس ست می‌شود تا قالب تازه بدون فیلد ذخیره
        // نشود (وگرنه تا مهاجرت بعدی بی‌مقدار می‌ماند). پیش‌فرض: ماهانه.
        period: 'monthly',
        items: [],
      }));
  // زیرسیستم‌های تازه که همراه قالب ذخیره می‌شوند (پیش از ذخیره، محلی‌اند)
  const [newAssets, setNewAssets] = useState([]);
  const [na, setNa] = useState({ code: '', name: '', location: '' });
  const [naError, setNaError] = useState('');

  const addSubsystem = () => {
    const code = (na.code || '').trim(), name = (na.name || '').trim();
    if (!code || !name) { setNaError('کد و نام زیرسیستم الزامی است.'); return; }
    const dup = newAssets.some(x => x.code.toLowerCase() === code.toLowerCase())
      || (linkedAssets || []).some(a => (a.code || '').toLowerCase() === code.toLowerCase());
    if (dup) { setNaError('زیرسیستمی با این کد قبلاً ثبت شده است.'); return; }
    setNewAssets(list => [...list, { code: code, name: name, location: (na.location || '').trim() }]);
    setNa({ code: '', name: '', location: '' });
    setNaError('');
  };

  const addItem = () => {
    setT({ ...t, items: [...t.items, { id: 'it-' + Date.now(), type: 'checkbox', label: '', weight: 10, critical: false }] });
  };
  const updateItem = (idx, patch) => {
    const items = t.items.slice();
    items[idx] = { ...items[idx], ...patch };
    setT({ ...t, items });
  };
  const removeItem = (idx) => {
    setT({ ...t, items: t.items.filter((_, i) => i !== idx) });
  };
  const move = (idx, dir) => {
    const items = t.items.slice();
    const j = idx + dir;
    if (j < 0 || j >= items.length) return;
    [items[idx], items[j]] = [items[j], items[idx]];
    setT({ ...t, items });
  };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Field label="نام قالب"><input className={inputCls} value={t.name} onChange={e => setT({ ...t, name: e.target.value })} /></Field>
        <Field label="دسته‌بندی">
          <select className={inputCls} value={t.category} onChange={e => setT({ ...t, category: e.target.value })}>
            {categories.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="حد نصاب قبولی (%)">
          <input type="text" inputMode="numeric" dir="ltr" className={inputCls} value={toPersianDigits(t.passThreshold)}
            onChange={e => setT({ ...t, passThreshold: Number(sanitizeNumericInput(e.target.value, { max: 100, maxLen: 3 })) || 0 })} />
        </Field>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="تعداد امضاکنندگان این چک‌لیست"
          hint="همین اول مشخص می‌شود چند نفر باید برگه را امضا کنند؛ موقع اجرای بازرسی، برای هر مرحله «حضوری» (پد امضا همان‌جا باز می‌شود) یا «ارجاعی» انتخاب می‌شود.">
          <select className={inputCls} value={Number(t.signers) || (isSignChainMode(settings) ? 3 : 1)}
            onChange={e => setT({ ...t, signers: Number(e.target.value) })}>
            <option value={1}>۱ امضا — فقط بازرس / اجراکننده (در محل)</option>
            <option value={2}>۲ امضا — بازرس + ناظر / تحویل‌گیرنده</option>
            <option value={3}>۳ امضا — بازرس + ناظر / تحویل‌گیرنده + تأییدکننده‌ی نهایی</option>
          </select>
        </Field>
        <Field label="دوره‌ی بازرسی"
          hint="در صفحه‌ی «بازرسی دوره‌ای»، هر زیرسیستم بعد از انجام بازرسی تا پایان همین دوره از فهرست باقی‌مانده خارج می‌شود.">
          <select className={inputCls} value={resolveTemplatePeriod(t)}
            onChange={e => setT({ ...t, period: e.target.value })}>
            <option value="daily">روزانه — هر روز یک‌بار برای هر زیرسیستم</option>
            <option value="weekly">هفتگی — هر هفته (از شنبه) یک‌بار</option>
            <option value="monthly">ماهانه — هر ماه شمسی یک‌بار</option>
            <option value="quarterly">فصلی — هر فصل (بهار/تابستان/پاییز/زمستان) یک‌بار</option>
            <option value="annual">سالیانه — هر سال شمسی یک‌بار</option>
          </select>
        </Field>
      </div>

      <div className="space-y-2">
        <div className="flex items-center justify-between">
          <h4 className="font-medium text-sm text-slate-700">آیتم‌های بازرسی</h4>
          <button onClick={addItem} className="text-xs bg-brand-50 text-brand-700 rounded-lg px-3 py-1.5 hover:bg-brand-100">+ افزودن آیتم</button>
        </div>
        {t.items.length === 0 && <p className="text-xs text-slate-400">هنوز آیتمی افزوده نشده است.</p>}
        {t.items.map((it, idx) => (
          <div key={it.id} className="border border-slate-200 rounded-xl p-3 space-y-2 bg-slate-50">
            <div className="flex gap-2">
              <input className={inputCls + " flex-1"} placeholder="عنوان آیتم" value={it.label} onChange={e => updateItem(idx, { label: e.target.value })} />
              <select className={inputCls + " w-40"} value={it.type} onChange={e => updateItem(idx, { type: e.target.value })}>
                {Object.entries(ITEM_TYPE_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              <label className="text-xs text-slate-500 flex items-center gap-1">وزن
                <input type="text" inputMode="numeric" dir="ltr" className="w-16 border border-slate-300 rounded-lg px-2 py-1 text-xs" value={toPersianDigits(it.weight)}
                  onChange={e => updateItem(idx, { weight: Number(sanitizeNumericInput(e.target.value, { max: 1000, maxLen: 4 })) || 0 })} />
              </label>
              {(it.type === 'checkbox' || it.type === 'yesno') && (
                <label className="text-xs text-slate-500 flex items-center gap-1.5">
                  <input type="checkbox" checked={!!it.critical} onChange={e => updateItem(idx, { critical: e.target.checked })} />
                  آیتم حیاتی (Critical)
                </label>
              )}
              {it.type === 'rating' && (
                <label className="text-xs text-slate-500 flex items-center gap-1">حداکثر امتیاز
                  <input type="text" inputMode="numeric" dir="ltr" className="w-14 border border-slate-300 rounded-lg px-2 py-1 text-xs" value={toPersianDigits(it.scaleMax || 5)}
                    onChange={e => updateItem(idx, { scaleMax: Math.max(2, Number(sanitizeNumericInput(e.target.value, { max: 10, maxLen: 2 })) || 5) })} />
                </label>
              )}
              {it.type === 'select' && (
                <input className="flex-1 min-w-[10rem] border border-slate-300 rounded-lg px-2 py-1 text-xs" placeholder="گزینه‌ها با کاما جدا شوند"
                  value={(it.options || []).join('،')} onChange={e => updateItem(idx, { options: e.target.value.split(/[،,]/).map(s => s.trim()).filter(Boolean) })} />
              )}
              <div className="flex-1"></div>
              <button onClick={() => move(idx, -1)} className="w-7 h-7 rounded-lg hover:bg-slate-200 text-xs">▲</button>
              <button onClick={() => move(idx, 1)} className="w-7 h-7 rounded-lg hover:bg-slate-200 text-xs">▼</button>
              <button onClick={() => removeItem(idx)} className="w-7 h-7 rounded-lg hover:bg-danger-50 text-danger-600 text-xs">✕</button>
            </div>
          </div>
        ))}
      </div>

      <div className="rounded-2xl border border-slate-200 bg-slate-50 p-3 space-y-2.5">
        <div>
          <h4 className="font-medium text-sm text-slate-700">زیرسیستم‌ها / تجهیزات این چک‌لیست</h4>
          <p className="text-[11px] text-slate-400 mt-0.5">
            هر چک‌لیست، زیرسیستم‌های خودش را دارد؛ موقع اجرا فقط همین‌ها فهرست می‌شوند نه تجهیزاتِ چک‌لیست‌های دیگر.
          </p>
        </div>

        {(linkedAssets || []).length === 0 && newAssets.length === 0 && (
          <p className="text-xs text-slate-400">هنوز زیرسیستمی برای این چک‌لیست ثبت نشده است.</p>
        )}
        {(linkedAssets || []).length > 0 && (
          <ul className="space-y-1">
            {linkedAssets.map(a => (
              <li key={a.id} className="text-xs bg-white border border-slate-200 rounded-lg px-3 py-1.5 flex items-center justify-between">
                <span className="text-slate-700"><b>{a.code}</b> — {a.name}</span>
                <span className="text-slate-400">{a.location || ''}</span>
              </li>
            ))}
          </ul>
        )}
        {newAssets.length > 0 && (
          <ul className="space-y-1">
            {newAssets.map((a, i) => (
              <li key={i} className="text-xs bg-brand-50 border border-brand-200 rounded-lg px-3 py-1.5 flex items-center justify-between">
                <span className="text-slate-700"><b>{a.code}</b> — {a.name} <span className="text-slate-400">({a.location || 'بدون محل'})</span></span>
                <button type="button" onClick={() => setNewAssets(list => list.filter((_, j) => j !== i))}
                  className="text-danger-600 hover:bg-danger-50 rounded px-1.5">✕</button>
              </li>
            ))}
          </ul>
        )}

        <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 items-end">
          <input className={inputCls} placeholder="کد (مثل MC-01)" value={na.code} onChange={e => setNa({ ...na, code: e.target.value })} />
          <input className={inputCls} placeholder="نام زیرسیستم" value={na.name} onChange={e => setNa({ ...na, name: e.target.value })} />
          <input className={inputCls} placeholder="محل استقرار (اختیاری)" value={na.location} onChange={e => setNa({ ...na, location: e.target.value })} />
          <button type="button" onClick={addSubsystem}
            className="text-xs bg-brand-50 text-brand-700 rounded-lg px-3 py-2.5 hover:bg-brand-100 border border-brand-200">+ افزودن زیرسیستم</button>
        </div>
        {naError && <p className="text-xs text-danger-600">{naError}</p>}
        {(linkedAssets || []).length > 0 && (
          <p className="text-[11px] text-slate-400">برای ویرایش یا جابه‌جایی زیرسیستم‌های موجود، از صفحه «تجهیزات» استفاده کنید.</p>
        )}
      </div>

      <div className="flex gap-2 justify-end pt-2">
        <button onClick={onCancel} className="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">انصراف</button>
        <button onClick={() => t.name && onSave(Object.assign({}, t, { _newAssets: newAssets }))}
          className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700">ذخیره قالب</button>
      </div>
    </div>
  );
}

function TemplatesPage() {
  const { data, update, notify, perms } = useAppData();
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [confirmArchive, setConfirmArchive] = useState(null);
  const canManage = !!(perms && perms.canManage);

  const usageCount = (tplId) => data.assets.filter(a => a.templateId === tplId).length;

  const saveTemplate = (t) => {
    if (!canManage) { notify('برای ساخت یا ویرایش قالب به دسترسی مدیر نیاز است.', 'error'); return; }
    // زیرسیستم‌های تازه از بدنه‌ی قالب جدا می‌شوند: آن‌ها موجودیت «تجهیز» هستند،
    // نه فیلد قالب — فقط پیوندشان (templateId) با قالب ذخیره می‌شود.
    const freshAssets = Array.isArray(t._newAssets) ? t._newAssets : [];
    const tpl = { ...t };
    delete tpl._newAssets;
    if (!tpl.id) tpl.id = 'tpl-' + Date.now();
    update(d => {
      if (editing && editing.id) {
        const idx = d.templates.findIndex(x => x.id === editing.id);
        d.templates[idx] = { ...d.templates[idx], ...tpl };
      } else {
        d.templates.push({ archived: false, ...tpl });
      }
      const tplId = tpl.id;
      freshAssets.forEach((fa, i) => {
        d.assets.push({
          id: 'asset-' + Date.now() + '-' + i,
          code: fa.code, name: fa.name, location: fa.location || '',
          serial: '', templateId: tplId, category: tpl.category || '',
        });
      });
    });
    setShowForm(false); setEditing(null);
    notify(freshAssets.length
      ? `قالب چک‌لیست همراه ${toPersianDigits(freshAssets.length)} زیرسیستم ذخیره شد.`
      : 'قالب چک‌لیست ذخیره شد.', 'success');
  };

  const toggleArchive = (tpl) => {
    if (!canManage) { notify('برای بایگانی قالب به دسترسی مدیر نیاز است.', 'error'); return; }
    update(d => {
      const idx = d.templates.findIndex(x => x.id === tpl.id);
      d.templates[idx].archived = !d.templates[idx].archived;
    });
    setConfirmArchive(null);
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-lg font-bold text-slate-800">قالب‌های چک‌لیست</h2>
          <p className="text-sm text-slate-500">تعریف آیتم‌های بازرسی، وزن‌دهی و موارد حیاتی</p>
        </div>
        {canManage
          ? <button onClick={() => { setEditing(null); setShowForm(true); }} className="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">+ قالب جدید</button>
          : <span className="text-xs text-slate-400 bg-slate-100 rounded-xl px-3 py-2.5">حالت فقط‌خواندنی — برای ساخت یا ویرایش قالب به دسترسی مدیر نیاز است</span>}
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {data.templates.map(t => (
          <div key={t.id} className={"bg-white rounded-2xl border p-4 " + (t.archived ? "border-slate-200 opacity-60" : "border-slate-200")}>
            <div className="flex items-start justify-between">
              <div>
                <div className="font-bold text-slate-800">{t.name}</div>
                <div className="text-xs text-slate-400 mt-0.5">{t.category} · {toPersianDigits(t.items.length)} آیتم · حد نصاب {toPersianDigits(t.passThreshold)}٪</div>
                <div className="flex flex-wrap gap-1.5 mt-1.5">
                  <Badge tone="brand">✍️ {signerCountLabel(templateSignerCount(t, data.settings))}</Badge>
                  <Badge tone="slate">🔧 {toPersianDigits(usageCount(t.id))} زیرسیستم</Badge>
                  <Badge tone="ok">🗓️ {PERIOD_LABELS[resolveTemplatePeriod(t)]}</Badge>
                </div>
              </div>
              {t.archived && <Badge tone="slate">بایگانی‌شده</Badge>}
            </div>
            {canManage ? (
              <div className="flex gap-2 mt-3">
                <button onClick={() => { setEditing(t); setShowForm(true); }} className="text-xs bg-slate-100 text-slate-600 rounded-lg py-2 px-3 hover:bg-slate-200">ویرایش</button>
                <button onClick={() => setConfirmArchive(t)} className="text-xs bg-warn-50 text-warn-700 rounded-lg py-2 px-3 hover:bg-warn-500/20">
                  {t.archived ? 'بازگردانی' : 'بایگانی'}
                </button>
              </div>
            ) : (
              <p className="text-[11px] text-slate-400 mt-3">به‌کار رفته در {toPersianDigits(usageCount(t.id))} زیرسیستم — برای ویرایش به دسترسی مدیر نیاز است</p>
            )}
          </div>
        ))}
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} wide title={editing ? 'ویرایش قالب' : 'قالب جدید'}>
        <TemplateEditor initial={editing} categories={data.categories} settings={data.settings}
          linkedAssets={editing ? data.assets.filter(a => a.templateId === editing.id) : []}
          onSave={saveTemplate} onCancel={() => setShowForm(false)} />
      </Modal>

      <ConfirmDialog open={!!confirmArchive}
        title={confirmArchive && confirmArchive.archived ? 'بازگردانی قالب' : 'بایگانی قالب'}
        message={confirmArchive ? `این قالب توسط ${toPersianDigits(usageCount(confirmArchive.id))} تجهیز استفاده می‌شود. آیا ادامه می‌دهید؟` : ''}
        onConfirm={() => toggleArchive(confirmArchive)} onCancel={() => setConfirmArchive(null)} />
    </div>
  );
}

/* ============================================================
   ۱۳. موتور اجرای چک‌لیست (Runner)
   ============================================================ */
function ChecklistItemInput({ item, value, onChange }) {
  if (item.type === 'checkbox') {
    return (
      <label className="flex items-center gap-2.5 cursor-pointer">
        <input type="checkbox" className="w-5 h-5 accent-brand-600" checked={!!value} onChange={e => onChange(e.target.checked)} />
        <span className="text-sm text-slate-700">تأیید می‌شود</span>
      </label>
    );
  }
  if (item.type === 'yesno') {
    return (
      <div className="flex gap-2">
        {['بله', 'خیر'].map(v => (
          <button key={v} type="button" onClick={() => onChange(v)}
            className={"px-4 py-2 rounded-xl text-sm border " + (value === v ? (v === 'بله' ? "bg-ok-50 border-ok-500 text-ok-700" : "bg-danger-50 border-danger-500 text-danger-700") : "border-slate-200 text-slate-500 hover:bg-slate-50")}>
            {v}
          </button>
        ))}
      </div>
    );
  }
  if (item.type === 'rating') {
    const max = item.scaleMax || 5;
    return (
      <div className="flex gap-1.5">
        {Array.from({ length: max }, (_, i) => i + 1).map(n => (
          <button key={n} type="button" onClick={() => onChange(n)}
            className={"w-9 h-9 rounded-lg text-sm border " + (Number(value) >= n ? "bg-brand-600 border-brand-600 text-white" : "border-slate-200 text-slate-400 hover:bg-slate-50")}>
            {toPersianDigits(n)}
          </button>
        ))}
      </div>
    );
  }
  if (item.type === 'numeric') {
    return <input type="text" inputMode="decimal" dir="ltr" className={inputCls} value={value === undefined ? '' : toPersianDigits(value)}
      onChange={e => onChange(sanitizeNumericInput(e.target.value, { allowDecimal: true, maxLen: 12 }))} />;
  }
  if (item.type === 'select') {
    return (
      <select className={inputCls} value={value || ''} onChange={e => onChange(e.target.value)}>
        <option value="">— انتخاب کنید —</option>
        {(item.options || []).map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  }
  return <textarea className={inputCls} rows={2} value={value || ''} onChange={e => onChange(e.target.value)} />;
}

/**
 * «جهت امضا» — ارجاع برگه به ناظر/تحویل‌گیرنده وقتی در محل حاضر نیست.
 * فقط کاربرانی فهرست می‌شوند که فعال باشند و نقششان اجازه‌ی تأیید بدهد؛
 * ارجاع به بقیه بن‌بست می‌سازد (کسی نمی‌تواند امضا کند).
 */
/**
 * انتخاب گیرنده‌ی یک مرحله از زنجیره‌ی امضا.
 *
 * `required=false` (پیش‌فرض) همان رفتار نسخه‌ی قبل است: ارجاع اختیاری به ناظر.
 * `required=true` برای مدل ب استفاده می‌شود؛ آن‌وقت گزینه‌ی «بدون ارجاع» حذف
 * می‌شود چون اصلاً حالت معتبری نیست.
 */
function SignReferralBox({ users, currentUser, value, note, onChange, onNoteChange,
                           slot, required, stepNo, exclude, mode, onModeChange,
                           onsiteSig, onCaptureOnsite, onClearOnsite }) {
  const theSlot = SIGN_SLOTS[slot] ? slot : 'approver';
  const label = signSlotLabel(theSlot);
  const excludeIds = exclude || [];
  const candidates = useMemo(
    () => signRequestCandidates(users, currentUser, excludeIds),
    [users, currentUser, excludeIds.join('|')]
  );
  const selected = candidates.find(u => u.id === value)
    || (users || []).find(u => u.id === value);
  // نام امضا همیشه از حساب کاربری گیرنده خوانده می‌شود (نه چیزی که روی پد تایپ
  // شود)؛ همان مقداری که پد امضا قفلش می‌کند.
  const onsiteName = selected ? resolveSignerName(selected) : '';

  const filled = !!value;
  const tone = required
    ? (filled ? 'border-ok-300 bg-ok-50' : 'border-danger-300 bg-danger-50')
    : (filled ? 'border-warn-300 bg-warn-50' : 'border-dashed border-slate-300 bg-white');

  // «حضوری» یا «ارجاعی»: فقط برای مراحل اجباریِ زنجیره (required) معنا دارد؛
  // ارجاعِ اختیاریِ ناظر (required=false) همیشه ارجاعی است و این سوییچ لازم ندارد.
  const theMode = (mode === 'referral') ? 'referral' : 'onsite';
  const showModeSwitch = required && !!onModeChange;

  return (
    <div className={'rounded-2xl border p-4 ' + tone}>
      <div className="flex items-start gap-2.5 mb-3">
        <span className="text-lg leading-none mt-0.5">{filled ? '✅' : '✍️'}</span>
        <div className="flex-1 min-w-0">
          <h4 className="font-bold text-slate-800 text-sm">
            {stepNo ? 'مرحله ' + toPersianDigits(stepNo) + ' — ' + label : 'جهت امضا'}
          </h4>
          <p className="text-xs text-slate-500 mt-0.5">
            {required
              ? (theMode === 'referral'
                ? 'برگه مستقیماً برای این فرد ارجاع می‌شود و در صفحه‌ی «در انتظار امضا»ی او ظاهر می‌شود؛ از شما پرسیده نمی‌شود که آیا کنار دستگاه حاضر است.'
                : 'همان لحظه که «حضوری» را می‌زنید، پد امضا باز می‌شود و امضایش را همین‌جا، داخل فرم می‌گیرید؛ امضا همراه برگه ثبت می‌شود و بعد از ثبت دوباره پرسیده نمی‌شود. اگر پد را ببندید، بعد از ثبت یک‌بار دیگر پرسیده می‌شود.')
              : 'ناظر / تحویل‌گیرنده در محل حاضر نیست؟ برگه را به او ارجاع دهید تا بعداً از صفحه‌ی «در انتظار امضا» امضا کند. ثبت بازرسی بدون این امضا هم مجاز است.'}
          </p>
        </div>
        {filled && !required && (
          <button onClick={() => { onChange(''); onNoteChange(''); }}
            className="shrink-0 text-xs text-slate-500 hover:text-danger-600 px-2 py-1 rounded-lg hover:bg-white">
            حذف ارجاع
          </button>
        )}
      </div>

      {showModeSwitch && (
        <div className="flex rounded-xl border border-slate-200 bg-slate-50 p-1 mb-3 text-xs">
          <button type="button" onClick={() => {
              // «حضوری» = همان لحظه پد امضا باز می‌شود (نه بعد از ثبت).
              // اگر این تب از قبل فعال است و امضا هم گرفته شده، دوباره پد را
              // روی صورت کاربر باز نمی‌کنیم؛ برای تغییر، دکمه‌ی «تغییر» پایین هست.
              const wasOnsite = theMode === 'onsite';
              onModeChange('onsite');
              if (!wasOnsite || !onsiteSig) { if (onCaptureOnsite) onCaptureOnsite(); }
            }}
            className={'flex-1 rounded-lg py-2 font-medium transition ' +
              (theMode === 'onsite' ? 'bg-white text-brand-700 shadow-sm border border-brand-200' : 'text-slate-500 hover:text-slate-700')}>
            ✍️ حضوری <span className="block text-[10px] font-normal opacity-75 mt-0.5">{onsiteSig ? 'امضا گرفته شد' : 'همان‌جا پد امضا باز می‌شود'}</span>
          </button>
          <button type="button" onClick={() => onModeChange('referral')}
            className={'flex-1 rounded-lg py-2 font-medium transition ' +
              (theMode === 'referral' ? 'bg-white text-brand-700 shadow-sm border border-brand-200' : 'text-slate-500 hover:text-slate-700')}>
            ↪️ ارجاعی <span className="block text-[10px] font-normal opacity-75 mt-0.5">از صف خودش امضا می‌کند</span>
          </button>
        </div>
      )}

      {candidates.length === 0 && !selected ? (
        <p className="text-xs text-slate-500 bg-white rounded-lg border border-slate-200 px-3 py-2">
          کاربر فعالی با نقش تأییدکننده/مدیر/ادمین وجود ندارد که بشود برگه را به او ارجاع داد.
          ابتدا از صفحه «کاربران» یک تأییدکننده اضافه کنید.
        </p>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label={required ? 'امضاکننده‌ی این مرحله' : 'ارجاع به'}>
            <select className={inputCls} value={value || ''} onChange={e => onChange(e.target.value)}>
              <option value="">
                {required ? '— انتخاب کنید (الزامی) —' : '— بدون ارجاع (امضای ناظر خالی می‌ماند) —'}
              </option>
              {candidates.map(u => (
                <option key={u.id} value={u.id}>{u.name || u.username} ({ROLE_LABELS[u.role] || u.role})</option>
              ))}
            </select>
          </Field>
          <Field label="توضیح برای امضاکننده (اختیاری)">
            <input className={inputCls} value={note || ''} maxLength={200}
              onChange={e => onNoteChange(e.target.value)}
              placeholder="مثلاً: ناظر شیفت عصر، فردا صبح امضا کند" />
          </Field>
        </div>
      )}

      {/* «حضوری» = گرفتن امضا در همان فرم. پیش از این، این سوییچ فقط یک
          نشانه بود و پد امضا بعد از ثبت (مودال OnSiteSignModal) باز می‌شد؛
          حالا همان لحظه‌ای که «حضوری» زده می‌شود پد باز می‌شود و امضا تا ثبت
          نهایی داخل فرم نگه داشته می‌شود. */}
      {showModeSwitch && theMode === 'onsite' && (
        <div className="mb-3">
          {!filled ? (
            <p className="text-[11px] text-slate-500 bg-white rounded-lg border border-dashed border-slate-300 px-3 py-2">
              ابتدا «امضاکننده‌ی این مرحله» را انتخاب کنید؛ پد امضا به نام حساب کاربری همان فرد باز می‌شود.
            </p>
          ) : onsiteSig ? (
            <div className="rounded-xl border border-ok-300 bg-ok-50 p-3 flex flex-wrap items-center gap-2.5">
              <img src={onsiteSig.image} alt="امضای حضوری" className="h-12 w-24 object-contain bg-white rounded-lg border border-ok-200" />
              <div className="flex-1 min-w-0">
                <p className="text-xs font-bold text-ok-800">✅ امضای حضوری «{onsiteSig.name}» گرفته شد</p>
                <p className="text-[11px] text-ok-700 mt-0.5">همراه برگه ثبت می‌شود و این مرحله همان‌جا بسته می‌شود.</p>
              </div>
              <button type="button" onClick={() => onCaptureOnsite && onCaptureOnsite()}
                className="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg border border-ok-300 bg-white text-ok-800 hover:bg-ok-100">تغییر امضا</button>
              <button type="button" onClick={() => onClearOnsite && onClearOnsite()}
                className="shrink-0 text-[11px] px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-500 hover:text-danger-600">حذف</button>
            </div>
          ) : (
            <button type="button" onClick={() => onCaptureOnsite && onCaptureOnsite()}
              className="w-full rounded-xl border-2 border-dashed border-brand-300 hover:border-brand-500 bg-brand-50/40 px-3 py-3 text-xs text-brand-800">
              ✍️ گرفتن امضای حضوری «{onsiteName || 'این فرد'}» — پد امضا همین‌جا باز می‌شود
            </button>
          )}
        </div>
      )}

      {filled && selected && (
        <p className="text-xs text-slate-600 mt-2.5 bg-white rounded-lg border border-slate-200 px-3 py-2">
          <b>{selected.name || selected.username}</b> این مرحله را امضا می‌کند.
          {required && theMode === 'referral'
            ? ' برگه مستقیماً ارجاع می‌شود؛ تا امضا، وضعیتش «در انتظار امضا» می‌ماند.'
            : (onsiteSig
              ? ' امضایش همین‌جا گرفته شده و با ثبت برگه، این مرحله بسته می‌شود.'
              : ' اگر امضایش را همین‌جا نگیرید، بعد از ثبت پرسیده می‌شود و در غیر این صورت تا آن لحظه وضعیت برگه «در انتظار امضا» می‌ماند.')}
        </p>
      )}
    </div>
  );
}

/**
 * زنجیره‌ی امضای اجباری و ترتیبی — به همان شماری که چک‌لیست تعیین کرده.
 *
 * بازرس (مرحله ۱) همین‌جا امضا می‌کند؛ این جعبه گیرنده‌ی مرحله‌های بعدی را
 * می‌گیرد. `slots` شیارهای لازم است (مثلاً فقط ['approver'] برای چک‌لیست
 * دو امضا)؛ بدون آن، ترتیب کامل پیش‌فرض استفاده می‌شود. هر مرحله فرد متفاوتی
 * لازم دارد — لیست هر select، انتخابِ مرحله‌ی دیگر را از خودش حذف می‌کند تا
 * کاربر اصلاً نتواند یک نفر را دوبار بگذارد.
 */
function SignChainBox({ users, currentUser, selection, notes, onSelect, onNote, inspectorSigned, slots,
                        modes, onModeChange, onsiteSigs, onCaptureOnsite, onClearOnsite }) {
  const sel = selection || {};
  const theModes = modes || {};
  const theSigs = onsiteSigs || {};
  const theSlots = (Array.isArray(slots) && slots.length ? slots : SIGN_SLOT_SEQUENCE).filter(s => SIGN_SLOTS[s]);
  return (
    <div className="rounded-2xl border border-brand-500/30 bg-white p-4 space-y-3">
      <div>
        <h4 className="font-bold text-slate-800 text-sm">زنجیره‌ی امضا ({signerCountLabel(theSlots.length + 1)} — اجباری، به‌ترتیب)</h4>
        <p className="text-xs text-slate-500 mt-0.5">
          برگه پس از ثبت، به‌ترتیب به این افراد می‌رسد. برای هر مرحله انتخاب کنید «حضوری» (همان لحظه پد امضا باز
          می‌شود و امضایش را داخل همین فرم می‌گیرید) یا «ارجاعی» (مستقیم به صف امضای خودش برود). تا وقتی مرحله‌ی
          قبلی امضا نشده، نفر بعدی اجازه‌ی امضا ندارد.
        </p>
      </div>

      <div className={'rounded-xl border px-3 py-2.5 text-xs flex items-center gap-2 '
        + (inspectorSigned ? 'border-ok-300 bg-ok-50 text-ok-800' : 'border-slate-200 bg-slate-50 text-slate-500')}>
        <span>{inspectorSigned ? '✅' : '①'}</span>
        <span>مرحله ۱ — بازرس / اجراکننده (شما){inspectorSigned ? ' — امضا شد' : ' — هنوز امضا نشده'}</span>
      </div>

      {theSlots.map((slot, i) => (
        <SignReferralBox key={slot} slot={slot} required stepNo={i + 2}
          users={users} currentUser={currentUser}
          exclude={theSlots.filter(s => s !== slot).map(s => sel[s]).filter(Boolean)}
          value={sel[slot] || ''} note={(notes || {})[slot] || ''}
          mode={theModes[slot] || 'onsite'} onModeChange={onModeChange ? (m => onModeChange(slot, m)) : null}
          onsiteSig={theSigs[slot] || null}
          onCaptureOnsite={onCaptureOnsite ? (() => onCaptureOnsite(slot)) : null}
          onClearOnsite={onClearOnsite ? (() => onClearOnsite(slot)) : null}
          onChange={v => onSelect(slot, v)} onNoteChange={v => onNote(slot, v)} />
      ))}
    </div>
  );
}

/**
 * فرم سریع «زیرسیستم جدید» برای وقتی که چک‌لیست هنوز هیچ تجهیز ندارد —
 * تا کاربر برای افزودن اولین زیرسیستم مجبور نباشد صفحه را ترک کند.
 */
function QuickSubsystemForm({ template, onAdd }) {
  const [f, setF] = useState({ code: '', name: '', location: '' });
  const [err, setErr] = useState('');
  const submit = () => {
    const code = f.code.trim(), name = f.name.trim();
    if (!code || !name) { setErr('کد و نام زیرسیستم الزامی است.'); return; }
    onAdd({ code, name, location: f.location.trim() });
    setF({ code: '', name: '', location: '' });
    setErr('');
  };
  return (
    <div className="max-w-md mx-auto text-right space-y-2 bg-slate-50 border border-slate-200 rounded-2xl p-4">
      <p className="text-xs font-bold text-slate-700">افزودن اولین زیرسیستم به این چک‌لیست</p>
      <div className="grid grid-cols-1 gap-2">
        <input className={inputCls} placeholder="کد (مثل MC-01)" value={f.code} onChange={e => setF({ ...f, code: e.target.value })} />
        <input className={inputCls} placeholder="نام زیرسیستم" value={f.name} onChange={e => setF({ ...f, name: e.target.value })} />
        <input className={inputCls} placeholder="محل استقرار (اختیاری)" value={f.location} onChange={e => setF({ ...f, location: e.target.value })} />
      </div>
      {err && <p className="text-xs text-danger-600">{err}</p>}
      <button onClick={submit} className="w-full px-4 py-2.5 rounded-xl text-sm bg-brand-600 hover:bg-brand-700 text-white">+ افزودن زیرسیستم</button>
    </div>
  );
}

function RunnerPage({ assetId, assignmentId, onFinish }) {
  const { data, update, currentUser, notify, perms } = useAppData();
  // چک‌لیست و زیرسیستم‌هایش با هم گره خورده‌اند: اول «چک‌لیست» انتخاب می‌شود،
  // بعد فقط تجهیزاتی فهرست می‌شوند که زیرسیستمِ همین چک‌لیست‌اند. اگر صفحه
  // با تجهیز مشخصی باز شده باشد (اسکن بارکد یا اجرای وظیفه)، چک‌لیست از روی
  // همان تجهیز تعیین می‌شود.
  const entryAsset = assetId ? data.assets.find(a => a.id === assetId) : null;
  const activeTemplates = data.templates.filter(t => !t.archived);
  const [templateId, setTemplateId] = useState(
    (entryAsset && entryAsset.templateId) || (activeTemplates[0] && activeTemplates[0].id) || '');
  const assetsOfTemplate = data.assets.filter(a => a.templateId === templateId);
  const [selectedAssetId, setSelectedAssetId] = useState(
    (entryAsset && entryAsset.id) || (assetsOfTemplate[0] && assetsOfTemplate[0].id) || '');

  useEffect(() => {
    if (!assetId) return;
    const a = data.assets.find(x => x.id === assetId);
    if (!a) return;
    setTemplateId(a.templateId || '');
    setSelectedAssetId(a.id);
  }, [assetId]);
  // با عوض شدن چک‌لیست، اگر تجهیز انتخابی به آن تعلق ندارد، اولین زیرسیستمِ
  // همان چک‌لیست انتخاب می‌شود — هیچ‌وقت تجهیزِ چک‌لیست دیگری نشان داده نمی‌شود.
  // (وابستگی به تعداد تجهیزات: وقتی زیرسیستم تازه‌ای اضافه می‌شود و انتخابی
  // وجود ندارد، خودکار همان تازه وارد انتخاب شود.)
  useEffect(() => {
    if (!assetsOfTemplate.some(a => a.id === selectedAssetId)) {
      setSelectedAssetId(assetsOfTemplate[0] ? assetsOfTemplate[0].id : '');
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [templateId, data.assets.length]);

  const asset = data.assets.find(a => a.id === selectedAssetId);
  const template = data.templates.find(t => t.id === templateId) || null;
  // چند نفر باید امضا کنند؟ همان چیزی که موقع ساخت چک‌لیست تعیین شده.
  const signerCount = templateSignerCount(template, data.settings);
  const requiredSlots = signSlotsForCount(signerCount);

  const [answers, setAnswers] = useState({});
  const [dueDate, setDueDate] = useState('');
  const [notes, setNotes] = useState('');
  // پیوست عکس: فهرست {image, name, addedAt} — پیش از ذخیره فشرده می‌شود
  const [photos, setPhotos] = useState([]);
  const photoInputRef = useRef(null);
  // مشخصات بازرس همیشه از حساب کاربری واردِ‌شده خوانده می‌شود و قابل ویرایش
  // نیست؛ در غیر این صورت هر کاربری می‌توانست بازرسی را به نام کس دیگری ثبت
  // کند و انتساب سوابق (و مسئولیت حقوقی برگه) بی‌اعتبار شود.
  const inspectorName = ((currentUser && (currentUser.name || currentUser.username)) || '').trim();
  const [sigPad, setSigPad] = useState(null); // 'inspector' | null
  const [signatures, setSignatures] = useState({});
  const [submitting, setSubmitting] = useState(false);
  // گیرنده‌ی هر مرحله از زنجیره‌ی امضا (متناسب با تعداد امضای همین چک‌لیست)
  const [chainSel, setChainSel] = useState({});
  const [chainNotes, setChainNotes] = useState({});
  // حالت هر مرحله: 'onsite' (پیش‌فرض؛ همان لحظه پد امضا باز می‌شود و امضایش
  // داخل فرم گرفته می‌شود) یا 'referral' (مستقیم و بدون پرسش، به صف
  // «در انتظار امضا»ی خودش ارجاع شود).
  const [chainMode, setChainMode] = useState({});
  // امضاهای حضوریِ گرفته‌شده در خودِ فرم (پیش از ثبت) — کلید = شیار مرحله.
  // موقع «ثبت نهایی» به‌ترتیب زنجیره روی برگه اعمال می‌شوند.
  const [chainOnsiteSigs, setChainOnsiteSigs] = useState({});
  const [onsitePadSlot, setOnsitePadSlot] = useState(null);

  useEffect(() => {
    setAnswers({}); setSignatures({});
    setChainSel({}); setChainNotes({}); setChainMode({});
    setChainOnsiteSigs({}); setOnsitePadSlot(null);
    setPhotos([]);
  }, [templateId, selectedAssetId]);

  /**
   * «حضوری» باید همان لحظه پد امضا را باز کند. ولی امضا یک اظهار شخصی است و
   * به نام **حساب کاربریِ خودِ گیرنده** قفل می‌شود؛ پس پیش از باز کردن پد
   * بررسی می‌کنیم که مرحله گیرنده‌ی معتبر داشته باشد و نام حسابش خالی نباشد
   * (وگرنه پد با نام خالی باز می‌شد و دکمه‌ی «ثبت امضا» بی‌صدا غیرفعال می‌ماند).
   */
  const openOnsitePad = (slot) => {
    const chosen = chainSel[slot];
    if (!chosen) {
      notify('اول «امضاکننده‌ی این مرحله» را انتخاب کنید تا پد امضا به نام خودش باز شود.', 'error');
      return;
    }
    const u = (data.users || []).find(x => String(x.id) === String(chosen));
    if (!u) { notify('کاربر انتخاب‌شده پیدا نشد؛ دوباره انتخاب کنید.', 'error'); return; }
    if (u.active === false) {
      notify('کاربر «' + (u.name || u.username) + '» غیرفعال است و نمی‌تواند امضا کند.', 'error');
      return;
    }
    if (!resolveSignerName(u)) {
      notify('نام حساب کاربری «' + (u.username || '—') + '» خالی است؛ از ادمین بخواهید نامش را در صفحه «کاربران» کامل کند.', 'error');
      return;
    }
    setOnsitePadSlot(slot);
  };

  const clearOnsiteSig = (slot) => setChainOnsiteSigs(s => {
    if (!s || !s[slot]) return s;
    const n = Object.assign({}, s); delete n[slot]; return n;
  });

  const changeChainMode = (slot, m) => {
    setChainMode(s => Object.assign({}, s, { [slot]: m }));
    // «ارجاعی» یعنی امضا در دستگاه/صفِ خودِ گیرنده گرفته می‌شود؛ امضای حضوریِ
    // از پیش گرفته‌شده دیگر معنا ندارد و نباید بی‌صدا روی برگه بنشیند.
    if (m === 'referral') clearOnsiteSig(slot);
  };

  const changeChainSel = (slot, v) => {
    // امضا به یک فرد مشخص تعلق دارد؛ با عوض‌شدن گیرنده، امضای قبلی باطل می‌شود
    // (انتخاب دوباره‌ی همان فرد چیزی را پاک نمی‌کند).
    if (String(chainSel[slot] || '') !== String(v || '')) clearOnsiteSig(slot);
    setChainSel(s => Object.assign({}, s, { [slot]: v }));
  };

  // مشخصات پد امضای حضوری: نام از حساب کاربریِ گیرنده (قفل‌شده) و شماره‌ی
  // انسانی مرحله (مرحله‌ی ۱ خودِ بازرس است، پس +۲).
  const onsitePadUser = onsitePadSlot
    ? (data.users || []).find(u => String(u.id) === String(chainSel[onsitePadSlot]))
    : null;
  const onsitePadName = onsitePadUser ? resolveSignerName(onsitePadUser) : '';
  const onsitePadStepNo = onsitePadSlot ? (requiredSlots.indexOf(onsitePadSlot) + 2) : 0;

  // رفع ایراد ۲-۷: حتی اگر صفحه‌ی «اجرای بازرسی» به کاربر واگذار شده باشد،
  // نقش «مشاهده‌گر» اجازه‌ی ثبت بازرسی ندارد. (پیش از هر بازگشت زودهنگام،
  // چون هوک‌ها نباید شرطی شوند.)
  const canExecute = !!(perms && perms.canExecute);
  // باگ: در حالت «هنوز هیچ زیرسیستمی ثبت نشده» زیر همین کامپوننت به canManage
  // ارجاع داده می‌شد بدون آنکه اینجا تعریف شده باشد (ReferenceError در زمان
  // رندر). چون اپ ErrorBoundary نداشت، این خطا کل درخت React را سفید می‌کرد؛
  // با اضافه‌شدن ErrorBoundary زیر هم، این خط ریشه‌ی واقعی مشکل را می‌بندد.
  const canManage = !!(perms && perms.canManage);

  if (!canExecute) {
    return <NoAccess what="نقش شما اجازه‌ی اجرای بازرسی و ثبت سابقه را نمی‌دهد." />;
  }

  if (!template) {
    return <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400">
      ابتدا از صفحه «قالب‌های چک‌لیست» یک چک‌لیست بسازید.
    </div>;
  }

  if (!asset) {
    return <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400 space-y-3">
      <p>برای چک‌لیست «{template.name}» هنوز هیچ تجهیز/زیرسیستمی ثبت نشده است.</p>
      {canManage ? (
        <QuickSubsystemForm template={template} onAdd={(a) => {
          update(d => {
            d.assets.push({
              id: 'asset-' + Date.now(),
              code: a.code, name: a.name, location: a.location || '',
              serial: '', templateId: template.id, category: template.category || '',
            });
          });
          notify('زیرسیستم به چک‌لیست اضافه شد.', 'success');
        }} />
      ) : (
        <p className="text-xs">از مدیر بخواهید از صفحه «تجهیزات» یا «قالب‌های چک‌لیست» یک زیرسیستم به این چک‌لیست اضافه کند.</p>
      )}
    </div>;
  }

  const preview = scoreRecord(template, answers);

  // پیوست عکس: انتخاب از گالری/دوربین، فشرده‌سازی، و افزودن تا سقف مجاز
  const onPickPhotos = async (e) => {
    const files = Array.from((e.target && e.target.files) || []);
    if (e.target) e.target.value = '';
    if (!files.length) return;
    const room = MAX_PHOTOS_PER_RECORD - photos.length;
    if (files.length > room) {
      notify('حداکثر ' + toPersianDigits(MAX_PHOTOS_PER_RECORD) + ' عکس به هر سابقه قابل پیوست است.', 'error');
    }
    const picked = files.slice(0, Math.max(0, room));
    const added = [];
    for (const f of picked) {
      const image = await compressImageFile(f);
      if (image) added.push(makePhotoAttachment(image, f));
    }
    if (added.length) setPhotos(list => [...list, ...added]);
  };
  const removePhoto = (i) => setPhotos(list => list.filter((_, j) => j !== i));

  // چرا پیش از رندر حساب می‌شود: کاربر باید *قبل* از زدن دکمه بفهمد چه چیزی کم
  // است، نه اینکه دکمه را بزند و یک toast قرمز بگیرد.
  const blockReason = !inspectorName
    ? 'حساب کاربری شما نام کامل ندارد؛ از ادمین بخواهید نام شما را تکمیل کند.'
    : (!signatures.inspector
      ? 'امضای بازرس / اجراکننده ثبت نشده است.'
      : (requiredSlots.length ? validateSignChain(chainSel, data.users, currentUser, data.settings, requiredSlots) : null));

  const submit = () => {
    if (!inspectorName) {
      notify('حساب کاربری شما نام کامل ندارد. از ادمین بخواهید نام شما را در صفحه «کاربران» تکمیل کند.', 'error');
      return;
    }
    if (!signatures.inspector) { notify('امضای بازرس / اجراکننده الزامی است.', 'error'); return; }

    let signRequest = null;
    if (requiredSlots.length) {
      // زنجیره‌ی امضا به همان شماری که چک‌لیست تعیین کرده (۲ یا ۳ امضا).
      // همه‌ی مرحله‌ها باید تعیین شده باشند و افراد متفاوتی باشند.
      const chainErr = validateSignChain(chainSel, data.users, currentUser, data.settings, requiredSlots);
      if (chainErr) { notify(chainErr, 'error'); return; }
      signRequest = makeSignChain({
        steps: requiredSlots.map(slot => ({
          toUser: data.users.find(u => u.id === chainSel[slot]),
          slot: slot,
          note: chainNotes[slot] || '',
          skipOnsitePrompt: chainMode[slot] === 'referral',
        })),
        byUser: currentUser,
      });
      if (!signRequest || signRequest.steps.length !== requiredSlots.length) {
        notify('ساخت زنجیره‌ی امضا ناموفق بود؛ انتخاب‌های مرحله‌ها را بررسی کنید.', 'error');
        return;
      }
    }
    // چک‌لیستِ تک‌امضا: برگه همان‌جا با امضای بازرس کامل می‌شود و درخواستی ساخته نمی‌شود.
    setSubmitting(true);
    const result = scoreRecord(template, answers);
    const now = new Date();
    const record = {
      id: uid('rec'),
      assetId: asset.id,
      assetCode: asset.code,
      assetName: asset.name || '',
      assetTitle: asset.name || '',
      location: asset.location || '',
      templateId: template.id,
      templateName: template.name,
      category: template.category || '',
      inspectorId: (currentUser && currentUser.id) || '',
      inspectorName: inspectorName,
      signRequest,
      date: nowJalaliDateTime(),
      dateJalali: gregorianToJalaliStr(now),
      startedAt: now.toISOString(),
      completedAt: now.toISOString(),
      dueDate,
      answers,
      details: result.details,
      percent: result.percent,
      status: result.status,
      criticalFail: !!result.criticalFail,
      score: Math.round(result.earned || 0),
      maxScore: result.totalWeight || 0,
      notes,
      signatures,
      photos: photos.slice(),
      // برای چاپ/گزارش: چند امضا برای این برگه تعریف شده بود (فقط نمایشی؛
      // مرجع اصلی، زنجیره‌ی امضای خودِ برگه است).
      signerCount,
      assignmentId: assignmentId || null,
      createdAt: now.getTime(),
      updatedAt: now.getTime(),
    };

    // «حضوری» در خودِ فرم: امضاهایی که پیش از ثبت، کنار دستگاه گرفته شده‌اند
    // همان‌جا روی برگه می‌نشینند. `applyOnsiteSignatureToRecord` فقط **مرحله‌ی
    // فعال** را جلو می‌برد، پس پیمایش به ترتیب `requiredSlots` (= ترتیب شیارها
    // در زنجیره) کافی است و ترتیب امضاها دست‌نخورده می‌ماند. امضای مرحله‌ای که
    // نوبتش نرسیده نادیده گرفته می‌شود (نه این‌که بی‌صدا روی برگه بنشیند).
    let finalRecord = record;
    let onsiteApplied = 0;
    if (signRequest) {
      requiredSlots.forEach(slot => {
        const sig = chainOnsiteSigs[slot];
        if (!sig || !sig.image) return;
        const u = (data.users || []).find(x => String(x.id) === String(chainSel[slot]));
        if (!u) return;
        const act = activeSignStep(normalizeSignRequest(finalRecord.signRequest));
        if (!act || String(act.toUserId) !== String(u.id)) return;
        const next = applyOnsiteSignatureToRecord(finalRecord, sig, u, currentUser, now.getTime());
        if (next) { finalRecord = next; onsiteApplied += 1; }
      });
    }

    update(d => {
      d.records.unshift(finalRecord);
      // اقدام اصلاحی خودکار: بازرسی «ناموفق (حیاتی)» بی‌پاسخ نمی‌ماند؛ همان لحظه
      // یک دستورکار باز می‌شود و در صفحه‌ی «اقدام اصلاحی» تا رفع مشکل پیگیری می‌شود.
      if (result.criticalFail) {
        d.correctives.unshift({
          id: uid('cor'),
          recordId: finalRecord.id,
          assetId: asset.id, assetCode: asset.code,
          templateName: template.name,
          reason: 'بازرسی ناموفق (حیاتی) — ' + (result.details.filter(x => x.critical && (x.earned === null || x.earned === 0)).map(x => x.label).join('؛ ') || 'رد آیتم حیاتی'),
          assignedToUserId: '', assignedToName: '',
          status: 'open', note: '',
          openedAt: now.getTime(), closedAt: null,
          createdBy: (currentUser && currentUser.id) || '',
          createdAt: now.getTime(), updatedAt: now.getTime(),
        });
      }
      if (assignmentId) {
        const idx = d.assignments.findIndex(a => a.id === assignmentId);
        if (idx > -1) {
          d.assignments[idx].status = 'done';
          d.assignments[idx].recordId = finalRecord.id;
          d.assignments[idx].completedAt = now.toISOString();
          d.assignments[idx].updatedAt = now.getTime();
        }
      }
    });
    // پیام موفقیت از روی **وضعیت نهاییِ زنجیره** ساخته می‌شود، نه زنجیره‌ی اولیه؛
    // وگرنه بعد از امضای حضوریِ درون‌فرمی، نام کسی «نوبت فعلی» اعلام می‌شد که
    // همان لحظه امضا کرده بود.
    const srDone = normalizeSignRequest(finalRecord.signRequest);
    const stepLeft = srDone ? activeSignStep(srDone) : null;
    const onsiteNote = onsiteApplied
      ? ' و ' + toPersianDigits(onsiteApplied) + ' امضای حضوری هم ثبت شد'
      : '';
    notify(!signRequest
      ? 'بازرسی ثبت شد؛ فقط امضای بازرس لازم بود و برگه کامل است.'
      : (stepLeft
        ? `بازرسی ثبت شد${onsiteNote}. اکنون نوبت «${stepLeft.toUserName || 'امضاکننده‌ی بعدی'}» است.`
        : `بازرسی ثبت شد${onsiteNote} و همه‌ی امضاها (${signerCountLabel(signerCount)}) کامل شد.`), 'success');

    // ساخت و ارسال PDF به Drive؛ کاملاً مستقل از همگام‌سازی پایگاه است، بنابراین
    // شکست آن هرگز باعث از دست رفتن سابقه نمی‌شود.
    const cfg = resolveCloudConfig(data.settings);
    if (cfg.url && cfg.apiKey) {
      // رفع کندی: بعد از ثبت، PDF با موتور سرور ساخته می‌شود نه روی گوشی؛
      // پیام موفقیت هم بعد از رسیدن پاسخ درایو می‌آید.
      // ⚠️ finalRecord (نه record): امضاهای حضوریِ درون‌فرمی باید همین‌جا روی
      // PDF بروند، وگرنه برگه‌ی درایو بی‌امضا می‌ماند و بعداً با PDF دیگری
      // جایگزین می‌شود.
      sendRecordToAppsScript(cfg.url, cfg.apiKey, finalRecord, data.settings, notify, { serverOnly: true })
        .then(json => {
          if (json && json.pdfUrl) {
            update(d => {
              const i = d.records.findIndex(r => r.id === finalRecord.id);
              if (i > -1) d.records[i].pdfUrl = json.pdfUrl;
            });
          }
        })
        .catch(e => notify('سابقه ثبت شد، اما ساخت PDF در درایو ناموفق بود: ' + e.message, 'error'));
    }
    setSubmitting(false);
    if (onFinish) onFinish(finalRecord);
  };

  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <Field label="۱. چک‌لیست" hint={template ? signerCountLabel(signerCount) : undefined}>
            <select className={inputCls} value={templateId} onChange={e => setTemplateId(e.target.value)}>
              {activeTemplates.map(t => (
                <option key={t.id} value={t.id}>{t.name} ({signerCountLabel(templateSignerCount(t, data.settings))})</option>
              ))}
            </select>
          </Field>
          <Field label="۲. تجهیز / زیرسیستم" hint="فقط زیرسیستم‌های همین چک‌لیست فهرست می‌شوند.">
            <select className={inputCls} value={selectedAssetId} onChange={e => setSelectedAssetId(e.target.value)}>
              {assetsOfTemplate.map(a => <option key={a.id} value={a.id}>{a.code} — {a.name}</option>)}
            </select>
          </Field>
          <Field label="دوره‌ی این چک‌لیست"
            hint="پس از ثبت، این تجهیز تا پایان دوره از فهرست «باقی‌مانده» خارج می‌شود.">
            <input disabled className={inputCls + " bg-slate-50 text-slate-400"}
              value={(PERIOD_LABELS[resolveTemplatePeriod(template)] || '') + ' — ' + (periodWindowLabel(resolveTemplatePeriod(template), new Date()) || '')} />
          </Field>
          <Field label="مهلت انجام (تاریخ شمسی)">
            <PersianDatePicker value={dueDate} onChange={setDueDate} />
          </Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
          <Field label="نام بازرس / اجراکننده" hint="از حساب کاربری شما خوانده می‌شود و قابل تغییر نیست.">
            <input disabled readOnly className={inputCls + " bg-slate-50 text-slate-500 cursor-not-allowed"}
              value={inspectorName || '— نام حساب شما خالی است —'} />
          </Field>
          <Field label="کد و محل تجهیز"><input disabled className={inputCls + " bg-slate-50 text-slate-400"} value={`${asset.code} · ${asset.location || '—'}`} /></Field>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
        <h3 className="font-bold text-slate-800">آیتم‌های بازرسی</h3>
        {template.items.map(item => (
          <div key={item.id} className="border-b border-slate-100 pb-4 last:border-0 last:pb-0">
            <div className="flex items-start justify-between mb-2">
              <p className="text-sm font-medium text-slate-700">{item.label}
                {item.critical && <span className="text-danger-500 mr-1.5 text-xs">(حیاتی)</span>}
              </p>
              {item.weight > 0 && <span className="text-xs text-slate-400 shrink-0">وزن {toPersianDigits(item.weight)}</span>}
            </div>
            <ChecklistItemInput item={item} value={answers[item.id]} onChange={v => setAnswers(a => ({ ...a, [item.id]: v }))} />
          </div>
        ))}
        <Field label="یادداشت‌های تکمیلی بازرسی"><textarea className={inputCls} rows={2} value={notes} onChange={e => setNotes(e.target.value)} /></Field>

        <div className="border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-2.5">
          <div className="flex items-center justify-between">
            <p className="text-sm font-medium text-slate-700">📷 عکس‌های بازرسی <span className="text-xs text-slate-400 font-normal">(مدرک کار — تا {toPersianDigits(MAX_PHOTOS_PER_RECORD)} عکس، خودکار فشرده می‌شود)</span></p>
            <button type="button" onClick={() => photoInputRef.current && photoInputRef.current.click()}
              disabled={photos.length >= MAX_PHOTOS_PER_RECORD}
              className="text-xs bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white rounded-lg px-3 py-1.5">
              + افزودن عکس
            </button>
            <input ref={photoInputRef} type="file" accept="image/*" multiple className="hidden" onChange={onPickPhotos} />
          </div>
          {photos.length === 0 ? (
            <p className="text-xs text-slate-400">هنوز عکسی پیوست نشده است. عکس‌ها همراه سابقه ذخیره، همگام و در گزارش چاپ می‌شوند.</p>
          ) : (
            <div className="flex flex-wrap gap-2">
              {photos.map((ph, i) => (
                <div key={i} className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-200 bg-white">
                  <img src={ph.image} alt={ph.name || ('عکس ' + toPersianDigits(i + 1))} className="w-full h-full object-cover" />
                  <button type="button" onClick={() => removePhoto(i)}
                    className="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-slate-900/70 text-white text-[10px] leading-none flex items-center justify-center">✕</button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-center gap-4">
        <div>
          <span className="text-xs text-slate-400">امتیاز لحظه‌ای:</span>
          <span className="text-lg font-bold text-slate-800 mx-1.5">{toPersianDigits(preview.percent)}٪</span>
          <StatusBadge status={preview.status} />
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4 grid grid-cols-1 gap-3">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <h3 className="font-bold text-slate-800 text-sm">امضاها — {signerCountLabel(signerCount)}</h3>
          {requiredSlots.length > 0 && (
            <p className="text-[11px] text-slate-400">امضای مرحله‌های بعد را می‌توانید همین‌جا «حضوری» بگیرید (با زدن «حضوری» پد امضا باز می‌شود) یا «ارجاعی» به صف خودشان بفرستید.</p>
          )}
        </div>
        <button onClick={() => setSigPad('inspector')}
          className={"rounded-xl border-2 border-dashed p-4 text-sm text-center " + (signatures.inspector ? "border-ok-500 bg-ok-50" : "border-slate-300 hover:border-brand-400")}>
          {signatures.inspector ? (
            <div>
              <img src={signatures.inspector.image} className="h-14 mx-auto object-contain" />
              <p className="text-xs text-ok-700 mt-1">امضای بازرس ثبت شد — {signatures.inspector.name}</p>
            </div>
          ) : '✍️ ثبت امضای بازرس / اجراکننده' + (requiredSlots.length ? ' (مرحله ۱ — الزامی)' : ' (امضا در محل — الزامی)')}
        </button>
        {/* امضای ناظر/تأییدکننده در بخش «زنجیره‌ی امضا» (پایین) گرفته می‌شود،
            نه این‌جا: هویت امضاکننده باید از حساب کاربری **خودِ گیرنده** بیاید
            (پد امضا با نام او قفل است) و نشانِ «امضا در محل» + نام دریافت‌کننده‌ی
            دستگاه هم برای ممیزی ثبت می‌شود. */}
      </div>

      {requiredSlots.length > 0 ? (
        <SignChainBox users={data.users} currentUser={currentUser}
          slots={requiredSlots}
          selection={chainSel} notes={chainNotes} modes={chainMode}
          onsiteSigs={chainOnsiteSigs}
          inspectorSigned={!!signatures.inspector}
          onSelect={changeChainSel}
          onNote={(slot, v) => setChainNotes(s => Object.assign({}, s, { [slot]: v }))}
          onModeChange={changeChainMode}
          onCaptureOnsite={openOnsitePad}
          onClearOnsite={clearOnsiteSig} />
      ) : (
        <div className="rounded-2xl border border-ok-300 bg-ok-50 p-4 text-xs text-ok-800 leading-6">
          ✅ این چک‌لیست فقط <b>یک امضا</b> لازم دارد: امضای بازرس که همین‌جا، در محل گرفته می‌شود.
          پس از ثبت، برگه کامل است و به صف امضا نمی‌رود. (تعداد امضاها در «قالب‌های چک‌لیست» قابل تغییر است.)
        </div>
      )}

      <div className="flex flex-wrap items-center justify-end gap-3">
        {blockReason && <span className="text-xs text-danger-600">{blockReason}</span>}
        <button onClick={submit} disabled={submitting || !!blockReason} title={blockReason || ''}
          className="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-medium">
          ثبت نهایی بازرسی
        </button>
      </div>

      <SignaturePad open={!!sigPad} onClose={() => setSigPad(null)}
        roleLabel="بازرس / اجراکننده (امضا در محل)"
        initialName={inspectorName}
        lockName
        onSave={(sig) => setSignatures(s => ({ ...s, inspector: sig }))} />

      {/* پد امضای «حضوری» برای مرحله‌های زنجیره — همان لحظه که دکمه‌ی «حضوری»
          زده می‌شود باز می‌شود. نام از حساب کاربریِ خودِ گیرنده خوانده و قفل
          می‌شود؛ امضا تا «ثبت نهایی» در state فرم نگه داشته می‌شود و همان‌جا
          با applyOnsiteSignatureToRecord روی برگه می‌نشیند. */}
      <SignaturePad open={!!onsitePadSlot} onClose={() => setOnsitePadSlot(null)}
        roleLabel={onsitePadSlot
          ? 'امضای حضوری — ' + signSlotLabel(onsitePadSlot)
            + (onsitePadStepNo ? ' (مرحله ' + toPersianDigits(onsitePadStepNo) + ')' : '')
          : 'امضای حضوری'}
        initialName={onsitePadName}
        lockName
        onSave={(sig) => {
          const slot = onsitePadSlot;
          if (!slot) return;
          setChainOnsiteSigs(s => Object.assign({}, s, { [slot]: sig }));
          notify('امضای حضوری «' + (sig.name || '') + '» گرفته شد؛ همراه برگه ثبت می‌شود.', 'success');
        }} />
    </div>
  );
}

/* ============================================================
   ۱۴. موتور خروجی‌ها (چاپ تکی/پشت‌سرهم/تجمیعی، اکسل، CSV)
   ============================================================ */
/**
 * کادرهای امضای برگه — یکی برای بازرس و یکی برای هر مرحله‌ی زنجیره.
 *
 * چرا داینامیک: در مدل ب تعداد امضاها ۳ است، ولی رکوردهای قدیمی (نسخه ۸.۲)
 * فقط ۲ شیار دارند. اگر سه کادر ثابت می‌گذاشتیم، برگه‌های قدیمی همیشه یک
 * کادر «ثبت نشده»ی بی‌معنی چاپ می‌کردند.
 */
function renderSignatureBoxes(rec) {
  const sigs = (rec && rec.signatures) || {};
  const sr = normalizeSignRequest(rec && rec.signRequest);
  // ⚠️ مقادیر حتماً از escapeHtml عبور می‌کنند: نام امضاکننده و عنوان امضا
  // داده‌ی کاربر هستند و نباید نشانه‌گذاری تزریق کنند.
  const esc = escapeHtml;
  const box = (title, sig, emptyHtml) => {
    const body = (sig && sig.image)
      ? `<img src="${esc(sig.image)}" /><div class="sig-name">${esc(sig.name)}${sig.title ? ' — ' + esc(sig.title) : ''}</div>${sig.onsite ? `<div class="sig-onsite">✍️ امضا در محل${sig.onsiteCollectorName ? ' — دریافت توسط: ' + esc(sig.onsiteCollectorName) : ''}</div>` : ''}`
      : emptyHtml;
    return `<div class="sig-box"><div class="sig-title">${esc(title)}</div>${body}</div>`;
  };

  const parts = [box(SIGN_CHAIN_LABELS[0], sigs.inspector, '<div class="sig-empty">ثبت نشده</div>')];

  // شیارهایی که باید چاپ شوند: هرچه در زنجیره هست + هرچه قبلاً امضا شده
  const slots = [];
  if (sr) sr.steps.forEach(st => { if (slots.indexOf(st.slot) < 0) slots.push(st.slot); });
  SIGN_SLOT_SEQUENCE.forEach(k => { if (sigs[k] && slots.indexOf(k) < 0) slots.push(k); });
  // برگه‌های قدیمی بدون زنجیره، کادر خالی ناظر می‌گرفتند؛ برگه‌های تازه‌ی
  // تک‌امضا (signerCount === 1) نه — چون اصلاً امضای دومی برایشان تعریف نشده.
  if (!slots.length && Number(rec.signerCount) !== 1) slots.push('approver');
  slots.sort((a, b) => SIGN_SLOT_SEQUENCE.indexOf(a) - SIGN_SLOT_SEQUENCE.indexOf(b));

  slots.forEach(slot => {
    const step = sr ? sr.steps.find(st => st.slot === slot) : null;
    let empty = '<div class="sig-empty">ثبت نشده</div>';
    if (step && step.status === SIGN_REQUEST_STATUS.PENDING) {
      empty = `<div class="sig-empty">در انتظار امضای ${esc(step.toUserName || '—')}</div>`;
    } else if (step && step.status === SIGN_REQUEST_STATUS.CANCELLED) {
      empty = '<div class="sig-empty">درخواست لغو شد</div>';
    }
    parts.push(box('امضای ' + signSlotLabel(slot), sigs[slot], empty));
  });
  return parts.join('');
}

      </table>
      <table class="results">
        <thead><tr><th>عنوان آیتم</th><th>پاسخ</th><th>امتیاز</th><th>حیاتی</th></tr></thead>

function openReportWindow(bodyHtml, title, notify) {
  let w = null;

  if (!w) {

  w.document.close();

}

function exportRecordsCsv(records) {
  const header = ['کد تجهیز', 'قالب چک‌لیست', 'بازرس', 'تاریخ ثبت', 'مهلت انجام', 'درصد موفقیت', 'وضعیت'];
  const lines = [header.join(',')];
  records.forEach(r => {
    lines.push([r.assetCode, r.templateName, r.inspectorName, r.date, r.dueDate || '', r.percent, r.status]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n'); // BOM برای نمایش صحیح فارسی
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadDataUrl(URL.createObjectURL(blob), `سوابق-بازرسی-${Date.now()}.csv`);
}

/* ============================================================
   ۱۵-ب‌. خروجی‌های فیلترشده: PDF پشت‌سرهم + گزارش عدم انطباق‌ها
   ============================================================ */
/** برگه‌ی ناموفق (عادی یا حیاتی) = عدم انطباق */
function isNonconformingRecord(r) {
  if (!r) return false;
  return !!r.criticalFail || r.status === 'ناموفق' || r.status === 'ناموفق (حیاتی)';
}

/** نام فایل PDF خروجی با تاریخ شمسی امروز و تعداد برگه */
function rangedPdfFileName(prefix, count) {
  const j = (gregorianToJalaliStr(new Date()) || '').replace(/\//g, '-');
  return prefix + '-' + j + '-' + count + '.pdf';
}

/**
 * «PDF پشت‌سرهم»: همان رندرِ چاپ پشت‌سرهم (هر برگه پشت هم در یک سند A4)،
 * این‌بار به‌صورت **فایل PDF دانلودشددنی** — با همان موتور html2pdf که برای
 * PDF گوگل‌درایو استفاده می‌شود، پس خروجی دقیقاً شبیه برگه‌ی چاپی است.
 */
async function downloadSequentialPdf(records, org, notify) {
  if (!Array.isArray(records) || !records.length) return false;
  const bodyHtml = records.map(r => recordReportHtml(r, org)).join('');
  const b64 = await htmlToPdfBase64(bodyHtml, REPORT_STYLE);
  if (!b64) {
    if (notify) notify('ساخت PDF ممکن نشد (کتابخانه در دسترس نیست). از دکمه‌ی «چاپ پشت‌سرهم» استفاده کنید.', 'error');
    return false;
  }
  downloadBase64Pdf(b64, rangedPdfFileName('گزارش-پشت‌سرهم', records.length));
  if (notify) notify('PDF پشت‌سرهم (' + toPersianDigits(records.length) + ' برگه) دانلود شد.', 'success');
  return true;
}

/* استایل مخصوص بخش‌های گزارش عدم انطباق (علاوه بر REPORT_STYLE) */

/**
