 * برگه، فهرست آیتم‌های مغایر (نمره‌ی صفر)، یادداشت و در پایان خلاصه‌ی آماری
 * و محل امضای تأیید مدیر. ورودی فقط برگه‌های عدم انطباق است.
 */
function nonconformityReportHtml(ncRecords, org, rangeLabel) {
  const esc = escapeHtml;
  const total = ncRecords.length;
  const critical = ncRecords.filter(r => !!r.criticalFail || r.status === 'ناموفق (حیاتی)').length;
  const sections = ncRecords.map(r => {
    const failed = (r.details || []).filter(d => d && d.max > 0 && Number(d.earned) === 0);
    const rows = failed.map(d => `
      <tr>
        <td>${esc(d.label)}</td>
        <td>${d.value === false ? 'تأیید نشد' : esc(String(d.value === undefined || d.value === null || d.value === '' ? '—' : d.value))}</td>
        <td>${d.critical ? '<b class="nc-bad">بله</b>' : 'خیر'}</td>
      </tr>`).join('');
    return `
      <div class="nc-sec">
        <h3>${esc(r.assetCode)} — ${esc(r.assetTitle || r.assetName || '')}</h3>
        <table class="meta">
          <tr><td>قالب</td><td>${esc(r.templateName)}</td><td>بازرس</td><td>${esc(r.inspectorName)}</td></tr>
          <tr><td>تاریخ</td><td>${esc(toPersianDigits(r.date || gregorianToJalaliStr(r.completedAt)))}</td><td>نتیجه</td><td><b class="nc-bad">${esc(r.status)} (${toPersianDigits(r.percent)}٪)</b></td></tr>
        </table>
        ${rows
          ? `<table class="results"><thead><tr><th>آیتم مغایر</th><th>پاسخ</th><th>حیاتی</th></tr></thead><tbody>${rows}</tbody></table>`
          : '<div class="notes">ریز آیتم‌ها برای این برگه در دسترس نیست؛ وضعیت کلی برگه ناموفق است.</div>'}
        ${r.notes ? `<div class="notes"><b>یادداشت:</b> ${esc(r.notes)}</div>` : ''}
      </div>`;
  }).join('');
  return `
    <div class="report">
      <div class="hdr">
        ${org.logoDataUrl ? `<img src="${esc(org.logoDataUrl)}" class="logo" />` : ''}
        <div class="hdr-text"><div class="org-name">${esc(org.orgName || '')}</div><div class="sub">گزارش عدم انطباق‌های بازرسی</div></div>
      </div>
      <table class="meta">
        <tr><td>بازه / فیلتر</td><td>${esc(rangeLabel || 'همه')}</td><td>تاریخ تهیه</td><td>${esc(toPersianDigits(gregorianToJalaliStr(new Date())))}</td></tr>
      </table>
      <div class="summary">
        <div>تعداد عدم انطباق: <b>${toPersianDigits(total)}</b></div>
        <div>ناموفق حیاتی: <b>${toPersianDigits(critical)}</b></div>
        <div>ناموفق عادی: <b>${toPersianDigits(total - critical)}</b></div>
      </div>
      ${sections || '<div class="notes">موردی یافت نشد.</div>'}
      <table class="meta" style="margin-top:18px"><tr><td>تأیید مدیر</td><td style="height:52px"></td><td>تاریخ</td><td></td></tr></table>
    </div>`;
}

/** ساخت و دانلود PDF گزارش عدم انطباق‌ها */
async function downloadNonconformityPdf(ncRecords, org, rangeLabel, notify) {
  if (!Array.isArray(ncRecords) || !ncRecords.length) {
    if (notify) notify('در این مجموعه عدم انطباقی وجود ندارد.', 'error');
    return false;
  }
  const bodyHtml = nonconformityReportHtml(ncRecords, org, rangeLabel);
  const b64 = await htmlToPdfBase64(bodyHtml, REPORT_STYLE + NC_STYLE);
  if (!b64) {
    if (notify) notify('ساخت PDF ممکن نشد (کتابخانه در دسترس نیست).', 'error');
    return false;
  }
  downloadBase64Pdf(b64, rangedPdfFileName('گزارش-عدم-انطباق', ncRecords.length));
  if (notify) notify('گزارش عدم انطباق‌ها (' + toPersianDigits(ncRecords.length) + ' مورد) دانلود شد.', 'success');
  return true;
}

/* ============================================================
   ۱۵-الف. صفحه «در انتظار امضا» (صف ارجاعات امضا)
   ============================================================ */
/**
 * نوار پیشرفت زنجیره‌ی امضا — همان چیزی که کاربر در نگاه اول باید بفهمد:
 * «توپ الان زمین کیست؟». مرحله‌ی ۱ همیشه امضای بازرس است.
 */
function SignChainTrack({ rec, compact }) {
  const p = signChainProgress(rec);
  if (!p.sr) return null;
  const inspector = (rec.signatures && rec.signatures.inspector) || null;
  const nodes = [{
    key: 'inspector',
    label: SIGN_CHAIN_LABELS[0],
    who: (inspector && inspector.name) || rec.inspectorName || '—',
    state: inspector ? 'signed' : 'pending',
  }].concat(p.sr.steps.map((s, i) => ({
    key: s.slot,
    label: signSlotLabel(s.slot),
    who: s.status === SIGN_REQUEST_STATUS.SIGNED ? (s.signedByUserName || s.toUserName) : (s.toUserName || '—'),
    state: s.status === SIGN_REQUEST_STATUS.SIGNED ? 'signed'
      : (s.status === SIGN_REQUEST_STATUS.CANCELLED ? 'cancelled'
        : (i === p.stepIndex ? 'active' : 'waiting')),
    substitute: s.status === SIGN_REQUEST_STATUS.SIGNED && s.signedByUserId && s.signedByUserId !== s.toUserId,
    referral: s.referredFrom ? (s.referredFrom.userName || '—') : null,
    onsite: !!s.onsite,
    onsiteCollector: s.onsiteCollectorName || null,
  })));

  const tone = {
    signed: 'border-ok-300 bg-ok-50 text-ok-800',
    active: 'border-brand-500 bg-brand-50 text-brand-800 ring-1 ring-brand-500/30',
    waiting: 'border-slate-200 bg-slate-50 text-slate-500',
    cancelled: 'border-slate-200 bg-slate-100 text-slate-400 line-through',
    pending: 'border-warn-300 bg-warn-50 text-warn-800',
  };
  const mark = { signed: '✓', active: '✍️', waiting: '⋯', cancelled: '✕', pending: '!' };

  // تعداد گره‌ها بسته به تعداد امضای چک‌لیست ۲ یا ۳ تاست؛ ستون‌ها هم همان‌قدر.
  const cols = nodes.length >= 3 ? 'sm:grid-cols-3' : 'sm:grid-cols-2';
  return (
    <div className={'grid grid-cols-1 gap-2 ' + cols + ' ' + (compact ? 'mt-2' : 'mt-3')}>
      {nodes.map((n, i) => (
        <div key={n.key} className={'rounded-xl border px-3 py-2 text-[11px] ' + (tone[n.state] || tone.waiting)}>
          <div className="flex items-center gap-1.5">
            <span>{mark[n.state] || '⋯'}</span>
            <span className="font-medium">مرحله {toPersianDigits(i + 1)} — {n.label}</span>
          </div>
          <div className="mt-0.5 truncate">{n.who}{n.substitute ? ' (جانشین)' : ''}</div>
          {n.referral && (
            <div className="mt-0.5 text-[10px] opacity-80">↪ ارجاع از {n.referral}</div>
          )}
          {n.onsite && (
            <div className="mt-0.5 text-[10px] opacity-80">✍️ امضا در محل{n.onsiteCollector ? ' — دریافت: ' + n.onsiteCollector : ''}</div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   ۱۵-ب. مودال «امضای حضوری در محل»
   ============================================================ */
/**
 * «تورِ امنِ» امضای حضوری — مسیر اصلی گرفتن امضای حضوری حالا خودِ فرم است:
 * با زدن دکمه‌ی «حضوری» در زنجیره‌ی امضا، پد امضا همان لحظه باز می‌شود و امضا
 * همراه برگه ثبت می‌شود. این مودال فقط برای مرحله‌هایی باز می‌ماند که «حضوری»
 * انتخاب شده ولی پدشان بسته شده/امضا گرفته نشده — بلافاصله پس از ثبت می‌پرسد:
 * گیرنده‌ی مرحله‌ی بعد (مثلاً راننده/ناظر) الان کنار شماست؟
 *  - بله → دستگاه را دست او می‌دهند، پد امضا با نام خودش باز می‌شود و مرحله
 *    همان‌جا بسته می‌شود (applyOnsiteSignatureToRecord) — بدون ارجاع.
 *  - نه → هیچ کاری انجام نمی‌شود؛ برگه طبق روال عادی به صف «در انتظار امضا»ی
 *    او می‌رود (یا با دکمه‌ی ارجاع به فرد دیگری).
 * ترتیب زنجیره حفظ می‌شود: هر بار فقط گیرنده‌ی مرحله‌ی فعال پرسیده می‌شود.
 *
 * ⚠️ زنجیره‌ای/cascading (رفع محدودیت «فقط یک مرحله»): قبلاً بعد از هر امضای
 * حضوریِ موفق، مودال بی‌قیدوشرط بسته می‌شد (onClose) — حتی اگر نفرِ مرحله‌ی
 * بعدی هم همان لحظه کنارِ دستگاه ایستاده باشد (مثلاً بعد از امضای مرحله‌ی ۲
 * توسط ناظر، امضاکننده‌ی مرحله‌ی ۳ هم همان‌جا حاضر است). نتیجه این بود که
 * کاربر برای مرحله‌ی بعد باید می‌رفت صفحه‌ی «در انتظار امضا» را پیدا می‌کرد،
 * در حالی که می‌شد همان‌جا ادامه داد.
 * حالا `doOnsite` فقط وقتی onClose را صدا می‌زند که یا امضا شکست بخورد، یا
 * دیگر مرحله‌ی فعالی نمانده باشد (زنجیره کامل شده). در غیر این صورت فقط پد
 * امضا بسته می‌شود (`padOpen=false`) و چون `step`/`toName`/`stepNo` همه از
 * `live` (رکورد تازه از data.records) در بدنه‌ی تابع دوباره محاسبه می‌شوند،
 * رندر بعدی خودکار همان سؤال «آیا X کنارتان است؟» را برای مرحله‌ی جدید
 * نشان می‌دهد — بدون این‌که کامپوننت را دوباره باز کنیم.
 */
function OnSiteSignModal({ rec, onClose }) {
  const { data, update, currentUser, notify, ensureRecordVisuals } = useAppData();
  const [padOpen, setPadOpen] = useState(false);
  // همیشه از داده‌ی زنده بخوان؛ ممکن است در همین فاصله برگه عوض شده باشد
  const live = rec ? ((data.records || []).find(r => r.id === rec.id) || rec) : null;
  const sr = live ? normalizeSignRequest(live.signRequest) : null;
  const step = sr ? activeSignStep(sr) : null;

  // این مرحله از ابتدا «ارجاعی» تعیین شده (نه «حضوری») — چیزی پرسیده نمی‌شود؛
  // برگه بی‌صدا در صف «در انتظار امضا»ی گیرنده می‌ماند. (hook همیشه صدا زده
  // می‌شود تا ترتیب هوک‌ها ثابت بماند؛ خودِ شرط داخل بدنه‌اش است.)
  useEffect(() => {
    if (step && step.skipOnsitePrompt) onClose();
  }, [step && step.skipOnsitePrompt, step && step.toUserId]);

  if (!rec || !step) return null; // زنجیره در فاصله‌ی کوتاه امضا/لغو شده → چیزی نپرس
  if (step.skipOnsitePrompt) return null;
  const toUser = (data.users || []).find(u => String(u.id) === String(step.toUserId));
  const toName = (toUser && resolveSignerName(toUser)) || step.toUserName || '—';
  const stepNo = sr.current + 2; // +۱ امضای بازرس، +۱ برای شماره‌ی انسانی

  const doOnsite = (sig) => {
    let ok = false, nextRec = null, nextStep = null;
    update(d => {
      const i = d.records.findIndex(r => r.id === rec.id);
      if (i < 0) return;
      const act = activeSignStep(normalizeSignRequest(d.records[i].signRequest));
      // بازبینی مجوز در لحظه‌ی نوشتن: ممکن است در فاصله‌ی باز شدن پد، مرحله در
      // دستگاه دیگری امضا/لغو/ارجاع شده باشد.
      if (!act || String(act.toUserId) !== String(step.toUserId)) return;
      const u = (d.users || []).find(x => String(x.id) === String(act.toUserId));
      if (!u) return;
      const next = applyOnsiteSignatureToRecord(d.records[i], sig, u, currentUser);
      if (next) { d.records[i] = next; ok = true; nextRec = next; nextStep = activeSignStep(next.signRequest); }
    });
    if (!ok) { notify('امضای حضوری ثبت نشد؛ وضعیت برگه تغییر کرده است.', 'error'); onClose(); return; }
    // اگر مرحله‌ی بعدی هنوز باقی مانده، به‌جای بستنِ مودال، همان سؤال
    // «آیا کنارتان است؟» برای نفرِ مرحله‌ی بعد دوباره پرسیده می‌شود (زنجیره‌ای).
    notify(nextStep
      ? 'امضای حضوری «' + toName + '» ثبت شد. اگر «' + (nextStep.toUserName || 'نفر بعدی') + '» هم کنارتان است، همین‌جا ادامه دهید.'
      : 'امضای حضوری «' + toName + '» ثبت شد و زنجیره‌ی امضا کامل شد.', 'success');
    // «PDF درایو = آخرین وضعیت برگه»: مثل امضای عادی — سبک و بدون رندر روی
    // گوشی (serverOnly) + حذف دوباره‌کاری چند امضای پشت‌هم.
    try {
      const cfg = resolveCloudConfig(data.settings);
      if (cfg.url && cfg.apiKey && nextRec) {
        scheduleRecordPdfSync('pdf:' + rec.id, () => {
          Promise.resolve(ensureRecordVisuals(nextRec))
            .then(visual => sendRecordToAppsScript(cfg.url, cfg.apiKey, visual, data.settings, null, { serverOnly: true }))
            .then(json => {
              if (json && json.pdfUrl) {
                update(d => {
                  const j = d.records.findIndex(r => r.id === rec.id);
                  if (j > -1) d.records[j].pdfUrl = json.pdfUrl;
                });
              }
            })
            .catch(() => { /* شکست آپلود PDF هرگز امضا را برنمی‌گرداند */ });
        });
      }
    } catch (e) { /* بی‌خطر */ }
    // زنجیره‌ای: فقط وقتی دیگر مرحله‌ی فعالی نمانده مودال کاملاً بسته می‌شود.
    // در غیر این صورت فقط پد امضا بسته می‌شود؛ چون `step`/`toName`/`stepNo`
    // در بدنه‌ی تابع از `live` (رکورد تازه) محاسبه می‌شوند، رندر بعدی خودکار
    // سؤال «آیا کنارتان است؟» را برای مرحله‌ی جدید نشان می‌دهد.
    if (nextStep) setPadOpen(false); else onClose();
  };

  return (
    <React.Fragment>
      <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-slate-900/50 p-3 no-print" onClick={onClose}>
        <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-3" onClick={e => e.stopPropagation()}>
          <div className="flex items-start gap-2.5">
            <span className="text-2xl leading-none">✍️</span>
            <div className="flex-1 min-w-0">
              <h3 className="font-bold text-slate-800 text-sm">امضای حضوری در محل — مرحله {toPersianDigits(stepNo)}</h3>
              <p className="text-xs text-slate-500 mt-1 leading-6">
                آیا <b className="text-slate-700">{toName}</b> ({signSlotLabel(step.slot)}) اکنون کنار شماست؟
              </p>
            </div>
          </div>
          <div className="bg-brand-50 border border-brand-200 rounded-xl p-3 text-xs text-brand-900 leading-6">
            <b>حاضره؟</b> دکمه‌ی زیر را بزنید و دستگاه را دست او بدهید تا امضایش را همین‌جا بکشد؛
            امضا به نام خودش ثبت می‌شود و این مرحله بسته می‌شود.
            <br /><b>نیست؟</b> هیچ کاری لازم نیست — برگه خودکار به صف «در انتظار امضا»ی او می‌رود
            تا از دستگاه خودش امضا کند (یا از همین صفحه با «ارجاع» به فرد دیگری سپرده شود).
          </div>
          <div className="flex flex-col sm:flex-row gap-2 pt-1">
            <button onClick={() => setPadOpen(true)}
              className="flex-1 bg-brand-600 hover:bg-brand-700 text-white rounded-xl py-2.5 text-sm font-medium">
              ✍️ بله، حاضره — امضایش را همین‌جا می‌گیرم
            </button>
            <button onClick={onClose}
              className="px-4 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 text-sm">
              نه، بعداً در صف خودش امضا می‌کند
            </button>
          </div>
        </div>
      </div>
      <SignaturePad open={padOpen} onClose={() => setPadOpen(false)}
        roleLabel={'امضای حضوری — ' + signSlotLabel(step.slot) + ' (مرحله ' + toPersianDigits(stepNo) + ')'}
        initialName={toName}
        lockName
        onSave={doOnsite} />
    </React.Fragment>
  );
}

function SignQueuePage({ goRecord }) {
  const { data, update, currentUser, notify, perms, ensureRecordVisuals } = useAppData();
  const [openRec, setOpenRec] = useState(null);
  const [padOpen, setPadOpen] = useState(false);
  const [confirmCancel, setConfirmCancel] = useState(null);
  const [printing, setPrinting] = useState(false);
  const [tab, setTab] = useState('toSign');
  // «امضا در محل یا ارجاع»: مودال ارجاع مرحله‌ی فعال به فردی دیگر
  const [referRec, setReferRec] = useState(null);
  const [referTo, setReferTo] = useState('');
  const [referNote, setReferNote] = useState('');
  // صفحه‌بندی رندر: با فهرست‌های بلند، رندر یک‌جای همه‌ی کارت‌ها UI را قفل می‌کرد
  const [limit, setLimit] = useState(SIGN_QUEUE_PAGE_SIZE);

  const queue = useMemo(
    () => buildSignQueue(data.records, currentUser, perms),
    [data.records, currentUser, perms]
  );
  const isAdmin = !!(perms && perms.isAdmin);

  // با عوض کردن تب، سقف رندر بازنشانی شود تا تب تازه از اول نشان داده شود
  const switchTab = (t) => { setTab(t); setLimit(SIGN_QUEUE_PAGE_SIZE); };

  const myName = ((currentUser && (currentUser.name || currentUser.username)) || '').trim();

  const doSign = (sig) => {
    const target = openRec;
    if (!target) return;

    // رفع ایراد P2-۸: اگر حساب کاربر فاقد name و username باشد، امضا با نام
    // خالی ثبت می‌شد و در گزارش/PDF هیچ ردپایی از امضاکننده نمی‌ماند. حالا
    // پیش از باز کردن پد، صریح مسدود و راهنمایی می‌شود.
    if (!myName) {
      notify('نام حساب کاربری شما خالی است. از ادمین بخواهید نام کاربری‌تان را در «کاربران» کامل کند؛ تا آن زمان امکان امضا نیست.', 'error');
      setPadOpen(false);
      return;
    }

    let applied = false;
    let nextStep = null;
    update(d => {
      const i = d.records.findIndex(r => r.id === target.id);
      if (i < 0) return;
      // بازبینی مجوز در لحظه‌ی نوشتن: ممکن است در فاصله‌ی باز کردن مودال،
      // درخواست توسط دستگاه دیگری امضا یا لغو شده باشد.
      if (!canSignRequest(d.records[i], currentUser, perms)) return;
      const next = applySignatureToRecord(d.records[i], sig, currentUser);
      if (next) {
        d.records[i] = next;
        applied = true;
        // `next.signRequest` را خود normalizeSignRequest از نو ساخته، پس یک شیء
        // ساده است و بیرون بردنش از producer نشت draft ایجاد نمی‌کند.
        nextStep = activeSignStep(next.signRequest);
      }
    });
    setPadOpen(false);
    setOpenRec(null);
    if (!applied) { notify('این درخواست پیش‌تر امضا یا لغو شده بود.', 'error'); return; }
    // بعد از امضا باید بگوییم توپ در زمین چه کسی افتاد، وگرنه کاربر فکر می‌کند
    // کار تمام شده در حالی که هنوز یک مرحله مانده است.
    notify(nextStep
      ? `امضای شما ثبت شد. اکنون نوبت «${nextStep.toUserName || '—'}» (${signSlotLabel(nextStep.slot)}) است.`
      : 'امضای شما ثبت شد و زنجیره‌ی امضا کامل گردید.', 'success');

    // «PDF درایو = آخرین وضعیت برگه»: با هر امضا، همان برگه‌ی تازه (با امضای
    // جدید) در درایو جایگزین می‌شود. رفع کندی: PDF روی گوشی ساخته نمی‌شود
    // (serverOnly) و اگر چند امضای پشت‌هم ثبت شود فقط آخرین وضعیت ارسال
    // می‌شود — پس همگام‌سازی بعد از امضا سریع تمام می‌شود. شکست آپلود هرگز
    // امضای ثبت‌شده را تحت‌تأثیر نمی‌گذارد.
    const cfg = resolveCloudConfig(data.settings);
    if (cfg.url && cfg.apiKey) {
      const current = data.records.find(r => r.id === target.id);
      const signedNow = current ? (applySignatureToRecord(current, sig, currentUser) || current) : null;
      if (signedNow) {
        scheduleRecordPdfSync('pdf:' + target.id, () => {
          Promise.resolve(ensureRecordVisuals(signedNow))
            .then(visual => sendRecordToAppsScript(cfg.url, cfg.apiKey, visual, data.settings, null, { serverOnly: true }))
            .then(json => {
              if (json && json.pdfUrl) {
                update(d => {
                  const j = d.records.findIndex(r => r.id === target.id);
                  if (j > -1) d.records[j].pdfUrl = json.pdfUrl;
                });
              }
            })
            .catch(() => { /* آپلود نشدن PDF نباید امضای ثبت‌شده را تحت‌تأثیر بگذارد */ });
        });
      }
    }
  };

  const doCancel = (rec) => {
    let done = false;
    update(d => {
      const i = d.records.findIndex(r => r.id === rec.id);
      if (i < 0) return;
      const next = cancelSignRequest(d.records[i], currentUser, perms);
      if (next) { d.records[i] = next; done = true; }
    });
    setConfirmCancel(null);
    notify(done ? 'درخواست امضا لغو شد.' : 'لغو این درخواست برای شما مجاز نیست.', done ? 'success' : 'error');
  };

  /* ---------------- ارجاع مرحله‌ی فعال به دیگری ----------------
     گیرنده‌ای که نمی‌تواند/نمی‌خواهد در محل امضا کند، برگه را با توضیح به
     فرد واجد شرایط دیگری می‌فرستد؛ توپ از زمین او خارج و به گیرنده‌ی تازه
     منتقل می‌شود (در صفحه‌ی «در انتظار امضا»ی او ظاهر می‌شود). */
  const openRefer = (rec) => { setReferRec(rec); setReferTo(''); setReferNote(''); };

  const referCandidatesFor = (rec) => {
    const sr = normalizeSignRequest(rec && rec.signRequest);
    const exclude = [];
    if (sr) {
      sr.steps.forEach((s, i) => {
        if (i !== sr.current) { if (s.toUserId) exclude.push(s.toUserId); }
        if (s.signedByUserId) exclude.push(s.signedByUserId);
      });
    }
    if (rec && rec.inspectorId) exclude.push(String(rec.inspectorId));
    return signRequestCandidates(data.users, currentUser, exclude);
  };

  const doRefer = () => {
    const rec = referRec;
    if (!rec || !referTo) return;
    const toUser = data.users.find(u => u.id === referTo);
    if (!toUser) { notify('کاربر انتخاب‌شده برای ارجاع معتبر نیست.', 'error'); return; }
    let done = false;
    update(d => {
      const i = d.records.findIndex(r => r.id === rec.id);
      if (i < 0) return;
      // بازبینی مجوز در لحظه‌ی نوشتن: ممکن است در فاصله‌ی باز کردن مودال،
      // مرحله توسط دستگاه دیگری امضا یا ارجاع داده شده باشد.
      const next = referSignRequest(d.records[i], { toUser, byUser: currentUser, note: referNote }, perms);
      if (next) { d.records[i] = next; done = true; }
    });
    setReferRec(null);
    notify(done
      ? `برگه جهت امضا به «${toUser.name || toUser.username}» ارجاع شد.`
      : 'ارجاع انجام نشد؛ برگه پیش‌تر امضا/لغو شده یا اجازه‌ی ارجاع ندارید.',
      done ? 'success' : 'error');
  };

  const doPrint = async (rec) => {
    setPrinting(true);
    try { printSingleRecord(await ensureRecordVisuals(rec), data.settings, notify); }
    finally { setPrinting(false); }
  };

  const row = (item, isMine) => {
    const rec = item.record, sr = item.signRequest;
    const pending = sr.status === SIGN_REQUEST_STATUS.PENDING;
    const signable = pending && (isMine || (perms && perms.isAdmin));
    return (
      <div key={rec.id} className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="flex flex-wrap items-start justify-between gap-2">
          <div className="min-w-0">
            <p className="font-bold text-slate-800 text-sm">{rec.assetCode} — {rec.assetName || rec.templateName || ''}</p>
            <p className="text-xs text-slate-500 mt-0.5">
              {rec.templateName} · بازرس: {rec.inspectorName || '—'} · {toPersianDigits(rec.date || gregorianToJalaliStr(rec.completedAt))}
            </p>
          </div>
          <div className="flex items-center gap-1.5 shrink-0">
            <StatusBadge status={rec.status} />
            {pending
              ? <Badge tone="warn">{'مرحله ' + toPersianDigits(sr.current + 2) + ' از ' + toPersianDigits(sr.steps.length + 1)}</Badge>
              : <Badge tone={sr.status === SIGN_REQUEST_STATUS.SIGNED ? 'ok' : 'slate'}>{SIGN_REQUEST_STATUS_LABELS[sr.status]}</Badge>}
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3 text-[11px] text-slate-500">
          <div><span className="text-slate-400">آغازکننده:</span><br /><b className="text-slate-700">{sr.byUserName || '—'}</b></div>
          <div><span className="text-slate-400">نوبت فعلی:</span><br /><b className="text-slate-700">{sr.toUserName || '—'}</b></div>
          <div><span className="text-slate-400">تاریخ درخواست:</span><br /><b className="text-slate-700" dir="ltr">{toPersianDigits(gregorianToJalaliStr(new Date(sr.requestedAt)))}</b></div>
          <div><span className="text-slate-400">نتیجه:</span><br /><b className="text-slate-700">{toPersianDigits(rec.percent)}٪</b></div>
        </div>

        <SignChainTrack rec={rec} />

        {item.upcoming && (
          <p className="text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 mt-2">
            نوبت شما هنوز نرسیده است؛ پس از امضای <b>{sr.toUserName || '—'}</b> این برگه به صف «باید امضا کنم» شما می‌آید.
          </p>
        )}

        {sr.note && (
          <p className="text-xs bg-slate-50 border border-slate-100 rounded-lg px-3 py-2 mt-3 text-slate-600">
            <b>توضیح:</b> {sr.note}
          </p>
        )}

        {!pending && sr.status === SIGN_REQUEST_STATUS.SIGNED && (
          <p className="text-xs text-ok-700 mt-2">
            ✓ آخرین مرحله توسط <b>{sr.signedByUserName || '—'}</b> در {toPersianDigits(gregorianToJalaliStr(new Date(sr.signedAt)))} امضا شد
            {sr.signedByUserId !== sr.toUserId && <span className="text-warn-700"> (جانشین از طرف گیرنده)</span>}
          </p>
        )}

        <div className="flex flex-wrap gap-2 mt-3">
          <button onClick={() => setOpenRec(rec)}
            className="px-3.5 py-2 rounded-xl text-xs border border-slate-200 hover:bg-slate-50 text-slate-700">
            مشاهده برگه
          </button>
          {signable && (
            <button onClick={() => { setOpenRec(rec); setPadOpen(true); }} disabled={!myName}
              title={myName ? '' : 'نام حساب کاربری شما خالی است؛ ابتدا ادمین باید آن را کامل کند'}
              className="px-3.5 py-2 rounded-xl text-xs bg-brand-600 hover:bg-brand-700 text-white font-medium disabled:opacity-50 disabled:cursor-not-allowed">
              ✍️ امضا در محل
            </button>
          )}
          {signable && (
            <button onClick={() => openRefer(rec)}
              title="نمی‌توانید الان امضا کنید؟ برگه را به فرد واجد شرایط دیگری بفرستید."
              className="px-3.5 py-2 rounded-xl text-xs bg-warn-50 border border-warn-300 hover:bg-warn-100 text-warn-800 font-medium">
              ↪️ ارجاع به دیگری
            </button>
          )}
          {pending && ((perms && perms.isAdmin) || sr.byUserId === String(currentUser && currentUser.id)) && (
            <button onClick={() => setConfirmCancel(rec)}
              className="px-3.5 py-2 rounded-xl text-xs border border-danger-200 text-danger-600 hover:bg-danger-50">
              لغو درخواست
            </button>
          )}
          {goRecord && (
            <button onClick={() => goRecord(rec.id)}
              className="px-3.5 py-2 rounded-xl text-xs text-slate-500 hover:bg-slate-50">
              در سوابق ↗
            </button>
          )}
        </div>
      </div>
    );
  };

  const empty = (msg) => (
    <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center text-slate-400 text-sm">{msg}</div>
  );

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-lg font-bold text-slate-800">در انتظار امضا</h2>
        <p className="text-sm text-slate-500">
          برگه‌هایی که در زنجیره‌ی امضا هستند. هر مرحله فقط بعد از امضای مرحله‌ی قبل باز می‌شود؛
          امضای شما در جایگاه همان مرحله روی برگه می‌نشیند.
        </p>
      </div>

      <div className="flex flex-wrap gap-2 no-print">
        <button onClick={() => switchTab('toSign')}
          className={"px-4 py-2 rounded-xl text-sm border " + (tab === 'toSign' ? "bg-brand-600 text-white border-brand-600" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
          باید امضا کنم ({toPersianDigits(queue.toSign.length)})
        </button>
        {isAdmin && (
          <button onClick={() => switchTab('adminAll')}
            className={"px-4 py-2 rounded-xl text-sm border " + (tab === 'adminAll' ? "bg-brand-600 text-white border-brand-600" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
            همه‌ی درخواست‌های باز ({toPersianDigits(queue.adminAll.length)})
          </button>
        )}
        <button onClick={() => switchTab('tracking')}
          className={"px-4 py-2 rounded-xl text-sm border " + (tab === 'tracking' ? "bg-brand-600 text-white border-brand-600" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
          {isAdmin ? 'پیگیری و سابقه' : 'پیگیری ارجاع‌های من'} ({toPersianDigits(queue.tracking.length)})
        </button>
      </div>

      {(() => {
        const list = tab === 'toSign' ? queue.toSign : (tab === 'adminAll' ? queue.adminAll : queue.tracking);
        const emptyMsg = tab === 'toSign'
          ? 'درخواست امضای بازی در انتظار شما نیست.'
          : (tab === 'adminAll'
            ? 'هیچ درخواست امضای بازی در سامانه نیست.'
            : 'ارجاع ثبت‌شده‌ای برای پیگیری وجود ندارد.');
        if (!list.length) return empty(emptyMsg);
        const shown = list.slice(0, limit);
        return (
          <div className="space-y-3">
            {tab === 'adminAll' && (
              <p className="text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                این فهرست درخواست‌هایی است که گیرنده‌شان شما نیستید؛ به‌عنوان ادمین می‌توانید به جانشینی امضا کنید.
              </p>
            )}
            {shown.map(it => row(it, tab !== 'tracking' && canSignRequest(it.record, currentUser, perms)))}
            {list.length > shown.length && (
              <button onClick={() => setLimit(n => n + SIGN_QUEUE_PAGE_SIZE)}
                className="w-full px-4 py-2.5 rounded-xl text-sm border border-slate-200 bg-white hover:bg-slate-50 text-slate-600">
                نمایش {toPersianDigits(Math.min(SIGN_QUEUE_PAGE_SIZE, list.length - shown.length))} مورد دیگر
                <span className="text-slate-400"> (باقی‌مانده: {toPersianDigits(list.length - shown.length)})</span>
              </button>
            )}
          </div>
        );
      })()}

      <Modal open={!!openRec} onClose={() => { setOpenRec(null); setPadOpen(false); }} wide
        title={openRec ? `برگه بازرسی ${openRec.assetCode}` : ''}>
        {openRec && (
          <div className="space-y-3 text-sm">
            <div className="grid grid-cols-2 gap-2 text-slate-600">
              <p>تجهیز: {openRec.assetCode} — {openRec.assetName || '—'}</p>
              <p>قالب: {openRec.templateName || '—'}</p>
              <p>بازرس: {openRec.inspectorName || '—'}</p>
              <p dir="ltr">تاریخ: {toPersianDigits(openRec.date || '')}</p>
              <p>درصد موفقیت: {toPersianDigits(openRec.percent)}٪ <StatusBadge status={openRec.status} /></p>
              <p>محل: {openRec.location || '—'}</p>
            </div>

            {(openRec.details || []).length > 0 && (
              <div className="divide-y divide-slate-100 border border-slate-100 rounded-xl overflow-hidden max-h-56 overflow-y-auto">
                {openRec.details.map(d => (
                  <div key={d.itemId} className="flex justify-between p-2.5 text-xs">
                    <span className="text-slate-600">{d.label}{d.critical && <span className="text-danger-500 mr-1">(حیاتی)</span>}</span>
                    <span className="font-medium text-slate-800">
                      {typeof d.value === 'boolean' ? (d.value ? 'تأیید شد' : 'تأیید نشد') : (d.value ?? '—')}
                    </span>
                  </div>
                ))}
              </div>
            )}

            {openRec.notes && <p className="text-xs bg-slate-50 rounded-lg p-2.5">یادداشت بازرسی: {openRec.notes}</p>}

            {(() => {
              const sr = normalizeSignRequest(openRec.signRequest);
              if (!sr) return null;
              const step = activeSignStep(sr);
              return (
                <div>
                  <p className="text-xs bg-warn-50 border border-warn-200 rounded-lg p-2.5 text-warn-800">
                    زنجیره از <b>{sr.byUserName || '—'}</b> آغاز شده؛{' '}
                    {step
                      ? <span>نوبت فعلی: <b>{step.toUserName || '—'}</b> ({signSlotLabel(step.slot)})</span>
                      : <span>{SIGN_REQUEST_STATUS_LABELS[sr.status]}</span>}
                    {step && step.note ? ` — ${step.note}` : ''}
                  </p>
                  <SignChainTrack rec={openRec} compact />
                </div>
              );
            })()}

            <div className="flex flex-wrap gap-2 pt-1">
              {canSignRequest(openRec, currentUser, perms) && (
                <button onClick={() => setPadOpen(true)} disabled={!myName}
                  title={myName ? '' : 'نام حساب کاربری شما خالی است؛ ابتدا ادمین باید آن را کامل کند'}
                  className="flex-1 bg-brand-600 hover:bg-brand-700 text-white rounded-xl py-2.5 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
                  ✍️ امضا در محل
                </button>
              )}
              {canReferSignRequest(openRec, currentUser, perms) && (
                <button onClick={() => openRefer(openRec)}
                  className="flex-1 bg-warn-50 border border-warn-300 hover:bg-warn-100 text-warn-800 rounded-xl py-2.5 text-sm font-medium">
                  ↪️ ارجاع به دیگری
                </button>
              )}
              <button onClick={() => doPrint(openRec)} disabled={printing}
                className="flex-1 border border-slate-200 hover:bg-slate-50 disabled:opacity-50 text-slate-700 rounded-xl py-2.5 text-sm">
                چاپ برگه
              </button>
              {openRec.pdfUrl && (
                <a href={openRec.pdfUrl} target="_blank" rel="noopener noreferrer"
                  className="flex-1 text-center border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl py-2.5 text-sm">
                  📄 PDF در Drive
                </a>
              )}
            </div>
          </div>
        )}
      </Modal>

      <Modal open={!!confirmCancel} onClose={() => setConfirmCancel(null)} title="لغو درخواست امضا">
        <p className="text-sm text-slate-600">
          با لغو، کل زنجیره متوقف می‌شود: مراحل امضانشده حذف می‌شوند و جای امضایشان روی برگه
          خالی می‌ماند. امضاهایی که تا الان ثبت شده‌اند دست‌نخورده باقی می‌مانند. ادامه می‌دهید؟
        </p>
        <div className="flex gap-2 justify-end mt-4">
          <button onClick={() => setConfirmCancel(null)} className="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">انصراف</button>
          <button onClick={() => doCancel(confirmCancel)} className="px-4 py-2 rounded-xl text-sm bg-danger-600 hover:bg-danger-700 text-white">لغو درخواست</button>
        </div>
      </Modal>

      <Modal open={!!referRec} onClose={() => setReferRec(null)} title="ارجاع برگه به دیگری">
        {referRec && (() => {
          const candidates = referCandidatesFor(referRec);
          const step = activeSignStep(normalizeSignRequest(referRec.signRequest));
          return (
            <div className="space-y-3">
              <p className="text-sm text-slate-600 leading-6">
                به‌جای «امضا در محل»، این مرحله ({step ? signSlotLabel(step.slot) : '—'}) را به فرد واجد شرایط
                دیگری می‌سپارید. برگه در صفحه‌ی «در انتظار امضا»ی او ظاهر می‌شود و ردپای ارجاع هم ثبت می‌ماند.
              </p>
              {candidates.length === 0 ? (
                <p className="text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                  کاربر فعال دیگری با نقش تأییدکننده/مدیر/ادمین برای ارجاع وجود ندارد.
                </p>
              ) : (
                <Field label="ارجاع به">
                  <select className={inputCls} value={referTo} onChange={e => setReferTo(e.target.value)}>
                    <option value="">— انتخاب کنید —</option>
                    {candidates.map(u => (
                      <option key={u.id} value={u.id}>{u.name || u.username} ({ROLE_LABELS[u.role] || u.role})</option>
                    ))}
                  </select>
                </Field>
              )}
              <Field label="توضیح برای امضاکننده (اختیاری)">
                <input className={inputCls} value={referNote} maxLength={200}
                  onChange={e => setReferNote(e.target.value)}
                  placeholder="مثلاً: فردا صبح در دفتر حاضر می‌شوم، لطفاً بررسی و امضا کنید" />
              </Field>
              <div className="flex gap-2 justify-end pt-1">
                <button onClick={() => setReferRec(null)} className="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">انصراف</button>
                <button onClick={doRefer} disabled={!referTo}
                  className="px-4 py-2 rounded-xl text-sm bg-warn-500 hover:bg-warn-600 disabled:opacity-50 disabled:cursor-not-allowed text-white">
                  ↪️ ارجاع برگه
                </button>
              </div>
            </div>
          );
        })()}
      </Modal>

      <SignaturePad open={padOpen} onClose={() => setPadOpen(false)}
        roleLabel={(() => {
          const step = openRec ? activeSignStep(normalizeSignRequest(openRec.signRequest)) : null;
          return (step ? signSlotLabel(step.slot) : SIGN_SLOTS.approver.label) + ' (از طریق زنجیره‌ی امضا)';
        })()}
        initialName={myName} lockName
        onSave={doSign} />
    </div>
  );
}

/* ============================================================
   ۱۵. صفحه سوابق بازرسی و پنل خروجی‌ها
   ============================================================ */
/** عکس برون‌سپاری‌شده در درایو: با کلیک، تصویر از ابر گرفته و جایگزین می‌شود. */
function ExternalPhoto({ ph, settings }) {
  const [img, setImg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const load = async () => {
    const cfg = resolveCloudConfig(settings);
    if (!cfg.url || !cfg.apiKey) { setErr('اتصال ابری پیکربندی نشده است.'); return; }
    setBusy(true); setErr('');
    try {
      const res = await signedCall(cfg.url, cfg.apiKey, 'records.signature', { fileId: ph.fileId }, cloudFolderName(settings));
      if (res && res.image) setImg(res.image); else setErr('تصویر یافت نشد.');
    } catch (e) { setErr(e.message || 'خطا در دریافت عکس.'); }
    setBusy(false);
  };
  if (img) return <img src={img} alt={ph.name || 'عکس بازرسی'} className="w-24 h-24 object-cover rounded-lg border border-slate-200" />;
  if (ph.lost) return <div className="w-24 h-24 rounded-lg border border-dashed border-slate-300 flex items-center justify-center text-[10px] text-slate-400 text-center p-1">عکس در دسترس نیست</div>;
  return (
    <button onClick={load} disabled={busy}
      className="w-24 h-24 rounded-lg border border-dashed border-slate-300 hover:bg-slate-50 flex flex-col items-center justify-center text-[10px] text-slate-500 gap-1 p-1">
      <span className="text-lg">☁️</span>
      {busy ? 'در حال دریافت…' : (err || 'دریافت عکس از ابر')}
    </button>
  );
}

function RecordsPage({ focusRecordId, onFocusHandled }) {
  const { data, notify, currentUser, perms, ensureRecordVisuals } = useAppData();
  const [selected, setSelected] = useState([]);
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('همه');
  // فیلترهای پیشرفته: بازه‌ی زمانی شمسی + دسته‌بندی + فقط عدم انطباق‌ها
  const [fromDate, setFromDate] = useState('');
  const [toDate, setToDate] = useState('');
  const [catFilter, setCatFilter] = useState('همه');
  const [onlyNc, setOnlyNc] = useState(false);
  const [detailRec, setDetailRec] = useState(null);
  const [printing, setPrinting] = useState(false);
  const canManage = !!(perms && perms.canManage);

  // پرش از صفحه‌ی «در انتظار امضا» به جزئیات یک رکورد مشخص
  useEffect(() => {
    if (!focusRecordId) return;
    const rec = data.records.find(r => r.id === focusRecordId);
    if (rec) setDetailRec(rec);
    if (onFocusHandled) onFocusHandled();
    // eslint-disable-next-line
  }, [focusRecordId]);

  // تصاویر امضا ممکن است به‌صورت ارجاع به Drive باشند؛ پیش از چاپ کامل می‌شوند
  const withVisuals = async (recs) => {
    const out = [];
    for (const r of recs) out.push(await ensureRecordVisuals(r));
    return out;
  };
  const doPrintOne = async (rec) => {
    setPrinting(true);
    try { printSingleRecord((await withVisuals([rec]))[0], data.settings, notify); }
    finally { setPrinting(false); }
  };
  const doPrintMany = async (recs, fn) => {
    if (!recs.length) return;
    setPrinting(true);
    try { fn(await withVisuals(recs), data.settings, notify); }
    finally { setPrinting(false); }
  };

  const filtered = data.records.filter(r => {
    const matchQ = ((r.assetCode || '') + (r.inspectorName || '') + (r.templateName || '')).toLowerCase().includes(query.toLowerCase());
    const matchS = statusFilter === 'همه' || r.status === statusFilter;
    // دسته‌بندی (برق / ماشین‌آلات / ...)
    const matchC = catFilter === 'همه' || (r.category || '') === catFilter;
    // بازه‌ی زمانی شمسی: مقایسه با زمان تکمیل برگه (یا زمان ساخت به‌عنوان جایگزین)
    let matchD = true;
    if (fromDate || toDate) {
      const t = Date.parse(r.completedAt) || Number(r.createdAt) || 0;
      if (fromDate) { const d = jalaliStrToDate(fromDate, false); if (d && t < d.getTime()) matchD = false; }
      if (toDate) { const d = jalaliStrToDate(toDate, true); if (d && t > d.getTime()) matchD = false; }
    }
    const matchNc = !onlyNc || isNonconformingRecord(r);
    return matchQ && matchS && matchC && matchD && matchNc;
  });

  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const selectedRecords = data.records.filter(r => selected.includes(r.id));
  // مجموعه‌ی هدف همه‌ی خروجی‌ها: برگه‌های تیک‌خورده؛ اگر چیزی تیک نخورده باشد،
  // همه‌ی نتایج فیلترشده (تا خروجیِ یک بازه بدون تیک‌زدن ده‌ها برگه ممکن باشد).
  const targetRecords = selected.length ? selectedRecords : filtered;
  const ncCount = targetRecords.filter(isNonconformingRecord).length;
  const filtersActive = !!(fromDate || toDate || catFilter !== 'همه' || onlyNc);
  const rangeLabel = (fromDate || toDate)
    ? 'بازه: ' + (fromDate ? toPersianDigits(fromDate) : 'ابتدا') + ' تا ' + (toDate ? toPersianDigits(toDate) : 'انتها') + (catFilter !== 'همه' ? ' — دسته: ' + catFilter : '')
    : (catFilter !== 'همه' ? 'دسته: ' + catFilter : '');

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-lg font-bold text-slate-800">سوابق بازرسی</h2>
        <p className="text-sm text-slate-500">{toPersianDigits(data.records.length)} سابقه ثبت‌شده</p>
      </div>

      <div className="flex flex-wrap gap-3 items-center">
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="جستجو بر اساس تجهیز، بازرس یا قالب…" className={inputCls + " max-w-xs"} />
        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className={inputCls + " max-w-[10rem]"}>
          {['همه', 'موفق', 'ناموفق', 'ناموفق (حیاتی)'].map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <div className="flex items-center gap-1">
          <span className="text-xs text-slate-500 shrink-0">از</span>
          <div className="w-[8.5rem]"><PersianDatePicker value={fromDate} onChange={setFromDate} placeholder="از تاریخ" /></div>
        </div>
        <div className="flex items-center gap-1">
          <span className="text-xs text-slate-500 shrink-0">تا</span>
          <div className="w-[8.5rem]"><PersianDatePicker value={toDate} onChange={setToDate} placeholder="تا تاریخ" /></div>
        </div>
        <select value={catFilter} onChange={e => setCatFilter(e.target.value)} className={inputCls + " max-w-[9rem]"}>
          {['همه'].concat(data.categories || []).map(c => <option key={c} value={c}>{c === 'همه' ? 'همه‌ی دسته‌ها' : c}</option>)}
        </select>
        <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer select-none">
          <input type="checkbox" checked={onlyNc} onChange={e => setOnlyNc(e.target.checked)} />
          فقط عدم انطباق‌ها
        </label>
        {filtersActive && (
          <button onClick={() => { setFromDate(''); setToDate(''); setCatFilter('همه'); setOnlyNc(false); }}
            title="حذف همه‌ی فیلترهای بازه/دسته"
            className="text-xs text-danger-600 hover:underline">✕ پاک‌کردن فیلترها</button>
        )}
        <div className="flex-1"></div>
        {canManage && (
          <div className="flex flex-wrap gap-2 items-center">
            <button disabled={targetRecords.length === 0 || printing} onClick={() => doPrintMany(targetRecords, printSequentialRecords)}
              className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm hover:bg-slate-50 disabled:opacity-40">چاپ پشت‌سرهم ({toPersianDigits(targetRecords.length)})</button>
            <button disabled={targetRecords.length === 0 || printing}
              onClick={async () => { setPrinting(true); try { await downloadSequentialPdf(await withVisuals(targetRecords), data.settings, notify); } finally { setPrinting(false); } }}
              title="همان برگه‌ها در یک فایل PDF واحد برای دانلود"
              className="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm disabled:opacity-40">⬇️ دانلود PDF پشت‌سرهم</button>
            <button disabled={targetRecords.length === 0 || printing} onClick={() => doPrintMany(targetRecords, printSummaryReport)}
              className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm hover:bg-slate-50 disabled:opacity-40">گزارش تجمیعی</button>
            <button disabled={ncCount === 0 || printing}
              onClick={async () => { setPrinting(true); try { await downloadNonconformityPdf(await withVisuals(targetRecords.filter(isNonconformingRecord)), data.settings, rangeLabel, notify); } finally { setPrinting(false); } }}
              title="برگه‌های ناموفق/حیاتی همین فیلتر، با فهرست آیتم‌های مغایر — خروجی PDF"
              className="px-3.5 py-2 rounded-xl bg-danger-50 border border-danger-200 text-danger-700 hover:bg-danger-100 text-sm disabled:opacity-40">⚠️ گزارش عدم انطباق‌ها ({toPersianDigits(ncCount)})</button>
            <button disabled={targetRecords.length === 0} onClick={() => { exportRecordsXlsx(targetRecords, data.settings, notify); }}
              className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm hover:bg-slate-50 disabled:opacity-40">خروجی اکسل</button>
            <button disabled={targetRecords.length === 0} onClick={() => exportRecordsCsv(targetRecords)}
              className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm hover:bg-slate-50 disabled:opacity-40">خروجی CSV</button>
          </div>
        )}
      </div>
      {canManage && selected.length === 0 && targetRecords.length > 0 && (
        <p className="text-[11px] text-slate-400 -mt-3">
          خروجی‌ها روی <b>{toPersianDigits(targetRecords.length)}</b> نتیجه‌ی فیلترشده اعمال می‌شود؛ اگر برگه‌ای را تیک بزنید، فقط همان‌ها گرفته می‌شود.
        </p>
      )}

      <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="p-3 text-right"><input type="checkbox"
                checked={filtered.length > 0 && filtered.every(r => selected.includes(r.id))}
                onChange={e => setSelected(e.target.checked ? filtered.map(r => r.id) : [])} /></th>
              <th className="p-3 text-right">تجهیز</th>
              <th className="p-3 text-right">قالب</th>
              <th className="p-3 text-right">بازرس</th>
              <th className="p-3 text-right">تاریخ</th>
              <th className="p-3 text-right">درصد</th>
              <th className="p-3 text-right">وضعیت</th>
              <th className="p-3 text-right">عملیات</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(r => (
              <tr key={r.id} className="border-t border-slate-100 hover:bg-slate-50">
                <td className="p-3"><input type="checkbox" checked={selected.includes(r.id)} onChange={() => toggle(r.id)} /></td>
                <td className="p-3 font-medium">{r.assetCode}</td>
                <td className="p-3 text-slate-500">{r.templateName}</td>
                <td className="p-3 text-slate-500">
                  {r.inspectorName}
                  {isPendingSignRequest(r) && (
                    <span className="block" title={signChainLabel(r)}>
                      <Badge tone="warn">
                        {(() => {
                          const p = signChainProgress(r);
                          return 'در انتظار امضا ' + toPersianDigits(p.done) + '/' + toPersianDigits(p.total);
                        })()}
                      </Badge>
                    </span>
                  )}
                </td>
                <td className="p-3 text-slate-500" dir="ltr">{toPersianDigits(r.date)}</td>
                <td className="p-3 font-medium">{toPersianDigits(r.percent)}٪</td>
                <td className="p-3"><StatusBadge status={r.status} /></td>
                <td className="p-3 flex gap-1.5">
                  <button onClick={() => setDetailRec(r)} className="text-xs bg-slate-100 hover:bg-slate-200 rounded-lg px-2.5 py-1.5">مشاهده</button>
                  <button onClick={() => doPrintOne(r)} disabled={printing} className="text-xs bg-brand-50 text-brand-700 hover:bg-brand-100 rounded-lg px-2.5 py-1.5 disabled:opacity-50">چاپ</button>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan={8} className="p-8 text-center text-slate-400">سابقه‌ای یافت نشد.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      <Modal open={!!detailRec} onClose={() => setDetailRec(null)} wide title={detailRec ? `جزئیات بازرسی ${detailRec.assetCode}` : ''}>
        {detailRec && (
          <div className="space-y-3 text-sm">
            <div className="grid grid-cols-2 gap-2 text-slate-600">
              <p>بازرس: {detailRec.inspectorName}</p>
              <p dir="ltr">تاریخ: {toPersianDigits(detailRec.date)}</p>
              <p>درصد موفقیت: {toPersianDigits(detailRec.percent)}٪</p>
              <p>وضعیت: <StatusBadge status={detailRec.status} /></p>
            </div>
            <div className="divide-y divide-slate-100 border border-slate-100 rounded-xl overflow-hidden">
              {detailRec.details.map(d => (
                <div key={d.itemId} className="flex justify-between p-2.5 text-xs">
                  <span className="text-slate-600">{d.label}</span>
                  <span className="font-medium text-slate-800">{typeof d.value === 'boolean' ? (d.value ? 'تأیید شد' : 'تأیید نشد') : (d.value ?? '—')}</span>
                </div>
              ))}
            </div>
            {detailRec.notes && <p className="text-xs bg-slate-50 rounded-lg p-2.5">یادداشت: {detailRec.notes}</p>}
            {detailRec.photos && detailRec.photos.length > 0 && (
              <div className="space-y-1.5">
                <p className="text-xs font-bold text-slate-600">📷 عکس‌های بازرسی ({toPersianDigits(detailRec.photos.length)})</p>
                <div className="flex flex-wrap gap-2">
                  {detailRec.photos.map((ph, i) => ph.image
                    ? <a key={i} href={ph.image} target="_blank" rel="noreferrer" title={ph.name || ''}>
                        <img src={ph.image} alt={ph.name || ('عکس ' + toPersianDigits(i + 1))} className="w-24 h-24 object-cover rounded-lg border border-slate-200" />
                      </a>
                    : <ExternalPhoto key={i} ph={ph} settings={data.settings} />)}
                </div>
              </div>
            )}
            <button onClick={() => doPrintOne(detailRec)} disabled={printing} className="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white rounded-xl py-2.5">🖨️ چاپ / دانلود PDF این بازرسی</button>
            <p className="text-[11px] text-slate-400 text-center leading-5">
              برای PDF که دقیقاً مثل همین صفحه‌ی چاپ باشد، در پنجره‌ی چاپ که باز می‌شود، مقصد (Destination) را روی «Save as PDF» بگذارید — این با فایل PDFِ خودکاری که هنگام ثبت بازرسی ساخته و در Drive/دانلودها ذخیره می‌شود فرق دارد (آن یکی برای رسیدن سریع و بدون‌دخالت کاربر، با روش دیگری ساخته می‌شود و ممکن است در جزئیات ظاهری کمی متفاوت باشد).
            </p>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================================================
   ۱۶. صفحه مدیریت کاربران
   ============================================================ */
function UserForm({ initial, onSave, onCancel }) {
  const [username, setUsername] = useState(initial ? initial.username : '');
  const [name, setName] = useState(initial ? initial.name : '');
  const [role, setRole] = useState(initial ? initial.role : 'inspector');
  const [pages, setPages] = useState(initial && initial.pages && initial.pages.length ? initial.pages : (DEFAULT_PAGES_BY_ROLE[initial ? initial.role : 'inspector'] || []).filter(p => p !== 'users' && p !== 'settings'));
  const [phone, setPhone] = useState(initial ? (initial.phone || '') : '');
  const [nationalId, setNationalId] = useState(initial ? (initial.nationalId || '') : '');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const togglePage = (key) => {
    setPages(p => p.includes(key) ? p.filter(x => x !== key) : [...p, key]);
  };

  // نقش «مشاهده‌گر» هرگز اجازه‌ی اجرای بازرسی ندارد (رفع ایراد ۴-۸)
  const effectiveRolePages = role === 'admin'
    ? DEFAULT_PAGES_BY_ROLE.admin.slice()
    : (role === 'viewer' ? pages.filter(p => p !== 'runner') : pages);

  const submit = async () => {
    if (!username.trim() || !name.trim()) { setError('نام کاربری و نام را کامل کنید.'); return; }
    if (nationalId && !/^[0-9]{10}$/.test(toEnglishDigits(nationalId))) { setError('کد ملی باید ۱۰ رقم باشد.'); return; }
    setBusy(true);
    setError('');
    const out = {
      username: username.trim(), name: name.trim(), role,
      pages: effectiveRolePages,
      phone: toEnglishDigits(phone).trim(),
      nationalId: toEnglishDigits(nationalId).trim(),
      active: initial ? initial.active !== false : true,
      sessionVersion: Number(initial && initial.sessionVersion) || 1,
    };

    let credentialChanged = false;
    if (password || !initial) {
      const errMsg = validatePasswordStrength(password);
      if (errMsg) { setError(errMsg); setBusy(false); return; }
      // رفع ایراد ۱-۴: هش رمز با PBKDF2 و salt اختصاصی هر کاربر ساخته می‌شود
      try { Object.assign(out, await makeCredential(password)); credentialChanged = true; }
      catch (e) { setError('ساخت هش رمز در این مرورگر ممکن نشد (نیاز به HTTPS یا localhost).'); setBusy(false); return; }
    } else {
      out.passwordHash = initial.passwordHash;
      out.salt = initial.salt || '';
      out.hashAlgo = initial.hashAlgo || '';
      out.iterations = Number(initial.iterations) || 0;
    }

    // هر تغییری در نقش/دسترسی/فعال بودن/رمز، نشست سایر دستگاه‌ها را باطل می‌کند
    // (رفع ایراد ۲-۱)
    const pagesChanged = JSON.stringify((initial && initial.pages || []).slice().sort()) !== JSON.stringify(effectiveRolePages.slice().sort());
    const roleChanged = initial && initial.role !== role;
    const activeChanged = initial && (initial.active === false) !== (out.active === false);
    if (credentialChanged || pagesChanged || roleChanged || activeChanged) out.sessionVersion = out.sessionVersion + 1;

    setBusy(false);
    onSave(out);
  };

  return (
    <div className="space-y-3">
      <Field label="نام کاربری"><input className={inputCls} value={username} onChange={e => setUsername(e.target.value)} /></Field>
      <Field label="نام کامل"><input className={inputCls} value={name} onChange={e => setName(e.target.value)} /></Field>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="شماره تماس (اختیاری)">
          <input className={inputCls} dir="ltr" inputMode="tel" value={phone}
            onChange={e => setPhone(sanitizeNumericInput(e.target.value, { maxLen: 15 }))} placeholder="09121234567" />
        </Field>
        <Field label="کد ملی (اختیاری)">
          <input className={inputCls} dir="ltr" inputMode="numeric" value={nationalId}
            onChange={e => setNationalId(sanitizeNumericInput(e.target.value, { maxLen: 10 }))} placeholder="0012345678" />
        </Field>
      </div>
      <Field label="نقش" hint={role === 'admin' ? 'کاربر ادمین همیشه به همه‌ی صفحات از جمله «کاربران» و «تنظیمات» دسترسی کامل دارد.' : 'می‌توانید در پایین دسترسی این کاربر را به‌صورت دقیق تنظیم کنید.'}>
        <select className={inputCls} value={role} onChange={e => setRole(e.target.value)}>
          <option value="admin">ادمین (دسترسی کامل)</option>
          <option value="manager">مدیر</option>
          <option value="inspector">بازرس</option>
          <option value="approver">تأییدکننده</option>
          <option value="viewer">مشاهده‌گر</option>
        </select>
      </Field>
      {role !== 'admin' && (
        <Field label="دسترسی به صفحات (اختصاصی برای این کاربر)" hint="صفحات «کاربران» و «تنظیمات» فقط مخصوص ادمین است و از این طریق قابل واگذاری نیست.">
          <div className="flex flex-wrap gap-2">
            {ASSIGNABLE_PAGES.map(p => {
              const disabled = role === 'viewer' && p.key === 'runner';
              return (
                <label key={p.key} title={disabled ? (p.note || '') : ''}
                  className={"flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs border " +
                    (disabled ? "border-slate-200 text-slate-300 cursor-not-allowed line-through" :
                      pages.includes(p.key) ? "bg-brand-50 border-brand-300 text-brand-700 cursor-pointer" : "border-slate-200 text-slate-500 cursor-pointer")}>
                  <input type="checkbox" className="hidden" disabled={disabled}
                    checked={!disabled && pages.includes(p.key)} onChange={() => togglePage(p.key)} />
                  {p.label}
                </label>
              );
            })}
            {role === 'viewer' && <p className="w-full text-[11px] text-slate-400">نقش «مشاهده‌گر» نمی‌تواند دسترسی «اجرای بازرسی» داشته باشد.</p>}
          </div>
        </Field>
      )}
      <Field label={initial ? 'رمز عبور جدید (اختیاری)' : 'رمز عبور'} hint="حداقل ۶ کاراکتر و شامل حداقل یک رقم">
        <input type="password" className={inputCls} value={password} onChange={e => setPassword(e.target.value)} />
      </Field>
      {error && <div className="text-danger-700 bg-danger-50 rounded-lg px-3 py-2 text-sm">{error}</div>}
      <div className="flex gap-2 justify-end pt-2">
        <button onClick={onCancel} className="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">انصراف</button>
        <button onClick={submit} disabled={busy} className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700 disabled:opacity-50">
          {busy ? 'در حال ساخت هش رمز…' : 'ذخیره'}
        </button>
      </div>
    </div>
  );
}

/** نشان وضعیت یک دعوت. */
function InviteStatusBadge({ status }) {
  const map = {
    pending: { tone: 'ok', label: 'در انتظار استفاده' },
    used: { tone: 'slate', label: 'استفاده‌شده' },
    expired: { tone: 'warn', label: 'منقضی‌شده' },
    revoked: { tone: 'danger', label: 'لغوشده' },
  };
  const m = map[status] || { tone: 'slate', label: status };
  return <Badge tone={m.tone}>{m.label}</Badge>;
}

/**
 * مدیریت لینک‌های دعوت: جایگزین امن‌تر برای دادنِ مستقیم API_KEY به کاربر
 * تازه. ادمین یک توکن یک‌بارمصرف می‌سازد؛ کاربر با بازکردن لینک، بدون دیدن
 * کلید، دستگاهش وصل می‌شود.
 */
function InviteManager() {
  const { data, notify, session } = useAppData();
  const [invites, setInvites] = useState([]);
  const [loading, setLoading] = useState(false);
  const [creating, setCreating] = useState(false);
  const [note, setNote] = useState('');
  const [newLink, setNewLink] = useState(null);
  const cfg = resolveCloudConfig(data.settings);
  const token = session && session.sessionToken;

  const refresh = async () => {
    if (!cfg.url) return;
    setLoading(true);
    try {
      const res = await signedCall(cfg.url, cfg.apiKey, 'invites.list', { sessionToken: token });
      if (res && res.ok) setInvites(res.invites || []);
    } catch (e) { /* بی‌صدا؛ کاربر با دکمه‌ی «به‌روزرسانی» دوباره تلاش می‌کند */ }
    setLoading(false);
  };

  useEffect(() => { refresh(); /* eslint-disable-line react-hooks/exhaustive-deps */ }, [cfg.url]);

  if (!cfg.url) {
    return (
      <div className="bg-white rounded-2xl border border-slate-200 p-4 text-sm text-slate-500">
        برای ساخت لینک دعوت، ابتدا باید از «تنظیمات» به پایگاه ابری وصل شوید.
      </div>
    );
  }

  const create = async () => {
    setCreating(true);
    setNewLink(null);
    try {
      const res = await signedCall(cfg.url, cfg.apiKey, 'invites.create', { note: note.trim(), sessionToken: token });
      if (!res || !res.ok) { notify('ساخت لینک دعوت ناموفق بود: ' + ((res && res.error) || ''), 'error'); }
      else {
        setNewLink({ link: buildInviteLink(cfg.url, res.token), expiresAt: res.expiresAt });
        setNote('');
        refresh();
      }
    } catch (e) { notify('ساخت لینک دعوت ناموفق بود: ' + e.message, 'error'); }
    setCreating(false);
  };

  const revoke = async (inv) => {
    try {
      const res = await signedCall(cfg.url, cfg.apiKey, 'invites.revoke', { id: inv.id, sessionToken: token });
      if (!res || !res.ok) { notify('لغو ناموفق بود: ' + ((res && res.error) || ''), 'error'); return; }
      notify('لینک دعوت لغو شد.', 'success');
      refresh();
    } catch (e) { notify('لغو ناموفق بود: ' + e.message, 'error'); }
  };

  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); notify('لینک کپی شد.', 'success'); }
    catch (e) { notify('کپی خودکار ممکن نشد؛ متن را دستی انتخاب کنید.', 'error'); }
  };

  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
      <div>
        <h3 className="font-bold text-slate-800 text-sm">دعوت با لینک (بدون اشتراک‌گذاری کلید API)</h3>
        <p className="text-xs text-slate-500 mt-1 leading-6">
          به‌جای دادن کلید API به هر کاربر، یک لینک یک‌بارمصرف بساز و برایش بفرست.
          بازکردن لینک، دستگاه او را خودکار وصل می‌کند؛ کلید هیچ‌وقت دیده نمی‌شود. لینک بعد از ۷۲ ساعت یا یک‌بار استفاده منقضی می‌شود.
        </p>
      </div>
      <div className="flex gap-2">
        <input className={inputCls} value={note} onChange={e => setNote(e.target.value)}
          placeholder="یادداشت (اختیاری) — مثلاً «برای علی، بازرس جدید»" />
        <button onClick={create} disabled={creating}
          className="px-4 rounded-xl bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white text-sm font-medium whitespace-nowrap">
          {creating ? 'در حال ساخت…' : '+ لینک دعوت تازه'}
        </button>
      </div>

      {newLink && (
        <div className="bg-brand-50 border border-brand-200 rounded-xl p-3 space-y-2">
          <p className="text-xs text-brand-800">لینک ساخته شد — همین حالا کپی و ارسال کن (بعداً کامل نمایش داده نمی‌شود):</p>
          <div className="flex gap-2">
            <input readOnly dir="ltr" value={newLink.link} className={inputCls + ' text-xs'} onFocus={e => e.target.select()} />
            <button onClick={() => copy(newLink.link)} className="px-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs whitespace-nowrap">کپی</button>
          </div>
          <p className="text-[11px] text-brand-700">انقضا: {new Date(newLink.expiresAt).toLocaleString('fa-IR')}</p>
        </div>
      )}

      <div className="border-t border-slate-100 pt-3">
        <div className="flex items-center justify-between mb-2">
          <p className="text-xs font-medium text-slate-600">دعوت‌های ساخته‌شده</p>
          <button onClick={refresh} className="text-xs text-brand-600 hover:underline">{loading ? 'در حال بارگذاری…' : 'به‌روزرسانی'}</button>
        </div>
        {invites.length === 0 ? (
          <p className="text-xs text-slate-400">هنوز لینک دعوتی ساخته نشده.</p>
        ) : (
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {invites.map(inv => (
              <div key={inv.id} className="flex items-center justify-between gap-2 text-xs bg-slate-50 rounded-lg px-2.5 py-2">
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <InviteStatusBadge status={inv.status} />
                    <span className="text-slate-500 truncate">{inv.note || 'بدون یادداشت'}</span>
                  </div>
                  <div className="text-[10px] text-slate-400 mt-0.5">
                    ساخته‌شده توسط {inv.createdBy} — {new Date(inv.createdAt).toLocaleString('fa-IR')}
                  </div>
                </div>
                {inv.status === 'pending' && (
                  <button onClick={() => revoke(inv)} className="text-danger-600 hover:bg-danger-50 rounded-lg px-2 py-1 whitespace-nowrap">لغو</button>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function UsersPage() {
  const { data, update, notify, session, perms } = useAppData();
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);

  // انتساب با شناسه‌ی کاربر سنجیده می‌شود، نه رشته‌ی نام؛ وگرنه تغییر نام
  // یا دو هم‌نام باعث می‌شد آمار اشتباه شود. نام فقط fallback داده‌ی قدیمی است.
  const dependents = (userId) => {
    const u = data.users.find(x => x.id === userId) || {};
    return data.records.filter(r => String(r.inspectorId || '') === String(userId)
      || (!r.inspectorId && r.inspectorName && r.inspectorName === u.name)).length;
  };

  const isSoleAdmin = (u) => u.role === 'admin' && data.users.filter(x => x.role === 'admin').length <= 1;

  if (!perms || !perms.isAdmin) return <NoAccess what="فقط نقش «ادمین» به مدیریت کاربران دسترسی دارد." />;

  const saveUser = async (u) => {
    if (editing) {
      const dup = data.users.some(x => x.username === u.username && x.id !== editing.id);
      if (dup) { notify('این نام کاربری قبلاً ثبت شده است.', 'error'); return; }
      if (isSoleAdmin(editing) && u.role !== 'admin') { notify('امکان تغییر نقش تنها ادمین سیستم وجود ندارد؛ ابتدا کاربر ادمین دیگری تعریف کنید.', 'error'); return; }
      update(d => { const idx = d.users.findIndex(x => x.id === editing.id); d.users[idx] = { ...d.users[idx], ...u }; });
    } else {
      const dup = data.users.some(x => x.username === u.username);
      if (dup) { notify('این نام کاربری قبلاً ثبت شده است.', 'error'); return; }
      update(d => { const t = Date.now(); d.users.push(Object.assign({ id: uid('u'), createdAt: t, updatedAt: t }, u)); });
    }
    setShowForm(false); setEditing(null);
    notify('کاربر ذخیره شد.', 'success');
  };

  const toggleActive = (u) => {
    if (u.id === session.userId) { notify('امکان تغییر وضعیت حساب کاربری جاری وجود ندارد.', 'error'); return; }
    if (isSoleAdmin(u) && u.active !== false) { notify('امکان غیرفعال‌سازی تنها ادمین سیستم وجود ندارد.', 'error'); return; }
    update(d => {
      const idx = d.users.findIndex(x => x.id === u.id);
      if (idx < 0) return;
      d.users[idx].active = d.users[idx].active === false;
      d.users[idx].sessionVersion = (Number(d.users[idx].sessionVersion) || 1) + 1;
      d.users[idx].updatedAt = Date.now();
    });
  };

  const deleteUser = (u) => {
    if (u.id === session.userId) { notify('امکان حذف حساب کاربری فعلی وجود ندارد.', 'error'); setConfirmDel(null); return; }
    if (isSoleAdmin(u)) { notify('امکان حذف تنها ادمین سیستم وجود ندارد.', 'error'); setConfirmDel(null); return; }
    update(d => { d.users = d.users.filter(x => x.id !== u.id); });
    setConfirmDel(null);
    notify('کاربر حذف شد.', 'success');
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-lg font-bold text-slate-800">مدیریت کاربران</h2>
          <p className="text-sm text-slate-500">تعریف نقش‌ها و دسترسی‌ها</p>
        </div>
        <button onClick={() => { setEditing(null); setShowForm(true); }} className="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">+ کاربر جدید</button>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr><th className="p-3 text-right">نام کاربری</th><th className="p-3 text-right">نام</th><th className="p-3 text-right">نقش</th><th className="p-3 text-right">وضعیت</th><th className="p-3 text-right">عملیات</th></tr>
          </thead>
          <tbody>
            {data.users.map(u => (
              <tr key={u.id} className="border-t border-slate-100">
                <td className="p-3" dir="ltr">{u.username}</td>
                <td className="p-3">{u.name}</td>
                <td className="p-3"><Badge tone="brand">{ROLE_LABELS[u.role]}</Badge></td>
                <td className="p-3">{u.active === false ? <Badge tone="slate">غیرفعال</Badge> : <Badge tone="ok">فعال</Badge>}</td>
                <td className="p-3 flex gap-1.5">
                  <button onClick={() => { setEditing(u); setShowForm(true); }} className="text-xs bg-slate-100 hover:bg-slate-200 rounded-lg px-2.5 py-1.5">ویرایش</button>
                  <button onClick={() => toggleActive(u)} className="text-xs bg-warn-50 text-warn-700 hover:bg-warn-500/20 rounded-lg px-2.5 py-1.5">{u.active === false ? 'فعال‌سازی' : 'غیرفعال‌سازی'}</button>
                  <button onClick={() => setConfirmDel(u)} className="text-xs bg-danger-50 text-danger-700 hover:bg-danger-100 rounded-lg px-2.5 py-1.5">حذف</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} title={editing ? 'ویرایش کاربر' : 'کاربر جدید'}>
        <UserForm initial={editing} onSave={saveUser} onCancel={() => setShowForm(false)} />
      </Modal>

      <InviteManager />

      <ConfirmDialog open={!!confirmDel} title="حذف کاربر" danger
        message={confirmDel ? `«${confirmDel.name}» دارای ${toPersianDigits(dependents(confirmDel.id))} سابقه بازرسی ثبت‌شده است. حذف کاربر، سوابق را حذف نمی‌کند اما امکان ورود او را از بین می‌برد. ادامه می‌دهید؟` : ''}
        onConfirm={() => deleteUser(confirmDel)} onCancel={() => setConfirmDel(null)} />
    </div>
  );
}

/* =====================================================================
   ۲. توابع کمکی عمومی
   ===================================================================== */

function responseJson(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function nowMs() { return new Date().getTime(); }

function toMs(v) {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return v;
  var n = Number(v);
  if (!isNaN(n) && n > 1000000000000) return n;      // epoch ms
  if (!isNaN(n) && n > 1000000000) return n * 1000;  // epoch s
  var t = Date.parse(String(v));
  return isNaN(t) ? 0 : t;
}

/* تبدیل مقدار فیلتر تاریخ به epoch ms (رفع ایراد P3-۱۵).

   \`toMs\` معمولی برای فیلترهای \`from\`/\`to\` کافی نیست: اگر فراخوان تاریخ شمسی
   بفرستد (که در این سامانه طبیعی‌ترین ورودی است)، \`Date.parse("1403/01/01")\`
   سال **۱۴۰۳ میلادی** را برمی‌گرداند — یعنی ۶۳۲ سال خطا. نتیجه‌اش این است که
   فیلتر یا همه‌چیز را برمی‌گرداند یا هیچ‌چیز را، بدون هیچ پیام خطایی.

   حالا رشته‌ی \`YYYY/MM/DD\` با سالِ بازه‌ی شمسی (۱۳۰۰ تا ۱۵۰۰) به‌درستی تبدیل
   می‌شود. \`endOfDay\` برای کرانِ بالای فیلتر (\`to\`) استفاده می‌شود تا «تا تاریخ
   فلان» واقعاً کل آن روز را شامل شود، نه فقط لحظه‌ی نیمه‌شبِ اولش. */
function toFilterMs_(v, endOfDay) {
  if (v === null || v === undefined || v === "") return 0;
  var s = String(v).trim();
  var m = s.match(/^(\\d{4})[\\/\\-.](\\d{1,2})[\\/\\-.](\\d{1,2})$/);
  if (m) {
    var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    var dateOnly = true;
    if (y >= 1300 && y <= 1500) {
      var g = jalaliToGregorian(y, mo, d);
      // ساعت محلی اسکریتپ (در مانیفست Asia/Tehran است) مبناست، نه UTC؛
      // وگرنه یک روز جابه‌جا می‌شد.
      var t = new Date(g[0], g[1] - 1, g[2], endOfDay ? 23 : 0, endOfDay ? 59 : 0,
        endOfDay ? 59 : 0, endOfDay ? 999 : 0).getTime();
      return isNaN(t) ? 0 : t;
    }
    var gms = new Date(y, mo - 1, d, endOfDay ? 23 : 0, endOfDay ? 59 : 0,
      endOfDay ? 59 : 0, endOfDay ? 999 : 0).getTime();
    void dateOnly;
    return isNaN(gms) ? 0 : gms;
  }
  return toMs(v);
}

function toBool(v) {
  if (typeof v === "boolean") return v;
  if (v === null || v === undefined) return false;
  var s = String(v).trim().toLowerCase();
  return s === "true" || s === "1" || s === "yes" || s === "بله";
}

function toNum(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v === null || v === undefined || v === "") return 0;
  var n = Number(String(v).replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); })
                           .replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); }));
  return isFinite(n) ? n : 0;
}

function safeJsonParse(text, fallback) {
  if (text === null || text === undefined || text === "") return fallback;
  if (typeof text === "object") return text;
  try { return JSON.parse(text); } catch (e) { return fallback; }
}

function cleanName(str, maxLen) {
  // نیم‌فاصله (U+200C) کاراکتر معتبر فارسی است و نباید حذف شود
  var s = String(str === null || str === undefined ? "" : str)
    .replace(/[\\\\/:*?"<>|\\r\\n\\t]/g, "_")
    .replace(/\\s+/g, " ")
    .trim();
  var limit = maxLen || 80;
  if (s.length > limit) s = s.slice(0, limit);
  return s || "بدون‌نام";
}

function sha256Hex(text) {
  var raw = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, String(text));
  return raw.map(function (b) { return ("0" + ((b < 0 ? b + 256 : b)).toString(16)).slice(-2); }).join("");
}

function hmacSha256Hex(secret, text) {
  var raw = Utilities.computeHmacSha256Signature(String(text), String(secret));
  return raw.map(function (b) { return ("0" + ((b < 0 ? b + 256 : b)).toString(16)).slice(-2); }).join("");
}

function constantTimeEquals(a, b) {
  a = String(a || ""); b = String(b || "");
  if (a.length !== b.length) return false;
  var diff = 0;
  for (var i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

/* --- تاریخ شمسی (فقط برای نام پوشه‌ها و ستون‌های نمایشی) ---
   ⚠️ این پیاده‌سازی دقیقاً همان الگوریتم jalaali (مبتنی بر breaks) است که سمت
   کلاینت استفاده می‌شود. الگوریتم کلاسیک قبلی در بعضی سال‌ها یک روز اختلاف
   داشت (مثلاً 2029-03-20 را 1407/01/01 می‌داد درحالی‌که 1408/01/01 است) و
   باعث می‌شد PDFها در پوشه‌ی ماه/سال اشتباه ذخیره شوند.                     */

var JALALI_BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

function jdiv(a, b) { return Math.trunc(a / b); }
function jmod(a, b) { return a - b * Math.floor(a / b); }

function jalCal(jy) {
  var breaks = JALALI_BREAKS;
  var bl = breaks.length, gy = jy + 621, leapJ = -14, jp = breaks[0], jm, jump = 0, leap, n, i;
  if (jy < jp || jy >= breaks[bl - 1]) throw new Error("سال شمسی خارج از بازه معتبر: " + jy);
  for (i = 1; i < bl; i += 1) {
    jm = breaks[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ += jdiv(jump, 33) * 8 + jdiv(jump % 33, 4);
    jp = jm;
  }
  n = jy - jp;
  leapJ += jdiv(n, 33) * 8 + jdiv((n % 33) + 3, 4);
  if ((jump % 33) === 4 && (jump - n) === 4) leapJ += 1;
  var leapG = jdiv(gy, 4) - jdiv((jdiv(gy, 100) + 1) * 3, 4) - 150;
  var march = 20 + leapJ - leapG;
  if ((jump - n) < 6) n = n - jump + jdiv(jump + 4, 33) * 33;
  leap = jmod(jmod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap: leap, gy: gy, march: march };
}

function g2d(gy, gm, gd) {
  var d = jdiv((gy + jdiv(gm - 8, 6) + 100100) * 1461, 4)
    + jdiv(153 * ((gm + 9) % 12) + 2, 5) + gd - 34840408;
  d = d - jdiv(jdiv(gy + 100100 + jdiv(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}

function d2g(jdn) {
  var j = 4 * jdn + 139361631;
  j = j + jdiv(jdiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  var i = jdiv((j % 1461), 4) * 5 + 308;
  var gd = jdiv(i % 153, 5) + 1;
  var gm = (jdiv(i, 153) % 12) + 1;
  var gy = jdiv(j, 1461) - 100100 + jdiv(8 - gm, 6);
  return [gy, gm, gd];
}

function jalaliToGregorian(jy, jm, jd) {
  var r = jalCal(jy);
  var jdn = g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jdiv(jm, 7) * (jm - 7) + jd - 1;
  return d2g(jdn);
}

function gregorianToJalali(gy, gm, gd) {
  var jdn = g2d(gy, gm, gd);
  var gy0 = d2g(jdn)[0];
  var jy = gy0 - 621;
  var r = jalCal(jy);
  var jdn1f = g2d(r.gy, 3, r.march);
  var k = jdn - jdn1f, jm, jd;
  if (k >= 0) {
    if (k <= 185) return { jy: jy, jm: 1 + jdiv(k, 31), jd: jmod(k, 31) + 1 };
    k -= 186;
  } else {
    jy -= 1;
    k += 179;
    if (r.leap === 1) k += 1;
  }
  jm = 7 + jdiv(k, 30);
  jd = jmod(k, 30) + 1;
  return { jy: jy, jm: jm, jd: jd };
}

/** سال کبیسه شمسی؟ (leap === 0 یعنی کبیسه) */
function isLeapJalaliYear(jy) {
  try { return jalCal(jy).leap === 0; } catch (e) { return false; }
}

function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalaliYear(jy) ? 30 : 29;
}

function pad2(n) { n = String(n); return n.length === 1 ? "0" + n : n; }

function jalaliOf(dateObj) {
  var d = (dateObj instanceof Date) ? dateObj : new Date(toMs(dateObj) || nowMs());
  if (isNaN(d.getTime())) d = new Date();
  try {
    return gregorianToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  } catch (e) {
    return { jy: d.getFullYear() - 621, jm: 1, jd: 1 }; // خارج از بازه‌ی معتبر تقویم
  }
}

function toJalaliDate(dateObj) {
  var j = jalaliOf(dateObj);
  return j.jy + "/" + pad2(j.jm) + "/" + pad2(j.jd);
}

function toJalaliDateTime(dateObj) {
  var d = (dateObj instanceof Date) ? dateObj : new Date(toMs(dateObj) || nowMs());
  return toJalaliDate(d) + " - " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function jalaliYear(dateObj) { return String(jalaliOf(dateObj).jy); }

function jalaliMonthFolder(dateObj) {
  var names = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
               "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
  var jm = jalaliOf(dateObj).jm;
  return pad2(jm) + "-" + names[jm - 1];
}

/* =====================================================================
   ۳. Properties و دسترسی به Spreadsheet پایگاه داده
   ===================================================================== */

function props() { return PropertiesService.getScriptProperties(); }

function prop(name, fallback) {
  var v = props().getProperty(name);
  return (v === null || v === undefined || v === "") ? fallback : v;
}

function rateLimitPerMinute() { return toNum(prop("RATE_LIMIT_PER_MINUTE", DEFAULT_RATE_LIMIT)) || DEFAULT_RATE_LIMIT; }

function rootFolderName(payload) {
  return String((payload && payload.folderName) || prop("ROOT_FOLDER_NAME", "سامانه چک‌لیست درکاو"));
}

/** یک کلید API تصادفی امن می‌سازد و در Script Properties ثبت می‌کند. */
function generateApiKey() {
  var key = "dk_" + Utilities.getUuid().replace(/-/g, "") + sha256Hex(String(Math.random()) + nowMs()).slice(0, 16);
  props().setProperty("API_KEY", key);
  Logger.log("کلید API ساخته و ثبت شد: " + key);
  return key;
}

/** Spreadsheet پایگاه داده را برمی‌گرداند و در نبود آن، می‌سازد. */
function getDb() {
  var id = prop("DB_SHEET_ID", "");
  var ss = null;
  if (id) {
    try { ss = SpreadsheetApp.openById(id); } catch (e) { ss = null; }
  }
  if (!ss) {
    ss = SpreadsheetApp.create("Darkav-DB");
    props().setProperty("DB_SHEET_ID", ss.getId());
    var file = DriveApp.getFileById(ss.getId());
    try {
      var root = getOrCreateFolder(DriveApp.getRootFolder(), prop("ROOT_FOLDER_NAME", "سامانه چک‌لیست درکاو"));
      root.addFile(file);
      DriveApp.getRootFolder().removeFile(file);
    } catch (eMove) { /* اگر جابه‌جایی نشد، فایل در ریشه می‌ماند */ }
  }
  ensureSheets(ss);
  return ss;
}

function ensureSheets(ss) {
  var needed = [];
  ENTITY_NAMES.forEach(function (k) { needed.push(SCHEMA[k].sheet); });
  needed = needed.concat(["_meta", "_ops", "_log", "invites"]);

  var existing = {};
  ss.getSheets().forEach(function (sh) { existing[sh.getName()] = sh; });

  needed.forEach(function (name) {
    var sh = existing[name];
    if (!sh) {
      sh = ss.insertSheet(name);
    }
    ensureHeader(sh, name, true);
  });

  // حذف شیت پیش‌فرض خالی که هنگام ساخت Spreadsheet ایجاد می‌شود
  try {
    var defaultSheet = ss.getSheetByName("Sheet1");
    if (defaultSheet && ss.getSheets().length > 1 && needed.indexOf("Sheet1") === -1) {
      ss.deleteSheet(defaultSheet);
    }
  } catch (eDel) {}
}

function headerFor(sheetName) {
  if (sheetName === "_meta") return ["key", "value", "updatedAt"];
  if (sheetName === "_ops") return ["opId", "clientId", "at", "entity", "entityId", "kind", "result", "detail"];
  if (sheetName === "_log") return ["at", "iso", "action", "actor", "clientId", "ok", "detail"];
  // شیت «invites»: عمداً هیچ‌جا در ENTITY_NAMES/db.pull نیست — چون هر ردیفش تا
  // قبل از مصرف، عملاً یک اعتبارنامه (bearer token) است و نباید مثل بقیه‌ی
  // جدول‌ها به‌طور کامل به هر دارنده‌ی API_KEY پخش شود.
