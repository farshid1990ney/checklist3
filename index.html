<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>سامانه چک‌لیست درکاو</title>

<!-- فونت وزیرمتن — غیرمسدودکننده.
     پیش‌تر این <link> معمولی بود، یعنی مرورگر تا دریافت پاسخ از
     fonts.googleapis.com هیچ چیزی رندر نمی‌کرد. در شبکه‌های کند (یا وقتی این
     دامنه در دسترس نیست) همین یک درخواست، شروع اپ را چند ثانیه عقب می‌انداخت.
     با media="print" شیوه‌نامه بدون مسدود کردن رندر دانلود می‌شود و در onload
     به media واقعی سوییچ می‌کند. <noscript> برای مرورگر بدون JS. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" /></noscript>

<!-- Tailwind (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: {
      extend: {
        fontFamily: { vazir: ['Vazirmatn', 'Tahoma', 'sans-serif'] },
        colors: {
          brand: {
            50: '#eef6ff', 100: '#d9eaff', 200: '#bcdaff', 300: '#8ec2ff',
            400: '#589fff', 500: '#2f7dfa', 600: '#1c5fe0', 700: '#1a4bb5',
            800: '#1c4092', 900: '#1c3775', 950: '#142250'
          },
          // مقیاس کامل: پیش‌تر فقط ۵۰/۵۰۰/۷۰۰ تعریف شده بود و کلاس‌هایی مثل
          // warn-200 یا danger-600 که در فایل استفاده می‌شدند، بی‌صدا هیچ رنگی
          // تولید نمی‌کردند (Tailwind برای رنگ ناشناخته کلاس نمی‌سازد).
          ok: {
            50:'#eefdf3', 100:'#d1fadf', 200:'#a6f4c5', 300:'#6ce9a6',
            400:'#32d583', 500:'#12b76a', 600:'#039855', 700:'#027a48',
            800:'#05603a', 900:'#054f31'
          },
          warn: {
            50:'#fffaeb', 100:'#fef0c7', 200:'#fedf89', 300:'#feca5b',
            400:'#fdb022', 500:'#f79009', 600:'#dc6803', 700:'#b54708',
            800:'#93370d', 900:'#7a2e0e'
          },
          danger: {
            50:'#fef3f2', 100:'#fee4e2', 200:'#fecdca', 300:'#fda29b',
            400:'#f97066', 500:'#f04438', 600:'#d92d20', 700:'#b42318',
            800:'#912018', 900:'#7a271a'
          }
        }
      }
    }
  };
</script>

  // نباید بلوک اضافه ساخته شود؛ فرمول ساده‌ی «یک بلوک بیشتر» در آن حالت غلط بود.

// می‌کند و دیگر «اولین کلید ارسالی» را خودکار ثبت نمی‌کند.
const DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9xqFyKsSQiO1ijQac6VvqVp4CYxD0cagZcZTTYpgx7afLAoY5qb6LKW5Cw8uGGj1Wwg/exec'; // آدرس عمومی است و مشکلی ندارد؛ کلید API عمداً اینجا نوشته نمی‌شود

// کلید API موقتاً در sessionStorage هم قابل نگهداری است (حالت «فقط این نشست»)
const SESSION_API_KEY = 'derkav_cloud_api_key_session';

/* @core-start: cloudconfig */
function resolveCloudConfig(settings) {
  const s = settings || {};
  let sessionKey = '';
  try { sessionKey = String(sessionStorage.getItem(SESSION_API_KEY) || ''); } catch (e) { sessionKey = ''; }
  return {
    url: String((s.googleAppsScriptUrl || DEFAULT_APPS_SCRIPT_URL) || '').trim(),
    apiKey: String(s.cloudApiKey || sessionKey || '').trim(),
    syncConnectionSettings: !!s.syncConnectionSettings,
  };
}

/** فیلدهایی از settings که بین دستگاه‌ها همگام می‌شوند (آدرس/کلید اتصال به‌طور پیش‌فرض نه) */
function pickSyncableSettings(settings, includeConnection) {
  const s = settings || {};
  const out = {
    orgName: s.orgName || '',
    passThreshold: Number(s.passThreshold) || 80,
    // حالت جریان امضا باید بین دستگاه‌ها یکی باشد، وگرنه یک بازرس زنجیره می‌سازد
    // و بازرس دیگر برگه‌ی تک‌امضا ثبت می‌کند.
    signFlowMode: s.signFlowMode === 'single' ? 'single' : 'chain',
    managerPinHash: s.managerPinHash || '',
    managerPinSalt: s.managerPinSalt || '',
    managerPinHashAlgo: s.managerPinHashAlgo || '',
    managerPinIterations: Number(s.managerPinIterations) || 0,
  };
  if (includeConnection) {
    out.googleAppsScriptUrl = s.googleAppsScriptUrl || '';
    out.cloudApiKey = s.cloudApiKey || '';
  }
  return out;
}
/* @core-end: cloudconfig */

// نشانه‌ی «هرچی جز کاربران/سوابق» که قرار است از یک ریست کامل جان سالم به‌در ببرد:
// آدرس Apps Script و کلید API. بدون این، هر بار که کاربر مجبور به «پاک‌کردن
// داده‌ی محلی و شروع تازه» می‌شد (مثلاً برای رفع یک خطای بارگذاری)، این دو مقدار
// هم پاک می‌شدند و کاربر مجبور بود از نو تایپ‌شان کند — دقیقاً همان مشکلی که
// گزارش شده بود («هر بار App Script و API می‌خواهد»).
const CLOUD_RESCUE_KEY = 'derkav_cloud_rescue_v1';

// نسخه‌ی پشتیبان دائمی اتصال ابری (آدرس + کلید API) — «derkav_cloud_config_v1»
// در هر ذخیره‌سازی موفق نوشته می‌شود و هرگز خودکار پاک نمی‌شود؛ بنابراین اگر
// داده‌ی اصلی (IndexedDB/localStorage) خراب یا ریست شود، اتصال بدون تایپ دوباره
// بازیابی می‌شود و دیگر پیام «App Script و API هر بار» تکرار نمی‌گردد.
const CLOUD_CONFIG_BACKUP_KEY = 'derkav_cloud_config_v1';

/** نوشتن پشتیبان اتصال (فقط وقتی حداقل یکی از مقادیر موجود است) */
function backupConnectionConfig_(data) {
  try {
    const s = data && data.settings;
    if (!s) return;
    const u = String(s.googleAppsScriptUrl || '').trim();
    const k = String(s.cloudApiKey || '').trim();
    if (!u && !k) return;
    localStorage.setItem(CLOUD_CONFIG_BACKUP_KEY, JSON.stringify({
      googleAppsScriptUrl: u,
      cloudApiKey: k,
      cloudFolderName: String(s.cloudFolderName || ''),
    }));
  } catch (e) { /* حافظه در دسترس نیست؛ مشکلی برای ادامه نیست */ }
}

/** بازیابی اتصال از پشتیبان — فقط فیلدهای خالی را پر می‌کند و پشتیبان را حذف نمی‌کند */
function restoreConnectionConfig_(settings) {
  try {
    if (!settings || typeof settings !== 'object') return settings;
    const b = JSON.parse(localStorage.getItem(CLOUD_CONFIG_BACKUP_KEY) || 'null');
    if (!b) return settings;
    if (!String(settings.googleAppsScriptUrl || '').trim() && b.googleAppsScriptUrl) settings.googleAppsScriptUrl = b.googleAppsScriptUrl;
    if (!String(settings.cloudApiKey || '').trim() && b.cloudApiKey) settings.cloudApiKey = b.cloudApiKey;
    if (!String(settings.cloudFolderName || '').trim() && b.cloudFolderName) settings.cloudFolderName = b.cloudFolderName;
  } catch (e) { /* پشتیبان خراب بود؛ بی‌خیال */ }
  return settings;
}

      if (rescue.cloudFolderName) out.settings.cloudFolderName = rescue.cloudFolderName;
      localStorage.removeItem(CLOUD_RESCUE_KEY);

  // بازیابی از پشتیبان دائمی اتصال (کلید پشتیبان حذف نمی‌شود و می‌ماند)

/** خواندن داده‌ی محلی: اول IndexedDB، بعد localStorage (شامل کلید قدیمی v3) */
async function loadRawData() {
  try {
    const fromIdb = await idbGet('kv', 'data');
    if (fromIdb && typeof fromIdb === 'object') return fromIdb;
  } catch (e) { /* IndexedDB در دسترس نیست؛ به localStorage می‌افتیم */ }
  const keys = [STORAGE_KEY, LEGACY_STORAGE_KEY];
  for (const k of keys) {
    try {
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') return parsed;
    } catch (e) {
      console.error('خطا در خواندن داده‌های ذخیره‌شده (' + k + ')', e);
    }
  }
  return null;
}

let saveTimer = null;
let quotaErrorHandler = null;
/** ثبت هندلر خطای پرشدن فضای ذخیره‌سازی — باید به کاربر اطلاع داده شود (رفع ایراد ۴-۷) */
function setStorageErrorHandler(fn) { quotaErrorHandler = fn; }

/**
 * ذخیره‌سازی محلی: منبع اصلی IndexedDB است (ظرفیت بسیار بیشتر از localStorage
 * و مناسب برای تصویر امضاها) و localStorage فقط به‌عنوان نسخه پشتیبان/سازگاری
 * با نسخه‌های قدیمی نگه داشته می‌شود.
 */
/* بالاتر از این اندازه، آینه‌ی localStorage ساخته نمی‌شود.
   چرا: localStorage فقط یک fallback برای مرورگری است که IndexedDB ندارد، ولی
   `JSON.stringify` روی کل پایگاه + نوشتن **همگام** آن، رشته‌ی اصلی مرورگر را
   قفل می‌کند. با چند هزار سابقه (به‌ویژه وقتی امضا inline باشد) این یعنی چند صد
   میلی‌ثانیه لگ روی هر تغییر. سقف ۲ مگابایت هم عملاً نزدیک سقف خود localStorage
   (۵ مگابایت) است، پس چیزی از دست نمی‌رود که قبلاً جا می‌شد. */
const LS_MIRROR_MAX_BYTES = 2 * 1024 * 1024;

function persistData(data) {
  clearTimeout(saveTimer);
  // ۱۵۰ms خیلی کوتاه بود: تایپ در یک فیلد یعنی یک نوشتن کامل پایگاه به ازای هر
  // چند کاراکتر. ۶۰۰ms هنوز آن‌قدر کوتاه هست که با بستن ناگهانی تب داده نپرد
  // (مسیر `pagehide` هم جداگانه beacon می‌فرستد).
  saveTimer = setTimeout(async () => {
    let idbFailed = false;
    try {
      await idbSet('kv', 'data', data);
    } catch (e) {
      idbFailed = true;
      console.error('خطا در ذخیره‌سازی در IndexedDB', e);
    }

    let json = null;
    try {
      json = JSON.stringify(data);
    } catch (e) {
      console.error('سریال‌سازی داده ناموفق بود', e);
      return;
    }

    if (!idbFailed && json.length > LS_MIRROR_MAX_BYTES) {
      // آینه را عمداً حذف می‌کنیم تا نسخه‌ی کهنه‌ی کوچک‌تر جا نماند و روزی
      // به‌عنوان «داده‌ی معتبر» خوانده نشود.
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      backupConnectionConfig_(data);
      return;
    }

    backupConnectionConfig_(data);
    try {
      localStorage.setItem(STORAGE_KEY, json);
    } catch (e) {
      console.error('خطا در ذخیره‌سازی در localStorage', e);
      if (quotaErrorHandler) {
        quotaErrorHandler(idbFailed
          ? 'فضای ذخیره‌سازی این مرورگر پر شده است؛ تغییرات فقط در ابر نگهداری می‌شود.'
          : 'فضای localStorage پر است؛ داده‌ها در IndexedDB ذخیره می‌شوند (اشکالی ندارد).');
      }
    }
  }, 600); // جلوگیری از رقابت (race condition) نوشتن‌های پیاپی
}

/* @core-start: migrate */
function migrateData(data) {
  // رفع ایراد ۴-۱۰: ورودی null/نامعتبر دیگر باعث کرش نمی‌شود
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null;

  const d = data;
  d.version = APP_VERSION;
  ['users', 'categories', 'templates', 'assets', 'assignments', 'records', 'correctives'].forEach(k => {
    if (!Array.isArray(d[k])) d[k] = [];
  });
  if (!d.settings || typeof d.settings !== 'object') d.settings = {};
  const s = d.settings;
  if (s.passThreshold === undefined || s.passThreshold === null || s.passThreshold === '') s.passThreshold = 80;
  // پیش‌فرض مدل ب. داده‌ی نسخه‌های قبلی این کلید را ندارد و صریح ست می‌شود تا
  // «نداشتن مقدار» با «انتخاب کاربر» اشتباه گرفته نشود.
  if (s.signFlowMode !== 'single' && s.signFlowMode !== 'chain') s.signFlowMode = 'chain';
  if (s.googleAppsScriptUrl === undefined) s.googleAppsScriptUrl = '';
  if (s.googleClientId === undefined) s.googleClientId = '';
  if (s.cloudApiKey === undefined) s.cloudApiKey = '';
  if (s.managerPinSalt === undefined) s.managerPinSalt = '';
  if (s.managerPinHashAlgo === undefined) s.managerPinHashAlgo = s.managerPinHash ? 'sha256' : '';
  if (s.managerPinIterations === undefined) s.managerPinIterations = 0;
  if (s.syncConnectionSettings === undefined) s.syncConnectionSettings = false;
  if (!s.googleAppsScriptUrl && DEFAULT_APPS_SCRIPT_URL) s.googleAppsScriptUrl = DEFAULT_APPS_SCRIPT_URL;

  // سازگاری کاربران قدیمی: تضمین وجود حداقل یک ادمین و فیلدهای امنیتی
  if (d.users.length && !d.users.some(u => u && u.role === 'admin')) {
    const target = d.users.find(u => u && u.username === 'admin') || d.users.find(u => u && u.role === 'manager') || d.users[0];
    if (target) target.role = 'admin';
  }
  d.users.forEach(u => {
    if (!u || typeof u !== 'object') return;
    if (!u.id) u.id = uid('u');
    if (!Array.isArray(u.pages)) u.pages = typeof u.pages === 'string' ? String(u.pages).split(',').filter(Boolean) : [];
    if (u.active === undefined) u.active = true;
    if (!u.hashAlgo) u.hashAlgo = u.passwordHash ? 'sha256' : '';
    if (u.salt === undefined) u.salt = '';
    if (u.iterations === undefined) u.iterations = 0;
    if (u.sessionVersion === undefined) u.sessionVersion = 1;
    if (u.phone === undefined) u.phone = '';
    if (u.nationalId === undefined) u.nationalId = '';
  });

  // حذف رکوردهای بدون شناسه و تضمین فیلدهای همگام‌سازی
  const stamp = Date.now();
  ['users', 'templates', 'assets', 'assignments', 'records'].forEach(coll => {
    d[coll] = d[coll].filter(x => x && typeof x === 'object');
    d[coll].forEach(x => {
      if (!x.id) x.id = uid(coll.slice(0, 3));
      if (!x.updatedAt) x.updatedAt = x.createdAt ? Date.parse(x.createdAt) || stamp : stamp;
    });
  });
  d.templates.forEach(t => {
    if (!Array.isArray(t.items)) t.items = [];
    // تعداد امضاکنندگان هر چک‌لیست: فقط ۱/۲/۳ معتبر است؛ مقدار نامعتبر حذف
    // می‌شود تا قالب به پیش‌فرض سازمان (جریان امضا) برگردد.
    const n = Number(t.signers);
    if (n === 1 || n === 2 || n === 3) t.signers = n; else delete t.signers;
    // دوره‌ی بازرسی: مقدار نامعتبر/قدیمی → ماهانه (پیش‌فرض محصول)
    if (!INSPECTION_PERIODS[t.period]) t.period = INSPECTION_PERIODS.monthly;
  });
  d.records.forEach(r => {
    if (!Array.isArray(r.details)) r.details = [];
    // پیوست‌های عکس: رکوردهای قدیمی فیلد ندارند؛ مقدار نامعتبر هم حذف می‌شود
    if (!Array.isArray(r.photos)) r.photos = [];
    else r.photos = r.photos.filter(ph => ph && typeof ph === 'object');
    // «جهت امضا»: رکوردهای قدیمی این فیلد را ندارند. مقدار نامعتبر/ناقص هم
    // حذف می‌شود تا در UI به‌صورت «بدون درخواست» دیده شود، نه یک صف خراب.
    if (r.signRequest !== undefined) {
      const sr = normalizeSignRequest(r.signRequest);
      if (sr) r.signRequest = sr; else delete r.signRequest;
    }
  });

  // اقدام‌های اصلاحی: وضعیت نامعتبر → باز؛ تضمین فیلدهای پایه
  d.correctives = d.correctives.filter(c => c && typeof c === 'object');
  d.correctives.forEach(c => {
    if (c.status !== 'open' && c.status !== 'inprogress' && c.status !== 'closed') c.status = 'open';
    if (!c.note) c.note = '';
  });

  // دسته‌بندی‌ها فقط رشته هستند
  d.categories = d.categories
    .map(c => (typeof c === 'string' ? c : (c && c.name) || ''))
    .map(c => String(c).trim()).filter(Boolean);

  if (d.revision === undefined) d.revision = 0;
  if (d.lastSyncAt === undefined) d.lastSyncAt = 0;
  return d;
}
/* @core-end: migrate */

function validateBackupShape(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return 'فایل پشتیبان نامعتبر است.';
  const required = ['users', 'assets', 'templates', 'records', 'settings'];
  for (const k of required) {
    if (!(k in data)) return `فیلد «${k}» در فایل پشتیبان یافت نشد.`;
  }
  if (!Array.isArray(data.users) || !Array.isArray(data.assets) || !Array.isArray(data.templates) || !Array.isArray(data.records)) {
    return 'ساختار آرایه‌ای فایل پشتیبان معتبر نیست.';
  }
  return null;
}

/* ============================================================
   ۲.۵ لایه IndexedDB و موتور همگام‌سازی عملیاتی (offline-first)
   ============================================================ */
/* ---------------------------------------------------------------------------
   بارگذاری تنبل (lazy) کتابخانه‌های سنگین

   سه کتابخانه مجموعاً ~۲٫۱ مگابایت هستند ولی هر کدام فقط در یک قابلیت استفاده
   می‌شوند (خروجی PDF، خروجی اکسل، اسکن بارکد). پیش‌تر هر سه در بار اولیه
   دانلود می‌شدند؛ حالا فقط وقتی کاربر آن قابلیت را بزند لود می‌شوند.
   هر کتابخانه دو منبع دارد (unpkg و jsdelivr) تا اگر یکی فیلتر/قطعه بود،
   دومی جواب بدهد.
   --------------------------------------------------------------------------- */
/* ⚠️ «?v=2» عمداً اضافه شده: دستگاه برخی کاربران باندل قدیمیِ این کتابخانه‌ها
   را کش کرده بود (Producer: jsPDF 2.3.1 به‌جای 2.5.1 در خروجی PDF) و چون URL
   یکی بود، هرگز به‌روز نمی‌شد → PDF خالی/خراب. تغییر URL کش را باطل می‌کند.
   اولویت هم به jsdelivr داده شد (پایدارتر برای کاربر ایرانی). */
const LIB_SOURCES = {
  html2pdf: {
    global: 'html2pdf',
    urls: [
      'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js?v=2',
      'https://unpkg.com/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js?v=2',
    ],
  },
  xlsx: {
    global: 'XLSX',
    urls: [
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js?v=2',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js?v=2',
    ],
  },
  html5qrcode: {
    global: 'Html5Qrcode',
    urls: [
      'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js?v=2',
      'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js?v=2',
    ],
  },
};
const _libLoading = new Map();

/** کتابخانه را در صورت نیاز لود می‌کند و global آن را برمی‌گرداند. */
function ensureLib(name) {
  const spec = LIB_SOURCES[name];
  if (!spec) return Promise.reject(new Error('کتابخانه‌ی ناشناخته: ' + name));
  if (typeof window !== 'undefined' && window[spec.global]) return Promise.resolve(window[spec.global]);
  if (_libLoading.has(name)) return _libLoading.get(name);

  const p = (async () => {
    let lastErr = null;
    for (const url of spec.urls) {
      try {
        await new Promise((resolve, reject) => {
          const el = document.createElement('script');
          el.src = url;
          el.async = true;
          el.onload = () => resolve();
          el.onerror = () => { el.remove(); reject(new Error('بارگذاری ناموفق: ' + url)); };
          document.head.appendChild(el);
        });
        if (window[spec.global]) return window[spec.global];
        lastErr = new Error('کتابخانه بار شد ولی ' + spec.global + ' تعریف نشد');
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('هیچ منبعی برای ' + name + ' تعریف نشده است');
  })();

  _libLoading.set(name, p);
  // اگر شکست خورد، کش را پاک کن تا تلاش بعدی دوباره سعی کند (نه اینکه برای
  // همیشه همان promise ردشده برگردد).
  p.catch(() => { if (_libLoading.get(name) === p) _libLoading.delete(name); });
  return p;
}

const IDB_NAME = 'darkav_sync_v1';
const IDB_VERSION = 1;
const CLIENT_ID_KEY = 'derkav_client_id';
let idbPromise = null;

function idb() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') { reject(new Error('IndexedDB در دسترس نیست')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('ops')) db.createObjectStore('ops', { keyPath: 'opId' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('بازکردن IndexedDB ناموفق بود'));
    req.onblocked = () => reject(new Error('IndexedDB توسط زبانه‌ی دیگری قفل شده است'));
  });
  return idbPromise;
}

function idbRun(storeName, mode, fn) {
  return idb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    let result;
    try { result = fn(store); } catch (e) { reject(e); return; }
    // رفع باگ: fn همیشه یک Promise (از wrapReq) برمی‌گرداند، پس «result» در لحظه‌ی
    // اجرای این خط هرگز مقدار نهایی نیست و result.__value همیشه undefined است —
    // یعنی شرط زیر همیشه شاخه‌ی «else» را می‌گرفت و کل شیء Promise/بسته‌شده
    // (نه مقدار واقعی‌اش) resolve می‌شد. طبق مشخصات IndexedDB، رویداد success
    // درخواست همیشه پیش از رویداد complete تراکنش شلیک می‌شود، پس همین‌جا با
    // then گرفتن از result، مقدار واقعی (و بازشده از {__value:...}) را می‌گیریم.
    let unwrapped, gotError, errVal;
    Promise.resolve(result).then(
      v => { unwrapped = (v && v.__value !== undefined) ? v.__value : v; },
      e => { gotError = true; errVal = e; }
    );
    tx.oncomplete = () => { if (gotError) reject(errVal); else resolve(unwrapped); };
    tx.onerror = () => reject(tx.error || new Error('خطای IndexedDB'));
    tx.onabort = () => reject(tx.error || new Error('عملیات IndexedDB لغو شد'));
  }));
}

function wrapReq(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve({ __value: req.result });
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(storeName, key) {
  try { return await idbRun(storeName, 'readonly', st => wrapReq(st.get(key))); } catch (e) { return undefined; }
}
async function idbSet(storeName, key, value) {
  return idbRun(storeName, 'readwrite', st => wrapReq(st.put(value, key)));
}
async function idbDel(storeName, key) {
  return idbRun(storeName, 'readwrite', st => wrapReq(st.delete(key)));
}
async function idbAll(storeName) {
  try { return (await idbRun(storeName, 'readonly', st => wrapReq(st.getAll()))) || []; } catch (e) { return []; }
}
/* --- صف عملیات (pending ops) --- */
let opSeq = Date.now();
async function opsAll() {
  const all = await idbAll('ops');
  return all.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
}
async function opsAdd(list) {
  if (!list || !list.length) return;
  for (const op of list) {
    if (!op.seq) op.seq = ++opSeq;
    try { await idbRun('ops', 'readwrite', st => wrapReq(st.put(op))); } catch (e) { /* اگر IDB نبود، فقط در حافظه می‌ماند */ }
  }
}
async function opsRemove(opIds) {
  if (!opIds || !opIds.length) return;
  for (const id of opIds) {
    try { await idbRun('ops', 'readwrite', st => wrapReq(st.delete(id))); } catch (e) {}
  }
}
async function opsClear() {
  try { await idbRun('ops', 'readwrite', st => wrapReq(st.clear())); } catch (e) {}
}

function getClientId() {
  try {
    let id = localStorage.getItem(CLIENT_ID_KEY);
    if (!id) { id = uid('client'); localStorage.setItem(CLIENT_ID_KEY, id); }
    return id;
  } catch (e) { return 'client-' + randomHex(6); }
}
const CLIENT_ID = getClientId();

/* @core-start: sync */
const SYNC_COLLECTIONS = ['users', 'templates', 'assets', 'assignments', 'records', 'correctives'];
// این فیلدها فقط متادیتای همگام‌سازی هستند و در تشخیص تغییر نادیده گرفته می‌شوند
// syncedAt ساعت سرور است و فقط برای delta sync به کار می‌رود، نه مقایسه محتوایی
const SYNC_META_FIELDS = ['updatedAt', 'createdAt', 'syncedAt', 'deleted'];
const MAX_OP_TRIES = 6;

function stableStringify(value) {
  if (value === null || typeof value !== 'object') return JSON.stringify(value === undefined ? null : value);
  if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';
  const keys = Object.keys(value).filter(k => value[k] !== undefined).sort();
  return '{' + keys.map(k => JSON.stringify(k) + ':' + stableStringify(value[k])).join(',') + '}';
}

/** مقایسه دو موجودیت بدون درنظرگرفتن متادیتای همگام‌سازی */
function sameEntity(a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  const ka = Object.keys(a).filter(k => SYNC_META_FIELDS.indexOf(k) === -1 && a[k] !== undefined);
  const kb = Object.keys(b).filter(k => SYNC_META_FIELDS.indexOf(k) === -1 && b[k] !== undefined);
  if (ka.length !== kb.length) return false;
  for (const k of ka) {
    if (kb.indexOf(k) === -1) return false;
    const va = a[k], vb = b[k];
    if (va === vb) continue;
    if (typeof va === 'object' && typeof vb === 'object') {
      if (stableStringify(va) !== stableStringify(vb)) return false;
    } else if (String(va) !== String(vb)) return false;
  }
  return true;
}

/** از روی patchهای immer، مجموعه‌های دست‌خورده را پیدا می‌کند */
function collectTouchedCollections(patches) {
  const touched = new Set();
  (patches || []).forEach(p => {
    const path = (p && p.path) || [];
    if (!path.length) return;
    touched.add(String(path[0]));
  });
  return touched;
}

/**
 * تبدیل تغییرات محلی به فهرست عملیات (op). این همان لایه‌ی event-sourcing سبک
 * است که باعث می‌شود به‌جای بازنویسی کل پایگاه، فقط رکوردهای تغییرکرده ارسال
 * شوند (رفع ایراد ۱-۱).
 */
function diffState(prev, next, touched, syncConnectionSettings) {
  const ops = [];
  const at = Date.now();
  const scopes = touched && touched.size ? touched : new Set(SYNC_COLLECTIONS.concat(['categories', 'settings']));

  if (scopes.has('settings')) {
    const a = stableStringify(pickSyncableSettings((prev || {}).settings, syncConnectionSettings));
    const b = stableStringify(pickSyncableSettings((next || {}).settings, syncConnectionSettings));
    if (a !== b) {
      ops.push({ opId: uid('op'), clientId: CLIENT_ID, entity: 'settings', kind: 'set', at,
        data: pickSyncableSettings(next.settings, syncConnectionSettings) });
    }
  }

  if (scopes.has('categories')) {
    const a = JSON.stringify((prev || {}).categories || []);
    const b = JSON.stringify((next || {}).categories || []);
    if (a !== b) {
      ops.push({ opId: uid('op'), clientId: CLIENT_ID, entity: 'categories', kind: 'set', at,
        data: ((next || {}).categories || []).slice() });
    }
  }

  SYNC_COLLECTIONS.forEach(coll => {
    if (!scopes.has(coll)) return;
    const before = new Map(((prev || {})[coll] || []).filter(x => x && x.id).map(o => [String(o.id), o]));
    const after = ((next || {})[coll] || []).filter(x => x && x.id);
    const seen = new Set();
    after.forEach(obj => {
      const id = String(obj.id);
      seen.add(id);
      const old = before.get(id);
      if (!old || !sameEntity(old, obj)) {
        const data = Object.assign({}, obj);
        delete data.deleted;
        data.updatedAt = at;
        ops.push({ opId: uid('op'), clientId: CLIENT_ID, entity: coll, kind: 'upsert', at, id, data });
      }
    });
    before.forEach((obj, id) => {
      if (seen.has(id)) return;
      ops.push({ opId: uid('op'), clientId: CLIENT_ID, entity: coll, kind: 'delete', at, id });
    });
  });

  return ops;
}

/** ردیف سرور → شکل مورد انتظار کلاینت */
function normalizeEntity(coll, row) {
  const r = Object.assign({}, row);
  if (coll === 'users') {
    if (typeof r.pages === 'string') r.pages = r.pages.split(',').map(x => x.trim()).filter(Boolean);
    if (!Array.isArray(r.pages)) r.pages = [];
    r.active = !(r.active === false || r.active === 'false' || r.active === 0);
  }
  if (coll === 'templates') {
    if (!Array.isArray(r.items)) r.items = [];
    r.archived = !(r.archived === false || r.archived === 'false' || !r.archived);
  }
  if (coll === 'records') {
    if (r.details !== undefined && r.details !== null && !Array.isArray(r.details)) r.details = [];
    // سرور فقط dateJalali را نگه می‌دارد؛ اکثر نمایش‌های برنامه فیلد date را
    // می‌خواهند — بدون این، سوابق رسیده از دستگاه دیگر «تاریخ خالی» داشتند.
    if (!r.date && r.dateJalali) r.date = r.dateJalali;
    // ستون signRequest در شیت از نوع JSON است و وقتی خالی باشد null می‌آید؛
    // null را حذف می‌کنیم تا sameEntity آن را «تغییر» حساب نکند.
    if (r.signRequest === null || r.signRequest === undefined) delete r.signRequest;
  }
  if (r.deleted === false || r.deleted === undefined) delete r.deleted;
  delete r.syncedAt; // متادیتای سمت سرور؛ در داده محلی نگه داشته نمی‌شود
  Object.keys(r).forEach(k => { if (r[k] === undefined) delete r[k]; });
  return r;
}

/**
 * ادغام داده‌ی دریافتی از سرور با داده‌ی محلی.
 * سیاست: Last-Write-Wins در سطح «هر موجودیت» با مقایسه updatedAt — نه کل پایگاه.
 */
function mergeRemote(local, remote) {
  const out = Object.assign({}, local);
  const stats = { added: 0, updated: 0, removed: 0, skipped: 0 };
  const entities = (remote && remote.entities) || {};

  SYNC_COLLECTIONS.forEach(coll => {
    const rows = entities[coll] || [];
    if (!rows.length) return;
    const map = new Map((out[coll] || []).filter(x => x && x.id).map(o => [String(o.id), o]));
    rows.forEach(row => {
      if (!row || !row.id) return;
      const id = String(row.id);
      if (row.deleted) { if (map.delete(id)) stats.removed++; return; }
      const norm = normalizeEntity(coll, row);
      const cur = map.get(id);
      if (!cur) { map.set(id, norm); stats.added++; return; }
      const curAt = Number(cur.updatedAt) || 0;
      const rowAt = Number(row.updatedAt) || 0;
      if (rowAt >= curAt) { map.set(id, Object.assign({}, cur, norm)); stats.updated++; }
      else stats.skipped++;
    });
    let arr = Array.from(map.values());
    if (coll === 'records') {
      arr.sort((a, b) => {
        const ta = Date.parse(a.completedAt || a.date || '') || Number(a.updatedAt) || 0;
        const tb = Date.parse(b.completedAt || b.date || '') || Number(b.updatedAt) || 0;
        return tb - ta;
      });
    }
    out[coll] = arr;
  });

  // دسته‌بندی‌ها: حذف موارد tombstone و افزودن موارد جدید (بدون از دست دادن موارد محلی)
  const catRows = entities.categories || [];
  if (catRows.length) {
    // ستون `order` روی سرور وجود دارد ولی پیش‌تر نادیده گرفته می‌شد: دسته‌ی جدید
    // همیشه به انتها چسبانده می‌شد، پس اگر کاربری ترتیب دسته‌ها را روی دستگاه
    // دیگری عوض می‌کرد، این دستگاه هرگز ترتیب جدید را نمی‌گرفت (ایراد P2-۶).
    let cats = (out.categories || []).slice();
    const orderOf = new Map();
    catRows.forEach(row => {
      if (!row || !row.name) return;
      const idx = cats.indexOf(row.name);
      if (row.deleted) { if (idx > -1) cats.splice(idx, 1); return; }
      if (idx === -1) cats.push(row.name);
      const o = Number(row.order);
      if (Number.isFinite(o)) orderOf.set(row.name, o);
    });
    // بازچینی فقط وقتی امن است که برای همه‌ی دسته‌های موجود «order» داشته باشیم؛
    // در pull افزایشی ممکن است فقط بخشی از ردیف‌ها برگردد و بازچینی ناقص،
    // ترتیب را به‌هم بریزد. در آن حالت ترتیب فعلی حفظ می‌شود.
    const live = catRows.filter(r => r && r.name && !r.deleted);
    const complete = cats.length > 0 && cats.every(n => orderOf.has(n));
    if (complete && (remote.full || orderOf.size >= cats.length)) {
      cats.sort((a, b) => (orderOf.get(a) - orderOf.get(b)) || String(a).localeCompare(String(b), 'fa'));
    }
    void live;
    out.categories = cats;
  }

  if (remote.settings) {
    out.settings = mergeSettings(out.settings || {}, remote.settings, !!(local.settings || {}).syncConnectionSettings);
  }

  out.revision = Number(remote.revision) || Number(out.revision) || 0;
  out.lastSyncAt = Number(remote.serverTime) || Date.now();
  return { data: out, stats };
}

function mergeSettings(local, remote, includeConnection) {
  const s = Object.assign({}, local);
  const r = remote || {};
  if (r.orgName !== undefined && r.orgName !== '') s.orgName = r.orgName;
  if (Number(r.passThreshold) > 0) s.passThreshold = Number(r.passThreshold);
  if (r.signFlowMode === 'single' || r.signFlowMode === 'chain') s.signFlowMode = r.signFlowMode;
  if (r.managerPinHash && !s.managerPinHash) {
    s.managerPinHash = r.managerPinHash;
    s.managerPinSalt = r.managerPinSalt || '';
    s.managerPinHashAlgo = r.managerPinHashAlgo || r.managerPinAlgo || '';
    s.managerPinIterations = Number(r.managerPinIterations) || 0;
  }
  if (includeConnection) {
    if (r.googleAppsScriptUrl) s.googleAppsScriptUrl = r.googleAppsScriptUrl;
    if (r.cloudApiKey) s.cloudApiKey = r.cloudApiKey;
  }
  return s;
}

/** snapshot کامل سرور (entities) → ساختار داده‌ی محلی برنامه */
function snapshotToLocal(remote, base) {
  const seed = base ? Object.assign({}, base) : {
    version: APP_VERSION, users: [], categories: [], templates: [], assets: [],
    assignments: [], records: [], settings: {}, revision: 0, lastSyncAt: 0,
  };
  const merged = mergeRemote(seed, remote);
  return migrateData(merged.data);
}

/* ============================================================
   ۳. موتور امتیازدهی چک‌لیست
   ============================================================ */
/* @core-start: scoring */
function scoreRecord(template, answers) {
  let earned = 0, totalWeight = 0, criticalFail = false;
  const details = [];
  (template.items || []).forEach(item => {
    const val = answers[item.id];
    let itemEarned = null, itemMax = item.weight || 0;
    if (item.type === 'checkbox') {
      totalWeight += itemMax;
      itemEarned = val ? itemMax : 0;
      if (item.critical && !val) criticalFail = true;
    } else if (item.type === 'yesno') {
      totalWeight += itemMax;
      itemEarned = val === 'بله' ? itemMax : 0;
      if (item.critical && val === 'خیر') criticalFail = true;
    } else if (item.type === 'rating') {
      const max = item.scaleMax || 5;
      totalWeight += itemMax;
      const num = Number(toEnglishDigits(val)) || 0;
      itemEarned = (num / max) * itemMax;
    } else if (item.type === 'select' && item.correctValue) {
      totalWeight += itemMax;
      itemEarned = val === item.correctValue ? itemMax : 0;
    } else {
      itemEarned = null; // اطلاعاتی (عددی/متنی/انتخابی بدون مقدار صحیح) — در امتیاز محاسبه نمی‌شود
    }
    if (itemEarned !== null) earned += itemEarned;
    details.push({ itemId: item.id, label: item.label, value: val, earned: itemEarned, max: itemMax, critical: !!item.critical });
  });
  const percent = totalWeight > 0 ? Math.round((earned / totalWeight) * 100) : 100;
  let status;
  if (criticalFail) status = 'ناموفق (حیاتی)';
  else if (percent >= (template.passThreshold || 80)) status = 'موفق';
  else status = 'ناموفق';
  return { percent, status, criticalFail, details, totalWeight, earned };
}

function qualityLabel(percent) {
  if (percent >= 95) return 'عالی';
  if (percent >= 80) return 'خوب';
  if (percent >= 60) return 'متوسط';
  if (percent >= 40) return 'ضعیف';
  return 'بحرانی';
}
/* @core-end: scoring */

/* ============================================================
   ۳٫۵. بازرسی دوره‌ای — کلید دوره و پوشش زیرسیستم‌ها
   ============================================================
   هر چک‌لیست یک «دوره» دارد (روزانه/هفتگی/ماهانه/فصلی/سالیانه). برای هر دوره
   یک کلید یکتا ساخته می‌شود (بر پایه‌ی تقویم شمسی) و زیرسیستم‌هایی که در دوره‌ی
   جاری دست‌کم یک بازرسی ثبت‌شده دارند، از فهرست «باقی‌مانده» خارج می‌شوند —
   تا دوره‌ی بعد که کلید عوض می‌شود و فهرست دوباره پر می‌شود. */

/* @core-start: coverage */
const INSPECTION_PERIODS = {
  daily: 'daily', weekly: 'weekly', monthly: 'monthly', quarterly: 'quarterly', annual: 'annual',
};

const PERIOD_LABELS = {
  daily: 'روزانه', weekly: 'هفتگی', monthly: 'ماهانه', quarterly: 'فصلی', annual: 'سالیانه',
};

/** دوره‌ی معتبر یک قالب؛ بدون مقدار/نامعتبر → ماهانه (پیش‌فرض محصول). */
function resolveTemplatePeriod(template) {
  const p = template && template.period;
  return INSPECTION_PERIODS[p] ? p : INSPECTION_PERIODS.monthly;
}

/**
 * کلید یکتای دوره‌ی جاری برای یک لحظه — مرز «لیست دوباره پر می‌شود» همین کلید
 * است. همه‌چیز شمسی است: ماهانه یعنی ماه شمسی، هفتگی یعنی هفته‌ی شمسی که از
 * **شنبه** شروع می‌شود، فصلی یعنی چهار فصل تقویمی.
 */
function periodKey(period, at) {
  const d = (at instanceof Date) ? at : new Date(at === undefined || at === null || at === '' ? Date.now() : at);
  if (isNaN(d.getTime())) return null;
  const j = safeToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  if (!j) return null;
  const jy = j[0], jm = j[1], jd = j[2];
  if (period === INSPECTION_PERIODS.daily) return jy + '/' + pad2(jm) + '/' + pad2(jd);
  if (period === INSPECTION_PERIODS.weekly) {
    // هفته‌ی ایرانی از شنبه شروع می‌شود: شنبه=0، یکشنبه=1، …، جمعه=6
    const offset = (d.getDay() + 1) % 7;
    const ws = new Date(d.getFullYear(), d.getMonth(), d.getDate() - offset);
    const js = safeToJalali(ws.getFullYear(), ws.getMonth() + 1, ws.getDate());
    if (!js) return null;
    return js[0] + '/' + pad2(js[1]) + '/' + pad2(js[2]) + '-W';
  }
  if (period === INSPECTION_PERIODS.monthly) return jy + '/' + pad2(jm);
  if (period === INSPECTION_PERIODS.quarterly) return jy + '/S' + Math.ceil(jm / 3);
  if (period === INSPECTION_PERIODS.annual) return String(jy);
  return null;
}

const QUARTER_NAMES = ['بهار', 'تابستان', 'پاییز', 'زمستان'];

/** برچسب انسانی بازه‌ی جاری برای نمایش («شهریور ۱۴۰۵»، «فصل بهار ۱۴۰۵»، …). */
function periodWindowLabel(period, at) {
  const d = (at instanceof Date) ? at : new Date(at === undefined || at === null || at === '' ? Date.now() : at);
  if (isNaN(d.getTime())) return '';
  const j = safeToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  if (!j) return '';
  const jy = j[0], jm = j[1], jd = j[2];
  const month = jalaliMonthName(jm);
  if (period === INSPECTION_PERIODS.daily) return toPersianDigits(jd) + ' ' + month + ' ' + toPersianDigits(jy);
  if (period === INSPECTION_PERIODS.weekly) {
    const offset = (d.getDay() + 1) % 7;
    const ws = new Date(d.getFullYear(), d.getMonth(), d.getDate() - offset);
    const js = safeToJalali(ws.getFullYear(), ws.getMonth() + 1, ws.getDate());
    return 'هفته‌ی ' + (js ? toPersianDigits(js[2]) + ' ' + jalaliMonthName(js[1]) + ' ' + toPersianDigits(js[0]) : '');
  }
  if (period === INSPECTION_PERIODS.monthly) return month + ' ' + toPersianDigits(jy);
  if (period === INSPECTION_PERIODS.quarterly) return 'فصل ' + QUARTER_NAMES[Math.ceil(jm / 3) - 1] + ' ' + toPersianDigits(jy);
  if (period === INSPECTION_PERIODS.annual) return 'سال ' + toPersianDigits(jy);
  return '';
}

/**
 * پوشش یک قالب در دوره‌ی جاری: زیرسیستم‌ها به دو سطل «انجام‌شده» و
 * «باقی‌مانده» تقسیم می‌شوند. معیار انجام‌شدن: دست‌کم یک رکورد بازرسی برای
 * همان تجهیز و همان قالب که کلید دوره‌اش با کلید دوره‌ی جاری یکی باشد.
 * خروجی: `{ period, key, label, total, done:[{asset,record}], pending:[asset], percent }`.
 */
function templateCoverage(template, assets, records, now) {
  const period = resolveTemplatePeriod(template);
  const at = now || new Date();
  const key = periodKey(period, at);
  const ofTemplate = (assets || []).filter(a => a && template && a.templateId === template.id);
  const doneByAsset = {};
  (records || []).forEach(r => {
    if (!r || !template || r.templateId !== template.id || !r.assetId) return;
    const rk = periodKey(period, r.completedAt || r.createdAt || at);
    if (!rk || rk !== key) return;
    const prev = doneByAsset[r.assetId];
    if (!prev || String(r.completedAt || r.updatedAt || '') >= String(prev.completedAt || prev.updatedAt || '')) {
      doneByAsset[r.assetId] = r;
    }
  });
  const done = [];
  const pending = [];
  ofTemplate.forEach(a => {
    if (doneByAsset[a.id]) done.push({ asset: a, record: doneByAsset[a.id] });
    else pending.push(a);
  });
  return {
    period: period,
    key: key,
    label: periodWindowLabel(period, at),
    total: ofTemplate.length,
    done: done,
    pending: pending,
    percent: ofTemplate.length ? Math.round(done.length / ofTemplate.length * 100) : 0,
  };
}

/**
 * کلید دوره‌ی «قبل» نسبت به یک لحظه — برای تشخیص تأخیر: زیرسیستمی که نه در
 * دوره‌ی جاری و نه در دوره‌ی قبل بازرسی شده باشد، یک دوره عقب است.
 */
function prevPeriodKey(period, at) {
  const d = (at instanceof Date) ? at : new Date(at === undefined || at === null || at === '' ? Date.now() : at);
  if (isNaN(d.getTime())) return null;
  if (period === INSPECTION_PERIODS.daily) {
    const p = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1, 12);
    return periodKey(period, p);
  }
  if (period === INSPECTION_PERIODS.weekly) {
    const p = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 7, 12);
    return periodKey(period, p);
  }
  const j = safeToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  if (!j) return null;
  let jy = j[0], jm = j[1];
  if (period === INSPECTION_PERIODS.monthly) {
    jm -= 1; if (jm < 1) { jm = 12; jy -= 1; }
    return jy + '/' + pad2(jm);
  }
  if (period === INSPECTION_PERIODS.quarterly) {
    const q = Math.ceil(jm / 3);
    if (q === 1) return (jy - 1) + '/S4';
    return jy + '/S' + (q - 1);
  }
  if (period === INSPECTION_PERIODS.annual) return String(jy - 1);
  return null;
}

/**
 * نسبت سپری‌شدن دوره‌ی جاری (۰ تا ۱) — وقتی از آستانه بگذرد و زیرسیستم هنوز
 * بازرسی نشده باشد، در وضعیت «در خطر تأخیر» نمایش داده می‌شود.
 */
function periodElapsedRatio(period, at) {
  const d = (at instanceof Date) ? at : new Date(at === undefined || at === null || at === '' ? Date.now() : at);
  if (isNaN(d.getTime())) return 0;
  if (period === INSPECTION_PERIODS.daily) {
    return (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) / 86400;
  }
  if (period === INSPECTION_PERIODS.weekly) {
    const offset = (d.getDay() + 1) % 7;
    return (offset + d.getHours() / 24) / 7;
  }
  const j = safeToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  if (!j) return 0;
  const jy = j[0], jm = j[1], jd = j[2];
  const fracOfDay = d.getHours() / 24;
  if (period === INSPECTION_PERIODS.monthly) {
    return (jd - 1 + fracOfDay) / jalaliMonthLength(jy, jm);
  }
  if (period === INSPECTION_PERIODS.quarterly) {
    const q = Math.ceil(jm / 3);
    const firstMonth = (q - 1) * 3 + 1;
    let dayOfQuarter = jd - 1;
    for (let m = firstMonth; m < jm; m++) dayOfQuarter += jalaliMonthLength(jy, m);
    let totalDays = 0;
    for (let m = firstMonth; m < firstMonth + 3; m++) totalDays += jalaliMonthLength(jy, m);
    return dayOfQuarter / totalDays;
  }
  if (period === INSPECTION_PERIODS.annual) {
    let dayOfYear = jd - 1;
    for (let m = 1; m < jm; m++) dayOfYear += jalaliMonthLength(jy, m);
    const total = isLeapJalaliYear(jy) ? 366 : 365;
    return dayOfYear / total;
  }
  return 0;
}

const AT_RISK_RATIO = 0.7; // بعد از ۷۰٪ دوره، موارد بی‌بازرسی «در خطر تأخیر»اند

/**
 * هشدارهای پوشش یک قالب:
 * - overdue: زیرسیستم‌هایی که نه این دوره و نه دوره‌ی قبل بازرسی نشده‌اند
 *   (یعنی یک دوره کامل عقب هستند) — مهم‌ترین خروجی برای مدیر.
 * - atRisk: باقی‌مانده‌های دوره‌ی جاری وقتی بیش از آستانه‌ی دوره گذشته باشد.
 */
function coverageAlerts(template, assets, records, now) {
  const period = resolveTemplatePeriod(template);
  const at = now || new Date();
  const cov = templateCoverage(template, assets, records, at);
  const prevKey = prevPeriodKey(period, at);
  const donePrev = {};
  if (prevKey) {
    (records || []).forEach(r => {
      if (!r || !template || r.templateId !== template.id || !r.assetId) return;
      const rk = periodKey(period, r.completedAt || r.createdAt || at);
      if (rk === prevKey) donePrev[r.assetId] = true;
    });
  }
  const overdue = cov.pending.filter(a => !donePrev[a.id]);
  const atRisk = periodElapsedRatio(period, at) >= AT_RISK_RATIO ? cov.pending : [];
  return {
    period: period,
    key: cov.key,
    prevKey: prevKey,
    label: cov.label,
    total: cov.total,
    done: cov.done.length,
    pending: cov.pending,
    overdue: overdue,
    atRisk: atRisk,
    elapsed: periodElapsedRatio(period, at),
  };
}
/* @core-end: coverage */

/* @core-start: permissions */
// نقش‌هایی که اجازه‌ی مدیریت (ساخت/ویرایش/حذف) دارند
const MANAGER_ROLES = ['admin', 'manager'];

// دسترسی نهایی هر کاربر به صفحات: نقش «ادمین» همیشه دسترسی کامل دارد؛ برای
// بقیه‌ی نقش‌ها، در صورت تعریف فهرست اختصاصی (u.pages) همان معیار است، وگرنه
// پیش‌فرض همان نقش اعمال می‌شود. صفحات «کاربران» و «تنظیمات» در هر صورت فقط
// برای نقش «ادمین» فعال می‌شوند و از طریق این فهرست قابل واگذاری نیستند.
// نقش «مشاهده‌گر» هرگز صفحه‌ی «اجرای بازرسی» را نمی‌گیرد (رفع ایراد ۴-۸).
// صفحاتی که همیشه فعال‌اند و از طریق واگذاری دسترسی قابل حذف نیستند.
// «در انتظار امضا» یک صندوق شخصی است (فقط درخواست‌های addressed به خود کاربر،
// به‌علاوه‌ی همه‌ی درخواست‌ها برای ادمین)؛ اگر قابل حذف بود، امکان داشت کاربری
// از دیدن و امضای درخواست‌های خودش قفل شود.
const ALWAYS_ON_PAGES = ['signQueue'];

function effectivePages(user) {
  if (!user) return [];
  let pages;
  if (user.role === 'admin') {
    pages = DEFAULT_PAGES_BY_ROLE.admin.slice();
  } else {
    const base = (user.pages && user.pages.length) ? user.pages : (DEFAULT_PAGES_BY_ROLE[user.role] || []);
    pages = base.filter(p => p !== 'users' && p !== 'settings');
    if (user.role === 'viewer') pages = pages.filter(p => p !== 'runner');
  }
  ALWAYS_ON_PAGES.forEach(p => { if (pages.indexOf(p) === -1) pages.push(p); });
  return pages.filter((p, i) => pages.indexOf(p) === i);
}

/**
 * مجوزهای مؤثر کاربر. این تنها مرجع تصمیم‌گیری است: حتی اگر صفحه‌ای به‌اشتباه
 * به یک کاربر واگذار شده باشد، عملیات نوشتن همچنان با canManage بسته می‌ماند
 * (رفع ایراد ۲-۷).
 */
function buildPermissions(user) {
  if (!user) return { pages: [], isAdmin: false, canManage: false, canExecute: false, canApprove: false, canAssign: false };
  const pages = effectivePages(user);
  const isAdmin = user.role === 'admin';
  const isManagerRole = MANAGER_ROLES.indexOf(user.role) !== -1;
  return {
    pages,
    isAdmin,
    canManage: isAdmin || isManagerRole,
    canExecute: pages.indexOf('runner') !== -1 && user.role !== 'viewer',
    canApprove: isAdmin || user.role === 'approver' || user.role === 'manager',
    canAssign: isAdmin || isManagerRole,
    canViewAllTasks: isAdmin || isManagerRole,
  };
}
/* @core-end: permissions */

/* @core-start: signrequest */
/* =====================================================================
   زنجیره‌ی امضا («جهت امضا») — مدل ب: چند امضای اجباری و ترتیبی

   مسئله: یک برگه‌ی بازرسی در عمل بیش از یک امضا لازم دارد و این امضاها
   ترتیب دارند: اول بازرس (که کار را انجام داده) امضا می‌کند، بعد برگه
   می‌رود پیش ناظر/تحویل‌گیرنده، و در آخر پیش تأییدکننده‌ی نهایی. اگر هر سه
   را «هم‌زمان و اختیاری» بگیریم، در عمل برگه‌های نیمه‌امضا انباشته می‌شوند و
   هیچ‌کس نمی‌داند توپ زمین کیست.

   مدل داده (نسخه ۲): `record.signRequest` یک **زنجیره** است، نه یک درخواست:

     {
       version: 2,
       byUserId, byUserName, requestedAt,      // چه کسی زنجیره را راه انداخت
       status: pending | signed | cancelled,   // وضعیت کل زنجیره
       current: 0,                             // اندیس مرحله‌ی فعال
       steps: [
         { slot, toUserId, toUserName, note, status, signedAt,
           signedByUserId, signedByUserName },
         ...
       ]
     }

   **ترتیبی بودن** از همین ساختار درمی‌آید: فقط `steps[current]` قابل امضا
   است. نفر سوم تا وقتی نفر دوم امضا نکرده، اصلاً در صف خودش این برگه را
   «قابل امضا» نمی‌بیند (در تب «به‌زودی» می‌بیند تا بداند در راه است).

   ⚠️ سازگاری با نسخه‌ی قبل: خروجی `normalizeSignRequest` علاوه بر `steps`،
   فیلدهای تخت مرحله‌ی فعال (`toUserId`/`toUserName`/`slot`/`note`/`signedAt`/…)
   را هم دارد. یعنی داده‌ی تک‌درخواستیِ نسخه‌ی ۸.۲ بدون هیچ مهاجرتی خوانده
   می‌شود و هر کد قدیمی که فیلد تخت می‌خواند همچنان کار می‌کند.

   این بلوک عمداً توابع خالص است تا بدون مرورگر قابل تست باشد.
   ===================================================================== */

const SIGN_REQUEST_STATUS = { PENDING: 'pending', SIGNED: 'signed', CANCELLED: 'cancelled' };

// شیارهایی از record.signatures که می‌توان برایشان درخواست امضا ثبت کرد.
// «بازرس» عمداً اینجا نیست: بازرس همان کسی است که دارد برگه را پر می‌کند و
// همان‌جا و همان لحظه امضا می‌کند (مرحله‌ی ۱ زنجیره). ارجاع‌شدنی‌ها این دوتا هستند.
const SIGN_SLOTS = {
  approver: { key: 'approver', label: 'ناظر / تحویل‌گیرنده', step: 2 },
  manager: { key: 'manager', label: 'تأییدکننده نهایی', step: 3 },
};

/** ترتیب ثابت شیارها در زنجیره. اندیس آرایه = ترتیب مراجعه. */
const SIGN_SLOT_SEQUENCE = ['approver', 'manager'];

/** برچسب کامل هر مرحله برای نمایش (مرحله‌ی ۱ همیشه خودِ بازرس است). */
const SIGN_CHAIN_LABELS = ['بازرس / اجراکننده', 'ناظر / تحویل‌گیرنده', 'تأییدکننده نهایی'];

const SIGN_REQUEST_STATUS_LABELS = {
  pending: 'در انتظار امضا',
  signed: 'امضا شد',
  cancelled: 'لغو شد',
};

/* ---------------------------------------------------------------------------
   حالت جریان امضا (تنظیمات سازمان)

   'chain'  → مدل ب (پیش‌فرض): سه امضای اجباری و ترتیبی.
   'single' → رفتار نسخه‌ی ۸.۲: حداکثر یک ارجاع اختیاری به ناظر.

   چرا پیش‌فرض chain است: خواسته‌ی محصول همین است و سازمانی که واقعاً فقط یک
   امضا می‌خواهد، یک تیک در «تنظیمات ← جریان امضا» می‌زند. عکسش (پیش‌فرض
   single) یعنی سازمان‌هایی که زنجیره می‌خواهند بی‌صدا برگه‌ی تک‌امضا ثبت کنند.
   --------------------------------------------------------------------------- */
const SIGN_FLOW_MODES = { SINGLE: 'single', CHAIN: 'chain' };

function resolveSignFlowMode(settings) {
  const m = settings && settings.signFlowMode;
  return m === SIGN_FLOW_MODES.SINGLE ? SIGN_FLOW_MODES.SINGLE : SIGN_FLOW_MODES.CHAIN;
}

function isSignChainMode(settings) {
  return resolveSignFlowMode(settings) === SIGN_FLOW_MODES.CHAIN;
}

/** شیارهایی که در حالت فعلی باید تعیین شوند. */
function requiredSignSlots(settings) {
  return isSignChainMode(settings) ? SIGN_SLOT_SEQUENCE.slice() : [];
}

/* ---------------------------------------------------------------------------
   تعداد امضاکنندگان در سطحِ خودِ چک‌لیست (قالب)

   خواسته‌ی محصول: همان اول که چک‌لیست ساخته می‌شود مشخص باشد چند نفر باید
   امضا کنند — نه این‌که یک تنظیم سازمانی روی همه‌ی برگه‌ها تحمیل شود.
   فیلد `template.signers`:
     ۱ → فقط بازرس (همان‌جا، در محل، امضا می‌شود)
     ۲ → بازرس + ناظر/تحویل‌گیرنده
     ۳ → بازرس + ناظر/تحویل‌گیرنده + تأییدکننده‌ی نهایی

   قالب‌های قدیمی این فیلد را ندارند؛ در آن حالت رفتار قبلی (حالت جریان
   امضای سازمان) پابرجاست تا هیچ برگه‌ای بی‌صدا تغییر رفتار ندهد.
   --------------------------------------------------------------------------- */

/** تعداد امضاکنندگان لازم برای یک قالب؛ بدون فیلد → ارث از تنظیم سازمان. */
function templateSignerCount(template, settings) {
  const n = Number(template && template.signers);
  if (n === 1 || n === 2 || n === 3) return n;
  return isSignChainMode(settings) ? 3 : 1;
}

/** شیارهای ارجاع‌شدنی متناسب با تعداد امضاکنندگان (مرحله‌ی ۱ خود بازرس است). */
function signSlotsForCount(n) {
  if (n >= 3) return SIGN_SLOT_SEQUENCE.slice();
  if (n === 2) return [SIGN_SLOT_SEQUENCE[0]];
  return [];
}

/** برچسب فارسی تعداد امضا برای نمایش در قالب‌ها و صفحه‌ی اجرا. */
function signerCountLabel(n) {
  if (n >= 3) return '۳ امضا (بازرس، ناظر، تأییدکننده)';
  if (n === 2) return '۲ امضا (بازرس و ناظر)';
  return '۱ امضا (فقط بازرس، در محل)';
}

/** یک مرحله‌ی زنجیره را نرمال می‌کند؛ بدون گیرنده → null. */
function normalizeSignStep(raw, fallbackSlot) {
  if (!raw || typeof raw !== 'object') return null;
  const toUserId = String(raw.toUserId || '');
  if (!toUserId) return null;
  const slot = SIGN_SLOTS[raw.slot]
    ? raw.slot
    : (SIGN_SLOTS[fallbackSlot] ? fallbackSlot : SIGN_SLOT_SEQUENCE[0]);
  const status = SIGN_REQUEST_STATUS_LABELS[raw.status] ? raw.status : SIGN_REQUEST_STATUS.PENDING;
  // «ارجاع در محل»: اگر گیرنده‌ی مرحله بدون امضا برگه را به کس دیگری فرستاده
  // باشد، ردپایش برای گزارش/پیگیری نگه داشته می‌شود.
  const rf = raw.referredFrom;
  const referredFrom = (rf && typeof rf === 'object' && rf.userId) ? {
    userId: String(rf.userId),
    userName: String(rf.userName || ''),
    at: Number(rf.at) || 0,
  } : null;
  return {
    slot: slot,
    toUserId: toUserId,
    toUserName: String(raw.toUserName || ''),
    note: String(raw.note || '').slice(0, 500),
    status: status,
    signedAt: Number(raw.signedAt) || 0,
    signedByUserId: String(raw.signedByUserId || ''),
    signedByUserName: String(raw.signedByUserName || ''),
    referredFrom: referredFrom,
    // «امضای حضوری»: این مرحله روی دستگاه فرد دیگری (معمولاً بازرس) امضا شده
    onsite: !!raw.onsite,
    onsiteCollectorName: String(raw.onsiteCollectorName || ''),
    // «ارجاعی از ابتدا»: هنگام ساخت زنجیره تعیین شده که این مرحله حضوری
    // پرسیده نشود — مستقیم به صف «در انتظار امضا»ی گیرنده برود.
    skipOnsitePrompt: !!raw.skipOnsitePrompt,
  };
}

/**
 * فیلدهای زنجیره‌ی امضا را نرمال می‌کند؛ ورودی نامعتبر → null.
 * هم شکل نسخه‌ی ۲ (با `steps`) و هم شکل تکِ نسخه‌ی قبل را می‌پذیرد.
 */
function normalizeSignRequest(sr) {
  if (!sr || typeof sr !== 'object' || Array.isArray(sr)) return null;

  let steps;
  if (Array.isArray(sr.steps)) {
    steps = sr.steps
      .map((s, i) => normalizeSignStep(s, SIGN_SLOT_SEQUENCE[i]))
      .filter(Boolean);
  } else {
    // داده‌ی نسخه‌ی ۸.۲: یک درخواست تخت → زنجیره‌ی یک‌مرحله‌ای
    const one = normalizeSignStep(sr, sr.slot);
    steps = one ? [one] : [];
  }
  if (!steps.length) return null;

  // یک شیار نباید دوبار در زنجیره بیاید، وگرنه امضای دوم روی اولی می‌نشیند
  const seen = {};
  steps = steps.filter(s => {
    if (seen[s.slot]) return false;
    seen[s.slot] = true;
    return true;
  });

  const declared = SIGN_REQUEST_STATUS_LABELS[sr.status] ? sr.status : null;
  let status;
  if (declared === SIGN_REQUEST_STATUS.CANCELLED || steps.some(s => s.status === SIGN_REQUEST_STATUS.CANCELLED)) {
    status = SIGN_REQUEST_STATUS.CANCELLED;
  } else if (steps.every(s => s.status === SIGN_REQUEST_STATUS.SIGNED)) {
    status = SIGN_REQUEST_STATUS.SIGNED;
  } else {
    status = SIGN_REQUEST_STATUS.PENDING;
  }

  let current = steps.findIndex(s => s.status === SIGN_REQUEST_STATUS.PENDING);
  if (current < 0) current = steps.length;
  const mirror = steps[current] || steps[steps.length - 1];

  return {
    version: 2,
    steps: steps,
    current: current,
    status: status,
    byUserId: String(sr.byUserId || ''),
    byUserName: String(sr.byUserName || ''),
    requestedAt: Number(sr.requestedAt) || 0,
    // ---- آینه‌ی مرحله‌ی فعال: سازگاری رو به عقب ----
    slot: mirror.slot,
    toUserId: mirror.toUserId,
    toUserName: mirror.toUserName,
    note: mirror.note,
    signedAt: mirror.signedAt,
    signedByUserId: mirror.signedByUserId,
    signedByUserName: mirror.signedByUserName,
  };
}

/** مرحله‌ی فعالِ قابل امضا، یا null اگر زنجیره باز نباشد. */
function activeSignStep(sr) {
  if (!sr || sr.status !== SIGN_REQUEST_STATUS.PENDING) return null;
  return sr.steps[sr.current] || null;
}

/**
 * یک زنجیره‌ی امضای تازه می‌سازد.
 * `steps` آرایه‌ای از `{ toUser, slot?, note? }` به ترتیب مراجعه است.
 */
function makeSignChain({ steps, byUser, at }) {
  if (!Array.isArray(steps)) return null;
  const now = Number(at) || Date.now();
  const built = [];
  const used = {};
  steps.forEach((s, i) => {
    const toUser = s && s.toUser;
    if (!toUser || !toUser.id) return;
    const slot = (s && SIGN_SLOTS[s.slot])
      ? s.slot
      : SIGN_SLOT_SEQUENCE[Math.min(i, SIGN_SLOT_SEQUENCE.length - 1)];
    if (used[slot]) return;
    used[slot] = true;
    built.push({
      slot: slot,
      toUserId: String(toUser.id),
      toUserName: String(toUser.name || toUser.username || ''),
      note: String((s && s.note) || '').slice(0, 500),
      status: SIGN_REQUEST_STATUS.PENDING,
      signedAt: 0,
      signedByUserId: '',
      signedByUserName: '',
      skipOnsitePrompt: !!(s && s.skipOnsitePrompt),
    });
  });
  if (!built.length) return null;
  // ترتیب خروجی همیشه ترتیب استاندارد شیارهاست، نه ترتیب تصادفی ورودی
  built.sort((a, b) => SIGN_SLOT_SEQUENCE.indexOf(a.slot) - SIGN_SLOT_SEQUENCE.indexOf(b.slot));
  return normalizeSignRequest({
    version: 2,
    steps: built,
    byUserId: String((byUser && byUser.id) || ''),
    byUserName: String((byUser && (byUser.name || byUser.username)) || ''),
    requestedAt: now,
    status: SIGN_REQUEST_STATUS.PENDING,
  });
}

/** زنجیره‌ی تک‌مرحله‌ای (سازگاری با نسخه‌ی قبل و حالت `single`). */
function makeSignRequest({ toUser, byUser, slot, note, at }) {
  return makeSignChain({ steps: [{ toUser: toUser, slot: slot, note: note }], byUser: byUser, at: at });
}

/** آیا این رکورد زنجیره‌ی امضای باز دارد؟ */
function isPendingSignRequest(rec) {
  if (!rec) return false;
  const sr = normalizeSignRequest(rec.signRequest);
  return !!sr && sr.status === SIGN_REQUEST_STATUS.PENDING;
}

/**
 * چه کسی اجازه دارد **همین حالا** امضا کند؟
 * فقط گیرنده‌ی **مرحله‌ی فعال**، یا ادمین (برای روزی که گیرنده در دسترس نیست).
 * مدیر بدون ادمین بودن نمی‌تواند جای او امضا کند، چون امضا یک اظهار شخصی است
 * و نباید قابل جانشینی ضمنی باشد.
 *
 * ترتیبی بودن مدل ب دقیقاً همین‌جا اعمال می‌شود: گیرنده‌ی مرحله‌ی ۳ تا وقتی
 * مرحله‌ی ۲ امضا نشده، `false` می‌گیرد.
 */
function canSignRequest(rec, user, perms) {
  if (!rec || !user) return false;
  const step = activeSignStep(normalizeSignRequest(rec.signRequest));
  if (!step) return false;
  if (perms && perms.isAdmin) return true;
  return step.toUserId === String(user.id);
}

/** آیا این کاربر اساساً این رکورد را در صف خودش می‌بیند؟ */
function canSeeSignRequest(rec, user, perms) {
  if (!rec || !user) return false;
  const sr = normalizeSignRequest(rec.signRequest);
  if (!sr) return false;
  if (perms && perms.isAdmin) return true;
  const me = String(user.id);
  if (sr.byUserId === me) return true;                 // ارجاع‌دهنده، برای پیگیری
  return sr.steps.some(s => s.toUserId === me);        // هر گیرنده‌ای در زنجیره
}

/* حداکثر تعداد کارت‌هایی که در یک تب رندر می‌شود (رفع ایراد P2-۷).
   با ۵۰۰ درخواست باز، رندر یک‌جای همه‌ی کارت‌ها رابط کاربری را قفل می‌کرد؛
   حالا بقیه با «نمایش بیشتر» و به‌تدریج اضافه می‌شوند. */
const SIGN_QUEUE_PAGE_SIZE = 40;

/**
 * صف امضا را از روی رکوردها می‌سازد.
 *
 * سه سطل برمی‌گرداند (رفع ایراد P2-۷):
 *  - `toSign`   : زنجیره‌هایی که **مرحله‌ی فعالشان خطاب به خودِ کاربر** است.
 *  - `adminAll` : (فقط ادمین) بقیه‌ی مراحل فعال — حق «امضا به جانشینی» ادمین،
 *                 در تب جداگانه تا صف شخصی‌اش و شمارنده‌ی منو غول‌آسا نشود.
 *  - `tracking` : آنچه کاربر ارجاع داده، به‌علاوه‌ی زنجیره‌هایی که کاربر گیرنده‌ی
 *                 مرحله‌ی **بعدی** آن‌هاست (`upcoming: true`) — تا بداند در راه
 *                 است ولی هنوز نوبتش نشده. برای ادمین، همه‌ی موارد بسته‌شده.
 */
function buildSignQueue(records, user, perms) {
  const empty = { toSign: [], adminAll: [], tracking: [] };
  if (!Array.isArray(records) || !user) return empty;
  const toSign = [];
  const adminAll = [];
  const tracking = [];
  const isAdmin = !!(perms && perms.isAdmin);
  const me = String(user.id);
  records.forEach(rec => {
    if (!rec || rec.deleted) return;
    const sr = normalizeSignRequest(rec.signRequest);
    if (!sr) return;
    const pending = sr.status === SIGN_REQUEST_STATUS.PENDING;
    const active = pending ? (sr.steps[sr.current] || null) : null;
    const item = { record: rec, signRequest: sr, step: active, stepIndex: sr.current };
    if (active && active.toUserId === me) {
      toSign.push(Object.assign({ mine: true }, item));
    } else if (pending && isAdmin) {
      adminAll.push(Object.assign({ mine: false }, item));
    } else if (sr.byUserId === me || isAdmin) {
      tracking.push(item);
    } else if (pending && sr.steps.some((s, i) => i > sr.current && s.toUserId === me)) {
      // نوبت من نشده ولی در زنجیره هستم — باید ببینم که در راه است
      tracking.push(Object.assign({ upcoming: true }, item));
    }
  });
  const byOldest = (a, b) => (a.signRequest.requestedAt || 0) - (b.signRequest.requestedAt || 0);
  toSign.sort(byOldest);
  adminAll.sort(byOldest);
  tracking.sort(byOldest);
  return { toSign: toSign, adminAll: adminAll, tracking: tracking };
}

/**
 * نام نمایشی یک کاربر برای امضا. تنها مرجع، **حساب کاربری** است — نه آنچه
 * کاربر روی پد امضا تایپ می‌کند (وگرنه هر کسی می‌توانست هر نامی بنویسد).
 * اگر حساب فاقد name و username باشد، رشته‌ی خالی برمی‌گرداند و فراخوان
 * باید امضا را مسدود کند (ایراد P2-۸: پیش‌تر بی‌صدا به نامِ تایپ‌شده
 * بازمی‌گشت و امکان ثبت امضای بی‌نام وجود داشت).
 */
function resolveSignerName(user) {
  // اول trim، بعد fallback: نامِ «فقط فاصله» یک رشته‌ی truthy است، پس با
  // `user.name || user.username` هرگز به username نمی‌رسیدیم و کاربر بی‌دلیل
  // از امضا مسدود می‌شد.
  if (!user) return '';
  const name = String(user.name || '').trim();
  if (name) return name;
  return String(user.username || '').trim();
}

/**
 * امضا را روی **مرحله‌ی فعال** اعمال می‌کند و زنجیره را یک قدم جلو می‌برد.
 * رکورد تازه برمی‌گرداند (ورودی را تغییر نمی‌دهد) تا با immer/تست‌ها سازگار باشد.
 * وقتی آخرین مرحله امضا شود، وضعیت کل زنجیره `signed` می‌شود.
 */
function applySignatureToRecord(rec, signature, user, at) {
  if (!rec) return null;
  const sr = normalizeSignRequest(rec.signRequest);
  const step = activeSignStep(sr);
  if (!step) return null;
  if (!signature || !signature.image) return null;
  const signerName = resolveSignerName(user);
  // امضای بی‌نام ثبت نمی‌شود: در گزارش‌ها و PDF هیچ ردپایی از امضاکننده نمی‌ماند
  if (!signerName) return null;
  const now = Number(at) || Date.now();
  const idx = sr.current;

  const out = Object.assign({}, rec);
  out.signatures = Object.assign({}, rec.signatures);
  out.signatures[step.slot] = Object.assign({}, signature, {
    name: signerName,
    signedViaRequest: true,
    requestedByUserId: sr.byUserId,
    signedAt: Number(signature.signedAt) || now,
    stepIndex: idx,
  });

  const steps = sr.steps.map((s, i) => (i === idx
    ? Object.assign({}, s, {
        status: SIGN_REQUEST_STATUS.SIGNED,
        signedAt: now,
        signedByUserId: String((user && user.id) || ''),
        signedByUserName: signerName,
      })
    : s));

  // وضعیت کل زنجیره را عمداً دوباره محاسبه می‌کنیم (نه ست‌کردن دستی)، تا
  // «آیا مرحله‌ی بعدی مانده؟» یک جای واحد تصمیم‌گیری داشته باشد.
  out.signRequest = normalizeSignRequest(Object.assign({}, sr, {
    steps: steps, status: SIGN_REQUEST_STATUS.PENDING,
  }));
  out.updatedAt = now;
  return out;
}

/**
 * «امضای حضوری در محل»: گیرنده‌ی مرحله‌ی فعال کنار دستگاهِ فرد دیگری (معمولاً
 * بازرس) ایستاده است و امضایش همان‌جا روی همین دستگاه گرفته می‌شود — بدون
 * نیاز به ارجاع و بدون این‌که گیرنده حساب/دستگاه جدا داشته باشد.
 *
 * امضا به نام **خودِ گیرنده** ثبت می‌شود (signedBy = گیرنده، نه نفرِ پشت
 * دستگاه)؛ برای شفافیت ممیزی، نشانِ `onsite` و نام دریافت‌کننده‌ی دستگاه روی
 * هم مرحله و هم امضای ثبت‌شده می‌ماند. ترتیب زنجیره دست‌نخورده می‌ماند چون
 * فقط مرحله‌ی فعال قابل امضای حضوری است.
 * ورودی `toUser` = گیرنده‌ی مرحله؛ `collector` = صاحبِ دستگاه (بازرس).
 */
function applyOnsiteSignatureToRecord(rec, signature, toUser, collector, at) {
  if (!rec || !toUser || !toUser.id) return null;
  const srBefore = normalizeSignRequest(rec.signRequest);
  const act = activeSignStep(srBefore);
  if (!act) return null;
  // فقط مرحله‌ی فعال و فقط با گیرنده‌ی خودِ همان مرحله
  if (String(act.toUserId) !== String(toUser.id)) return null;
  const done = applySignatureToRecord(rec, signature, toUser, at);
  if (!done) return null;
  const out = Object.assign({}, done);
  const collectorName = resolveSignerName(collector);
  // نشان «امضا در محل» روی امضای ثبت‌شده
  out.signatures = Object.assign({}, out.signatures);
  if (out.signatures[act.slot]) {
    out.signatures[act.slot] = Object.assign({}, out.signatures[act.slot], {
      onsite: true,
      onsiteCollectorName: collectorName,
    });
  }
  // نشان روی مرحله‌ی همان‌امضاشده (اندیسش = currentِ پیش از پیشرفت زنجیره)
  const srAfter = normalizeSignRequest(out.signRequest);
  if (srAfter) {
    const idx = srBefore.current;
    const steps2 = srAfter.steps.map((s, i) => (i === idx
      ? Object.assign({}, s, { onsite: true, onsiteCollectorName: collectorName })
      : s));
    out.signRequest = normalizeSignRequest(Object.assign({}, srAfter, {
      steps: steps2, status: SIGN_REQUEST_STATUS.PENDING,
    }));
  }
  return out;
}

/** لغو کل زنجیره توسط ادمین یا خودِ درخواست‌کننده. مراحل امضاشده دست‌نخورده می‌مانند. */
function cancelSignRequest(rec, user, perms, at) {
  if (!rec) return null;
  const sr = normalizeSignRequest(rec.signRequest);
  if (!sr || sr.status !== SIGN_REQUEST_STATUS.PENDING) return null;
  const isAdmin = !!(perms && perms.isAdmin);
  if (!isAdmin && sr.byUserId !== String((user && user.id) || '')) return null;
  const now = Number(at) || Date.now();
  const steps = sr.steps.map(s => (s.status === SIGN_REQUEST_STATUS.PENDING
    ? Object.assign({}, s, { status: SIGN_REQUEST_STATUS.CANCELLED, signedAt: now })
    : s));
  const out = Object.assign({}, rec);
  out.signRequest = normalizeSignRequest(Object.assign({}, sr, {
    steps: steps, status: SIGN_REQUEST_STATUS.CANCELLED,
  }));
  out.updatedAt = now;
  return out;
}

/**
 * پیشرفت زنجیره برای نمایش: «مرحله‌ی ۲ از ۳».
 * مرحله‌ی ۱ همیشه امضای خودِ بازرس است و در `steps` نمی‌آید، پس به total
 * یکی اضافه می‌شود.
 */
function signChainProgress(rec) {
  const hasInspector = !!(rec && rec.signatures && rec.signatures.inspector);
  const sr = normalizeSignRequest(rec && rec.signRequest);
  if (!sr) {
    const extra = ['approver', 'manager'].filter(k => rec && rec.signatures && rec.signatures[k]).length;
    return {
      sr: null, active: null, stepIndex: -1,
      total: 1 + extra, done: (hasInspector ? 1 : 0) + extra,
      status: hasInspector ? SIGN_REQUEST_STATUS.SIGNED : SIGN_REQUEST_STATUS.PENDING,
    };
  }
  const signedSteps = sr.steps.filter(s => s.status === SIGN_REQUEST_STATUS.SIGNED).length;
  return {
    sr: sr,
    active: activeSignStep(sr),
    stepIndex: sr.current,
    total: sr.steps.length + 1,
    done: (hasInspector ? 1 : 0) + signedSteps,
    status: sr.status,
  };
}

/** برچسب کوتاه فارسی برای نشان‌دادن وضعیت زنجیره در فهرست سوابق. */
function signChainLabel(rec) {
  const p = signChainProgress(rec);
  if (!p.sr) return '';
  if (p.status === SIGN_REQUEST_STATUS.CANCELLED) return 'زنجیره‌ی امضا لغو شد';
  if (p.status === SIGN_REQUEST_STATUS.SIGNED) return 'همه‌ی امضاها کامل شد';
  const who = (p.active && p.active.toUserName) || '—';
  const n = (p.stepIndex || 0) + 2;   // +1 برای امضای بازرس، +1 برای شماره‌ی انسانی
  return 'در انتظار امضای مرحله ' + n + ' از ' + p.total + ' — ' + who;
}

/** برچسب شیار (برای پد امضا و PDF). */
function signSlotLabel(slot) {
  return (SIGN_SLOTS[slot] && SIGN_SLOTS[slot].label) || slot || '';
}

/**
 * کاربران مجاز برای ارجاع امضا: فقط کسانی که فعال باشند و نقششان اساساً اجازه‌ی
 * تأیید داشته باشد. ارجاع به کاربر غیرفعال یا «مشاهده‌گر» بن‌بست می‌سازد.
 * `excludeIds` برای این است که نفر سوم نتواند همان نفر دوم باشد (وگرنه یک
 * نفر دو امضای «مستقل» می‌زند و کل هدف زنجیره از بین می‌رود).
 */
function signRequestCandidates(users, currentUser, excludeIds) {
  if (!Array.isArray(users)) return [];
  const meId = String((currentUser && currentUser.id) || '');
  const blocked = {};
  (excludeIds || []).forEach(id => { if (id) blocked[String(id)] = true; });
  return users.filter(u => {
    if (!u || !u.id) return false;
    if (String(u.id) === meId) return false;           // ارجاع به خود بی‌معناست
    if (blocked[String(u.id)]) return false;           // قبلاً در زنجیره انتخاب شده
    if (u.active === false) return false;              // کاربر غیرفعال نمی‌تواند وارد شود
    return buildPermissions(u).canApprove;
  });
}

/**
 * اعتبارسنجی انتخاب‌های بازرس پیش از ثبت برگه.
 * `selection` = `{ approver: userId, manager: userId }`.
 * خروجی: پیام خطا (رشته) یا null اگر همه‌چیز درست است.
 *
 * جدا از UI نوشته شده تا قابل تست باشد — دقیقاً همان جایی که مدل ب می‌تواند
 * بی‌صدا خراب شود (مثلاً یک نفر برای هر دو مرحله).
 *
 * پارامتر اختیاری `slots`: وقتی قالب تعداد امضاکنندگان خودش را دارد، شیارهای
 * لازم مستقیم از قالب می‌آیند (مثلاً فقط ['approver']) نه از تنظیم سازمان.
 */
function validateSignChain(selection, users, currentUser, settings, slots) {
  // آرایه‌ی صریح (حتی خالی) مقدم است؛ فقط «داده‌نشدن» به تنظیم سازمان برمی‌گردد.
  const reqSlots = Array.isArray(slots)
    ? slots.filter(s => SIGN_SLOTS[s])
    : (isSignChainMode(settings) ? SIGN_SLOT_SEQUENCE.slice() : []);
  if (!reqSlots.length) return null;
  const sel = selection || {};
  const byId = {};
  (users || []).forEach(u => { if (u && u.id) byId[String(u.id)] = u; });
  const chosen = [];
  for (const slot of reqSlots) {
    const id = String(sel[slot] || '');
    const label = signSlotLabel(slot);
    if (!id) return 'تعیین «' + label + '» الزامی است.';
    const u = byId[id];
    if (!u) return 'کاربر انتخاب‌شده برای «' + label + '» معتبر نیست.';
    if (u.active === false) return 'کاربر «' + (u.name || u.username) + '» غیرفعال است و نمی‌تواند امضا کند.';
    if (!buildPermissions(u).canApprove) return 'کاربر «' + (u.name || u.username) + '» اجازه‌ی تأیید/امضا ندارد.';
    if (currentUser && String(currentUser.id) === id) return 'خودتان نمی‌توانید گیرنده‌ی مرحله‌ی «' + label + '» باشید.';
    if (chosen.indexOf(id) > -1) return 'یک نفر نمی‌تواند دو مرحله‌ی زنجیره را امضا کند؛ برای هر مرحله فرد متفاوتی انتخاب کنید.';
    chosen.push(id);
  }
  return null;
}

/**
 * چه کسی می‌تواند مرحله‌ی فعال را به کس دیگری **ارجاع** دهد؟
 * همان قوانین امضا: گیرنده‌ی خودِ مرحله یا ادمین. ارجاع هم مثل امضا یک
 * تصمیم شخصی است — ناظرِ نفر بعدی نمی‌تواند از نوبت خودش جلو بزند.
 */
function canReferSignRequest(rec, user, perms) {
  if (!rec || !user) return false;
  const step = activeSignStep(normalizeSignRequest(rec.signRequest));
  if (!step) return false;
  if (perms && perms.isAdmin) return true;
  return step.toUserId === String(user.id);
}

/**
 * ارجاع مرحله‌ی فعال به کاربری دیگر («امضا در محل یا ارجاع»).
 *
 * گیرنده‌ای که در محل حاضر نیست یا به هر دلیل دیگری نمی‌تواند امضا کند،
 * به‌جای نگه‌داشتن برگه، آن می‌تواند با ذکر توضیح به فرد واجد شرایط دیگری
 * بفرستد. گیرنده‌ی جدید جایگزین می‌شود و ردپای ارجاع (`referredFrom`) در
 * مرحله می‌ماند. برگه‌ی جدید برمی‌گرداند؛ اگر شرایط برقرار نباشد `null`.
 *
 * شرط‌های گیرنده‌ی تازه: فعال باشد، اجازه‌ی تأیید داشته باشد، خودِ
 * ارجاع‌دهنده یا بازرس نباشد، پیش‌تر در همین زنجیره امضا نکرده باشد و
 * گیرنده‌ی مرحله‌ی بازِ دیگری هم نباشد (ورنه یک نفر دو جا گیر می‌کند).
 */
function referSignRequest(rec, ref, perms, at) {
  if (!rec) return null;
  const sr = normalizeSignRequest(rec.signRequest);
  const step = activeSignStep(sr);
  if (!step) return null;
  const byUser = ref && ref.byUser;
  const toUser = ref && ref.toUser;
  if (!byUser || !byUser.id || !toUser || !toUser.id) return null;

  const isAdmin = !!(perms && perms.isAdmin);
  if (!isAdmin && step.toUserId !== String(byUser.id)) return null;

  const toId = String(toUser.id);
  if (toUser.active === false) return null;
  if (!buildPermissions(toUser).canApprove) return null;
  if (toId === String(byUser.id)) return null;                       // ارجاع به خود بی‌معناست
  if (rec.inspectorId && toId === String(rec.inspectorId)) return null; // بازرس که همان‌جا امضا کرده

  if (sr.steps.some((s, i) => i !== sr.current && s.status === SIGN_REQUEST_STATUS.PENDING && s.toUserId === toId)) return null;

  const now = Number(at) || Date.now();
  const idx = sr.current;
  const note = String((ref.note) || '').trim().slice(0, 500);
  const steps = sr.steps.map((s, i) => (i === idx
    ? Object.assign({}, s, {
        toUserId: toId,
        toUserName: String(toUser.name || toUser.username || ''),
        note: note || s.note,
        referredFrom: {
          userId: String(byUser.id),
          userName: String(byUser.name || byUser.username || ''),
          at: now,
        },
      })
    : s));
  const out = Object.assign({}, rec);
  out.signRequest = normalizeSignRequest(Object.assign({}, sr, {
    steps: steps, status: SIGN_REQUEST_STATUS.PENDING,
  }));
  out.updatedAt = now;
  return out;
}
